<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Viewport removed - desktop only -->

  <title>Authenticating - Mamagan Beach Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans min-h-screen flex items-center justify-center">
  <div id="loading-state" class="text-center">
    <div class="w-16 h-16 border-4 border-ocean-200 border-t-ocean-500 rounded-full animate-spin mx-auto mb-4"></div>
    <h1 class="text-xl font-semibold text-gray-800">Signing you in...</h1>
    <p class="text-gray-500 mt-1">Please wait a moment</p>
  </div>

  <div id="error-state" class="hidden max-w-md w-full mx-4">
    <div class="bg-white rounded-2xl shadow-sm border border-red-100 p-8 text-center">
      <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-gray-900 mb-2">Authentication Failed</h1>
      <p id="error-message" class="text-gray-500 mb-6">Unable to sign in with the selected provider.</p>
      <div id="error-details" class="bg-red-50 rounded-lg p-4 mb-6 text-left text-sm text-red-700 hidden"></div>
      <a href="/login.html" class="inline-block px-6 py-3 bg-ocean-500 text-white font-semibold rounded-xl hover:bg-ocean-600 transition">
        Back to Sign In
      </a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const error = params.get('error');

    if (token) {
      localStorage.setItem('token', token);
      window.location.href = '/';
    } else if (error) {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');

      const errorMessages = {
        'google_auth_failed': 'Google authentication failed. This usually happens when:\n\n1. Your Google app is still in "Testing" mode\n2. Your email is not added as a test user\n3. The redirect URI does not match exactly\n\nPlease check the AUTH_SETUP.md guide for the fix.',
        'facebook_auth_failed': 'Facebook authentication failed. Please verify your Facebook app settings and ensure the redirect URI is configured correctly.',
        'auth_failed': 'Authentication was cancelled or failed. Please try again.',
        'oauth_failed': 'OAuth authentication failed. Please check your provider configuration.'
      };

      const message = errorMessages[error] || 'An unknown error occurred during authentication.';
      document.getElementById('error-message').textContent = message.split('\n')[0];

      const detailsDiv = document.getElementById('error-details');
      if (message.includes('\n')) {
        detailsDiv.innerHTML = message.split('\n').slice(1).join('<br>');
        detailsDiv.classList.remove('hidden');
      }
    } else {
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
