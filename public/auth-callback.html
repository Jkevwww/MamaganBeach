<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating | Mamagan Beach Resort Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-lux-dark font-sans text-lux-navy min-h-screen flex items-center justify-center relative overflow-hidden">
  <!-- Premium Background -->
  <div class="absolute inset-0 z-0">
    <div class="absolute inset-0 bg-lux-navy/60 z-10"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-lux-navy/20 to-lux-navy/80 z-20"></div>
    <div class="absolute inset-0 bg-[url('/images/backgrounds/background.jpg')] bg-cover bg-center scale-105 animate-pulse-slow"></div>
  </div>

  <main class="relative z-30 w-full max-w-md px-6 page-transition">
    <div id="loading-state" class="text-center">
      <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-white/10 backdrop-blur-xl border border-white/20 mb-8 animate-pulse">
        <i class="fas fa-crown text-lux-gold text-4xl"></i>
      </div>
      <h1 class="luxury-heading text-4xl font-bold text-white mb-4 drop-shadow-lg">Authenticating</h1>
      <p class="text-white font-medium tracking-widest text-[10px] uppercase bg-lux-navy/30 inline-block px-4 py-1 rounded-full backdrop-blur-sm">Establishing your secure connection</p>
      
      <div class="mt-12 flex justify-center gap-2">
        <div class="w-2 h-2 bg-lux-gold rounded-full animate-bounce" style="animation-delay: 0s"></div>
        <div class="w-2 h-2 bg-lux-gold rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
        <div class="w-2 h-2 bg-lux-gold rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
      </div>
    </div>

    <div id="error-state" class="hidden">
      <div class="bg-white/95 p-10 rounded-[2.5rem] premium-shadow border border-white/20 backdrop-blur-2xl text-center">
        <div class="w-20 h-20 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-8 border border-red-500/20">
          <i class="fas fa-circle-exclamation text-red-600 text-3xl"></i>
        </div>
        <h1 class="luxury-heading text-3xl font-bold text-lux-navy mb-4">Verification Failed</h1>
        <p id="error-message" class="text-lux-navy/60 text-sm mb-8 italic font-light">"Unable to establish your identity."</p>
        
        <div id="error-details" class="bg-lux-cream/50 rounded-2xl p-6 mb-8 text-left text-[10px] font-bold uppercase tracking-widest text-lux-navy/40 hidden"></div>
        
        <a href="/login.html" class="premium-button-gold w-full flex items-center justify-center gap-4 py-5 shadow-xl">
          <span class="text-xs">Return to Sanctuary</span>
          <i class="fas fa-arrow-left text-xs"></i>
        </a>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const error = params.get('error');

    if (token) {
      localStorage.setItem('token', token);
      setTimeout(() => {
        window.location.href = '/';
      }, 1500); // Aesthetic delay
    } else if (error) {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');

      const errorMessages = {
        'google_auth_failed': 'Google authentication failed. Please verify your identity settings.',
        'github_auth_failed': 'GitHub authentication failed. Please verify your connection settings.',
        'auth_failed': 'The authentication request was declined or timed out.',
        'oauth_failed': 'The external provider reported a configuration discrepancy.'
      };

      const message = errorMessages[error] || 'An unexpected anomaly occurred during verification.';
      document.getElementById('error-message').textContent = `"${message}"`;

      // Simplified details for the premium UI
      if (error === 'google_auth_failed') {
        const detailsDiv = document.getElementById('error-details');
        detailsDiv.innerHTML = 'HINT: Ensure your email is registered as a recognized test identity in the Google console.';
        detailsDiv.classList.remove('hidden');
      }
    } else {
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
