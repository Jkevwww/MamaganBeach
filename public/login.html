<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Mamagan Beach Resort account to manage bookings and explore resort amenities.">
  <meta name="robots" content="noindex, nofollow">

  <title>Sign In - Mamagan Beach Resort</title>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome (subset for login page) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-ocean-50 font-sans min-h-screen">
  <!-- Skip to main content link for accessibility -->
  <a href="#login-form" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-ocean-600 text-white px-4 py-2 rounded-lg z-50">
    Skip to login form
  </a>

  <main class="min-h-screen flex flex-col items-center justify-center py-12 px-4" role="main">
    <div class="max-w-md w-full">
      <!-- Header Section -->
      <header class="text-center mb-8">
        <a href="/" class="inline-flex items-center gap-3 mb-6 group">
          <img src="/images/logos/LOGO.png" alt="Mamagan Resort Logo" class="h-12 transition-transform group-hover:scale-105">
          <span class="font-bold text-3xl text-ocean-900">Mamagan Beach Resort</span>
        </a>
        <h1 class="text-3xl font-bold text-gray-900">Welcome Back!</h1>
        <p class="text-gray-600 mt-2">Sign in to continue your adventure.</p>
      </header>

      <!-- Login Card -->
      <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8" role="region" aria-label="Login form">
        <!-- Error Message Container -->
        <div id="error-message" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm flex items-center gap-2" role="alert" aria-live="polite">
          <i class="fas fa-exclamation-circle"></i>
          <span id="error-text"></span>
        </div>

        <!-- Success Message Container -->
        <div id="success-message" class="hidden mb-4 p-3 bg-green-50 border border-green-200 rounded-xl text-green-700 text-sm flex items-center gap-2" role="status" aria-live="polite">
          <i class="fas fa-check-circle"></i>
          <span id="success-text"></span>
        </div>

        <form id="login-form" class="space-y-5" novalidate>
          <!-- Email Field -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-800 mb-1">
              Email Address
              <span class="text-red-500" aria-hidden="true">*</span>
            </label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              inputmode="email"
              class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-ocean-500 focus:ring-2 focus:ring-ocean-200 outline-none transition duration-300 invalid:border-red-300 invalid:focus:ring-red-200"
              placeholder="you@example.com"
              aria-required="true"
              aria-describedby="email-error"
            >
            <p id="email-error" class="mt-1 text-sm text-red-600 hidden" role="alert"></p>
          </div>

          <!-- Password Field -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-800 mb-1">
              Password
              <span class="text-red-500" aria-hidden="true">*</span>
            </label>
            <div class="relative">
              <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
                class="w-full px-4 py-3 pr-12 rounded-xl bg-gray-50 border border-gray-200 focus:border-ocean-500 focus:ring-2 focus:ring-ocean-200 outline-none transition duration-300"
                placeholder="••••••••"
                aria-required="true"
                aria-describedby="password-toggle-hint"
                minlength="6"
              >
              <button
                type="button"
                id="password-toggle"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition"
                aria-label="Toggle password visibility"
                aria-pressed="false"
              >
                <i id="password-toggle-icon" class="fas fa-eye" aria-hidden="true"></i>
              </button>
            </div>
            <span id="password-toggle-hint" class="sr-only">Press the eye icon to show or hide your password.</span>
            <p id="password-error" class="mt-1 text-sm text-red-600 hidden" role="alert"></p>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="flex justify-between items-center text-sm flex-wrap gap-2">
            <label class="flex items-center gap-2 text-gray-600 cursor-pointer select-none">
              <input
                type="checkbox"
                id="remember"
                name="remember"
                class="rounded border-gray-300 text-ocean-600 shadow-sm focus:ring-ocean-500"
              >
              <span>Remember me</span>
            </label>
            <a href="/forgot-password.html" class="text-ocean-600 hover:text-ocean-700 font-medium transition underline-offset-2 hover:underline">
              Forgot password?
            </a>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            id="login-btn"
            class="w-full py-3 bg-ocean-600 text-white font-semibold rounded-xl hover:bg-ocean-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-ocean-500 transition-all transform hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2 shadow-md disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
            aria-busy="false"
          >
            <span id="btn-text">Sign In</span>
            <i id="login-spinner" class="fas fa-circle-notch fa-spin hidden" aria-hidden="true"></i>
          </button>
        </form>

        <!-- Register Link -->
        <p class="text-center text-sm text-gray-500 mt-6">
          Don't have an account?
          <a href="/register.html" class="text-ocean-600 font-medium hover:text-ocean-700 underline-offset-2 hover:underline">Create one</a>
        </p>

        <!-- Divider -->
        <div class="relative my-6" role="separator" aria-orientation="horizontal">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-white text-gray-500">or continue with</span>
          </div>
        </div>

        <!-- Social Login -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <a
            href="/api/auth/google"
            class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-gray-200 rounded-xl text-gray-700 font-medium hover:bg-gray-50 hover:border-gray-300 transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-ocean-500"
            aria-label="Sign in with Google"
          >
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="" aria-hidden="true">
            Google
          </a>
          <a
            href="/api/auth/facebook"
            class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-gray-200 rounded-xl text-gray-700 font-medium hover:bg-gray-50 hover:border-gray-300 transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-ocean-500"
            aria-label="Sign in with Facebook"
          >
            <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" class="w-5 h-5" alt="" aria-hidden="true">
            Facebook
          </a>
        </div>
      </div>

      <!-- Footer -->
      <footer class="text-center text-xs text-gray-400 mt-8">
        <p>&copy; <span id="current-year">2024</span> Mamagan Beach Resort. All rights reserved.</p>
      </footer>
    </div>
  </main>

  <!-- Scripts -->
  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script>
    // Update current year
    document.getElementById('current-year').textContent = new Date().getFullYear();

    /**
     * Toggle password visibility
     * @param {string} inputId - The ID of the password input
     */
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      const toggleBtn = document.getElementById('password-toggle');
      const toggleIcon = document.getElementById('password-toggle-icon');

      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';

      // Update icon
      toggleIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';

      // Update ARIA state
      toggleBtn.setAttribute('aria-pressed', isPassword.toString());
      toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    }

    /**
     * Show error message
     * @param {string} message - The error message to display
     */
    function showError(message) {
      const errorContainer = document.getElementById('error-message');
      const errorText = document.getElementById('error-text');

      errorText.textContent = message;
      errorContainer.classList.remove('hidden');
      errorContainer.classList.add('fade-in');

      // Auto-hide after 5 seconds
      setTimeout(() => {
        errorContainer.classList.add('hidden');
        errorContainer.classList.remove('fade-in');
      }, 5000);
    }

    /**
     * Show field-specific error
     * @param {string} fieldId - The ID of the field
     * @param {string} message - The error message
     */
    function showFieldError(fieldId, message) {
      const errorElement = document.getElementById(`${fieldId}-error`);
      const input = document.getElementById(fieldId);

      if (errorElement && input) {
        errorElement.textContent = message;
        errorElement.classList.remove('hidden');
        input.classList.add('invalid:border-red-300', 'invalid:focus:ring-red-200');
        input.classList.remove('border-gray-200', 'focus:border-ocean-500');

        // Add shake animation
        input.classList.add('shake');
        setTimeout(() => input.classList.remove('shake'), 300);
      }
    }

    /**
     * Clear all field errors
     */
    function clearFieldErrors() {
      const fields = ['email', 'password'];
      fields.forEach(fieldId => {
        const errorElement = document.getElementById(`${fieldId}-error`);
        const input = document.getElementById(fieldId);

        if (errorElement) {
          errorElement.textContent = '';
          errorElement.classList.add('hidden');
        }
        if (input) {
          input.classList.remove('invalid:border-red-300', 'invalid:focus:ring-red-200');
          input.classList.add('border-gray-200', 'focus:border-ocean-500');
        }
      });
    }

    /**
     * Validate email format
     * @param {string} email - The email to validate
     * @returns {boolean} - Whether the email is valid
     */
    function isValidEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    /**
     * Set button loading state
     * @param {boolean} loading - Whether the button is in loading state
     */
    function setButtonLoading(loading) {
      const btn = document.getElementById('login-btn');
      const spinner = document.getElementById('login-spinner');
      const btnText = document.getElementById('btn-text');

      btn.disabled = loading;
      btn.setAttribute('aria-busy', loading.toString());
      btn.classList.toggle('btn-loading', loading);

      if (loading) {
        spinner.classList.remove('hidden');
        btnText.textContent = 'Signing in...';
      } else {
        spinner.classList.add('hidden');
        btnText.textContent = 'Sign In';
      }
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      // Password toggle button
      document.getElementById('password-toggle').addEventListener('click', () => {
        togglePassword('password');
      });

      // Clear errors on input
      ['email', 'password'].forEach(fieldId => {
        const input = document.getElementById(fieldId);
        if (input) {
          input.addEventListener('input', () => {
            const errorElement = document.getElementById(`${fieldId}-error`);
            if (errorElement && !errorElement.classList.contains('hidden')) {
              errorElement.classList.add('hidden');
              input.classList.remove('invalid:border-red-300', 'invalid:focus:ring-red-200');
              input.classList.add('border-gray-200');
            }
          });
        }
      });

      // Form submission
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        // Clear previous errors
        clearFieldErrors();
        const errorContainer = document.getElementById('error-message');
        errorContainer.classList.add('hidden');

        // Get form values
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // Validate
        let hasErrors = false;

        if (!email) {
          showFieldError('email', 'Email address is required.');
          hasErrors = true;
        } else if (!isValidEmail(email)) {
          showFieldError('email', 'Please enter a valid email address.');
          hasErrors = true;
        }

        if (!password) {
          showFieldError('password', 'Password is required.');
          hasErrors = true;
        } else if (password.length < 6) {
          showFieldError('password', 'Password must be at least 6 characters.');
          hasErrors = true;
        }

        if (hasErrors) {
          // Focus first error field
          const firstError = document.querySelector('[id$="-error"]:not(.hidden)');
          if (firstError) {
            const inputId = firstError.id.replace('-error', '');
            document.getElementById(inputId).focus();
          }
          return;
        }

        // Submit form
        setButtonLoading(true);

        try {
          const res = await api.post('/auth/login', {
            email: email,
            password: password,
            remember: document.getElementById('remember').checked
          });

          if (res.success) {
            // Store token securely
            if (document.getElementById('remember').checked) {
              localStorage.setItem('token', res.token);
            } else {
              sessionStorage.setItem('token', res.token);
            }

            // Show success message briefly before redirect
            const successContainer = document.getElementById('success-message');
            const successText = document.getElementById('success-text');
            successText.textContent = 'Login successful! Redirecting...';
            successContainer.classList.remove('hidden');
            successContainer.classList.add('fade-in');

            // Redirect based on role
            setTimeout(() => {
              if (res.user && res.user.role === 'admin') {
                window.location.href = '/admin/dashboard.html';
              } else {
                const params = new URLSearchParams(window.location.search);
                const redirect = params.get('redirect') || '/';
                window.location.href = redirect;
              }
            }, 500);
          } else {
            setButtonLoading(false);
            showError(res.message || 'Login failed. Please check your credentials and try again.');

            // Shake the form card
            const card = document.querySelector('[aria-label="Login form"]');
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 300);
          }
        } catch (error) {
          setButtonLoading(false);
          console.error('Login error:', error);
          showError('A network error occurred. Please check your connection and try again.');
        }
      });

      // Handle keyboard navigation for password toggle
      document.getElementById('password-toggle').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          togglePassword('password');
        }
      });
    });
  </script>
</body>
</html>
