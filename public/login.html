<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Mamagan Beach Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex items-center justify-center relative overflow-hidden">
  <!-- Background -->
  <div class="absolute inset-0 z-0">
    <div class="absolute inset-0 bg-gradient-to-br from-primary-600 via-primary-700 to-gray-900 z-10"></div>
    <div class="absolute inset-0 bg-[url('/images/backgrounds/background2.jpg')] bg-cover bg-center opacity-20"></div>
  </div>

  <!-- Decorative Elements -->
  <div class="absolute top-20 left-20 w-64 h-64 bg-primary-500/20 rounded-full blur-3xl"></div>
  <div class="absolute bottom-20 right-20 w-96 h-96 bg-accent-500/10 rounded-full blur-3xl"></div>

  <main class="relative z-10 w-full max-w-md px-6 py-12 page-transition">
    <div class="text-center mb-10">
      <a href="/" class="inline-flex items-center gap-3 mb-8">
        <img src="/images/logos/LOGO.png" alt="Mamagan" class="h-12">
      </a>
      <h1 class="font-heading text-3xl font-bold text-white mb-2">Welcome Back</h1>
      <p class="text-white/70 text-sm">Sign in to continue to your account</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8 md:p-10">
      <!-- Error Message -->
      <div id="error-message" class="hidden mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm flex items-center gap-3 fade-in">
        <i class="fas fa-circle-exclamation"></i>
        <span id="error-text"></span>
      </div>

      <form id="login-form" class="space-y-5">
        <div class="space-y-2">
          <label for="email" class="block text-sm font-semibold text-gray-700">Email Address</label>
          <input type="email" id="email" required class="form-input" placeholder="you@example.com">
        </div>

        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label for="password" class="block text-sm font-semibold text-gray-700">Password</label>
            <a href="/forgot-password.html" class="text-xs font-medium text-primary-600 hover:text-primary-700 transition-colors">Forgot password?</a>
          </div>
          <div class="relative">
            <input type="password" id="password" required class="form-input pr-12" placeholder="Enter your password">
            <button type="button" id="password-toggle" title="Toggle password visibility" aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary-600 transition-colors">
              <i id="password-toggle-icon" class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <input type="checkbox" id="remember" class="w-4 h-4 rounded border-gray-300 text-primary-600 focus:ring-primary-500">
          <label for="remember" class="text-sm text-gray-600">Remember me for 30 days</label>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-block py-4 group">
          <span>Sign In</span>
          <i id="login-spinner" class="fas fa-circle-notch fa-spin hidden"></i>
        </button>
      </form>

      <div class="relative my-8">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
        <div class="relative flex justify-center text-xs font-medium text-gray-500 uppercase tracking-wider"><span class="px-4 bg-white">Or continue with</span></div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <a href="/api/auth/google" class="flex items-center justify-center gap-3 px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-gray-700 text-sm font-medium hover:bg-gray-100 hover:border-gray-300 transition-all">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
          Google
        </a>
        <a href="/api/auth/github" class="flex items-center justify-center gap-3 px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 text-gray-700 text-sm font-medium hover:bg-gray-100 hover:border-gray-300 transition-all">
          <i class="fab fa-github text-lg"></i>
          GitHub
        </a>
      </div>
    </div>

    <p class="text-center mt-8 text-sm text-white/70">
      Don't have an account? <a href="/register.html" class="text-white font-semibold hover:text-primary-200 transition-colors">Sign up</a>
    </p>
  </main>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script>
    document.getElementById('password-toggle').addEventListener('click', () => {
      const input = document.getElementById('password');
      const icon = document.getElementById('password-toggle-icon');
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      icon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('error-message');
      err.classList.add('hidden');

      const btn = document.getElementById('login-btn');
      const spinner = document.getElementById('login-spinner');
      btn.disabled = true;
      spinner.classList.remove('hidden');

      try {
        const res = await api.post('/auth/login', {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          remember: document.getElementById('remember').checked
        });

        if (res.success) {
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));
          
          showToast('Welcome back, ' + (res.user.full_name || 'User'), 'success');
          
          let target = '/';
          if (res.user && res.user.role === 'admin') {
            target = '/admin/dashboard.html';
          }
          
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect');
          if (redirect) target = decodeURIComponent(redirect);
          
          setTimeout(() => {
            window.location.replace(target);
          }, 500);
        } else {
          btn.disabled = false;
          spinner.classList.add('hidden');
          document.getElementById('error-text').textContent = res.message || 'Login failed.';
          err.classList.remove('hidden');
        }
      } catch (error) {
        btn.disabled = false;
        spinner.classList.add('hidden');
        document.getElementById('error-text').textContent = 'Connection error. Please try again.';
        err.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
