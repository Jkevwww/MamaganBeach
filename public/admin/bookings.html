<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="description" content="Manage all resort bookings and reservations">
  <title>Bookings | Mamagan Beach Resort Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex-shrink-0 hidden md:flex flex-col relative z-20">
      <div class="p-6 border-b border-gray-200">
        <a href="/" class="flex items-center gap-3 group">
          <img src="/images/logos/LOGO.png" alt="Mamagan Logo" class="h-10 group-hover:scale-105 transition-transform">
          <div class="flex flex-col">
            <span class="font-heading font-bold text-lg leading-tight text-gray-900">Mamagan</span>
            <span class="text-[10px] font-bold uppercase tracking-wider text-primary-600">Admin Panel</span>
          </div>
        </a>
      </div>
      <nav id="admin-nav" class="flex-1 p-4 space-y-1 overflow-y-auto"></nav>
      <div class="p-4 border-t border-gray-200">
        <button id="logout-btn" title="Sign Out" aria-label="Sign Out" class="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg transition-all">
          <i class="fas fa-sign-out-alt w-5 text-center"></i>
          <span class="text-sm font-medium">Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto bg-gray-50">
      <header class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center sticky top-0 z-10">
        <div>
          <h1 class="font-heading text-2xl font-bold text-gray-900">Bookings</h1>
          <p class="text-xs text-gray-500 mt-1">Manage all reservations</p>
        </div>
        <div id="auth-nav" class="flex items-center gap-3"></div>
      </header>

      <main class="p-8 page-transition">
        <!-- Loading State -->
        <div id="loading-state" class="hidden flex items-center justify-center py-16">
          <div class="text-center">
            <i class="fas fa-circle-notch fa-spin text-4xl text-primary-600 mb-4"></i>
            <p class="text-gray-500">Loading bookings...</p>
          </div>
        </div>

        <!-- Error State -->
        <div id="error-state" class="hidden bg-red-50 border border-red-200 rounded-lg p-6 text-center">
          <i class="fas fa-exclamation-triangle text-3xl text-red-500 mb-3"></i>
          <p class="text-red-700 font-medium mb-2">Failed to load bookings</p>
          <button onclick="loadBookings()" class="btn btn-sm btn-primary">
            <i class="fas fa-refresh mr-2"></i>Retry
          </button>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16">
          <i class="fas fa-calendar-times text-5xl text-gray-300 mb-4"></i>
          <p class="text-gray-500 text-lg">No bookings found</p>
          <p class="text-gray-400 text-sm mt-1">Try adjusting your search or filters</p>
        </div>

        <!-- Bookings Table -->
        <div id="bookings-container" class="card overflow-hidden hidden">
          <div class="px-6 py-5 border-b border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="relative flex-1 max-w-md w-full">
              <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <label for="booking-search" class="sr-only">Search Bookings</label>
              <input 
                type="text" 
                id="booking-search" 
                class="form-input pl-12 w-full" 
                placeholder="Search by guest name or ID..."
                aria-label="Search bookings by guest name or booking ID"
                autocomplete="off">
            </div>
            <div class="flex gap-4 items-center w-full sm:w-auto">
              <label for="status-filter" class="text-sm font-medium text-gray-600 whitespace-nowrap">Status:</label>
              <select id="status-filter" class="form-input form-select" aria-label="Filter by booking status">
                <option value="all">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="cancelled">Cancelled</option>
                <option value="completed">Completed</option>
              </select>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="table" role="grid" aria-label="Bookings list">
              <thead>
                <tr>
                  <th scope="col">Guest</th>
                  <th scope="col">Facility</th>
                  <th scope="col">Date & Time</th>
                  <th scope="col">Amount</th>
                  <th scope="col">Status</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody id="bookings-list" class="divide-y divide-gray-100">
                <!-- Bookings will be injected here -->
              </tbody>
            </table>
          </div>
          <!-- Table Footer with Count -->
          <div class="px-6 py-4 border-t border-gray-200 bg-gray-50">
            <p class="text-sm text-gray-500">
              Showing <span id="showing-count">0</span> of <span id="total-count">0</span> bookings
            </p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/admin.js?v=2"></script>
  <script>
    // Configuration
    const CONFIG = {
      STATUS_COLORS: {
        pending: { bg: 'bg-yellow-100', text: 'text-yellow-700' },
        confirmed: { bg: 'bg-green-100', text: 'text-green-700' },
        cancelled: { bg: 'bg-red-100', text: 'text-red-700' },
        completed: { bg: 'bg-gray-100', text: 'text-gray-700' }
      },
      DEBOUNCE_DELAY: 300,
      ID_PREVIEW_LENGTH: 8
    };

    // State
    let allBookings = [];
    let searchDebounceTimer = null;

    // Utility Functions
    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function formatCurrency(amount) {
      const num = Number(amount) || 0;
      return 'PHP ' + num.toLocaleString('en-PH', { minimumFractionDigits: 2 });
    }

    function debounce(func, delay) {
      return function(...args) {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => func.apply(this, args), delay);
      };
    }

    // UI State Management
    function showLoading() {
      document.getElementById('loading-state').classList.remove('hidden');
      document.getElementById('error-state').classList.add('hidden');
      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('bookings-container').classList.add('hidden');
    }

    function showError() {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');
      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('bookings-container').classList.add('hidden');
    }

    function showEmpty() {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.add('hidden');
      document.getElementById('empty-state').classList.remove('hidden');
      document.getElementById('bookings-container').classList.add('hidden');
    }

    function showTable() {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('error-state').classList.add('hidden');
      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('bookings-container').classList.remove('hidden');
    }

    function updateCounts(showing, total) {
      document.getElementById('showing-count').textContent = showing;
      document.getElementById('total-count').textContent = total;
    }

    // Template Functions
    function createBookingRow(booking) {
      const tr = document.createElement('tr');
      tr.className = 'hover:bg-gray-50 transition-colors group';
      tr.setAttribute('role', 'row');

      const statusConfig = CONFIG.STATUS_COLORS[booking.status] || { bg: 'bg-gray-100', text: 'text-gray-700' };
      const shortId = booking.id ? booking.id.substring(0, CONFIG.ID_PREVIEW_LENGTH) : '';

      tr.innerHTML = `
        <td class="px-6 py-4">
          <div class="text-sm font-medium text-gray-900">${escapeHtml(booking.guest_name)}</div>
          <div class="text-xs text-gray-500 font-mono mt-0.5">#${escapeHtml(shortId)}</div>
        </td>
        <td class="px-6 py-4">
          <div class="text-sm text-gray-600">${escapeHtml(booking.facility_name)}</div>
          <div class="text-xs text-primary-600 font-medium mt-0.5">${escapeHtml(booking.quantity)} unit(s)</div>
        </td>
        <td class="px-6 py-4">
          <div class="text-sm text-gray-600">${escapeHtml(booking.booking_date)}</div>
          <div class="text-xs text-gray-500 mt-0.5">${escapeHtml(booking.time_slot)}</div>
        </td>
        <td class="px-6 py-4">
          <div class="text-sm font-semibold text-gray-900">${formatCurrency(booking.total_amount)}</div>
          <div class="text-xs text-gray-500 mt-0.5">${escapeHtml(booking.payment_status)}</div>
        </td>
        <td class="px-6 py-4">
          <span class="px-3 py-1 text-xs font-medium rounded-full ${statusConfig.bg} ${statusConfig.text}">
            ${escapeHtml(booking.status)}
          </span>
        </td>
        <td class="px-6 py-4">
          <div class="flex gap-2">
            <button 
              class="btn-icon btn-ghost text-gray-500 hover:text-primary-600" 
              aria-label="View details for booking ${escapeHtml(shortId)}" 
              title="View Details"
              data-booking-id="${escapeHtml(booking.id)}"
              onclick="viewBooking('${escapeHtml(booking.id)}')">
              <i class="fas fa-eye"></i>
            </button>
            <button 
              class="btn-icon btn-ghost text-gray-500 hover:text-red-600" 
              aria-label="Cancel booking ${escapeHtml(shortId)}" 
              title="Cancel Booking"
              data-booking-id="${escapeHtml(booking.id)}"
              onclick="cancelBooking('${escapeHtml(booking.id)}')">
              <i class="fas fa-ban"></i>
            </button>
          </div>
        </td>
      `;

      return tr;
    }

    // Render Functions
    function renderBookings(list) {
      const tbody = document.getElementById('bookings-list');
      tbody.innerHTML = '';

      if (list.length === 0) {
        showEmpty();
        updateCounts(0, allBookings.length);
        return;
      }

      // Use DocumentFragment for better performance
      const fragment = document.createDocumentFragment();
      list.forEach(booking => {
        fragment.appendChild(createBookingRow(booking));
      });
      tbody.appendChild(fragment);

      showTable();
      updateCounts(list.length, allBookings.length);
    }

    // Data Loading
    async function loadBookings() {
      showLoading();
      try {
        const res = await api.get('/admin/bookings');
        if (res.success && Array.isArray(res.data)) {
          allBookings = res.data;
          applyFilters();
        } else {
          throw new Error(res.message || 'Invalid response format');
        }
      } catch (error) {
        console.error('Error loading bookings:', error);
        showError();
        toast.error('Failed to load bookings: ' + (error.message || 'Unknown error'));
      }
    }

    // Filtering
    function getFilteredBookings() {
      const searchInput = document.getElementById('booking-search').value.toLowerCase().trim();
      const statusFilter = document.getElementById('status-filter').value;

      return allBookings.filter(booking => {
        // Status filter
        if (statusFilter !== 'all' && booking.status !== statusFilter) {
          return false;
        }

        // Search filter
        if (searchInput) {
          const guestName = (booking.guest_name || '').toLowerCase();
          const bookingId = (booking.id || '').toLowerCase();
          if (!guestName.includes(searchInput) && !bookingId.includes(searchInput)) {
            return false;
          }
        }

        return true;
      });
    }

    function applyFilters() {
      const filtered = getFilteredBookings();
      renderBookings(filtered);
    }

    // Debounced search handler
    const handleSearch = debounce(() => {
      applyFilters();
    }, CONFIG.DEBOUNCE_DELAY);

    // Action Handlers
    function viewBooking(bookingId) {
      // TODO: Implement booking detail modal/view
      toast.info('View booking: ' + bookingId);
    }

    async function cancelBooking(bookingId) {
      if (!confirm('Are you sure you want to cancel this booking? This action cannot be undone.')) {
        return;
      }

      try {
        const res = await api.patch(`/admin/bookings/${bookingId}/cancel`);
        if (res.success) {
          toast.success('Booking cancelled successfully');
          // Refresh the list
          await loadBookings();
        } else {
          throw new Error(res.message || 'Failed to cancel booking');
        }
      } catch (error) {
        console.error('Error cancelling booking:', error);
        toast.error('Failed to cancel booking: ' + (error.message || 'Unknown error'));
      }
    }

    // Initialize
    (function init() {
      if (!requireAdmin()) {
        throw new Error('Admin access required');
      }

      renderAdminNav('bookings');

      // Attach event listeners
      document.getElementById('booking-search').addEventListener('input', handleSearch);
      document.getElementById('status-filter').addEventListener('change', applyFilters);

      // Load initial data
      loadBookings();
    })();
  </script>
</body>
</html>
