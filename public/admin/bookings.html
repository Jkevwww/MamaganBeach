<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Reservations | Mamagan Beach Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-lux-cream font-sans text-lux-navy">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-80 bg-white border-r border-lux-navy/5 flex-shrink-0 hidden md:flex flex-col relative z-20">
      <div class="p-10 border-b border-lux-navy/5">
        <a href="/" class="flex items-center gap-4 group">
          <img src="/images/logos/LOGO.png" alt="Mamagan Logo" class="h-12 group-hover:scale-110 transition-transform">
          <div class="flex flex-col">
            <span class="luxury-heading font-bold text-xl leading-none">Mamagan</span>
            <span class="text-[8px] font-black uppercase tracking-[0.4em] text-lux-gold mt-1">Beach Resort</span>
          </div>
        </a>
      </div>
      <nav id="admin-nav" class="flex-1 p-6 space-y-2"></nav>
      <div class="p-8 border-t border-lux-navy/5">
        <button id="logout-btn" title="Sign Out" aria-label="Sign Out" class="w-full flex items-center gap-4 px-6 py-4 text-red-600 hover:bg-red-50 rounded-2xl transition-all group">
          <i class="fas fa-sign-out-alt w-5 text-center group-hover:-translate-x-1 transition-transform"></i>
          <span class="text-[10px] font-black uppercase tracking-widest">Terminate Session</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto bg-lux-cream/50">
      <header class="bg-white/80 backdrop-blur-xl border-b border-lux-navy/5 px-10 py-6 flex justify-between items-center sticky top-0 z-10" style="-webkit-backdrop-filter: blur(24px);">
        <div>
          <h1 class="luxury-heading text-2xl font-bold text-lux-navy">Global Reservations</h1>
          <p class="text-[10px] font-bold text-lux-navy/30 uppercase tracking-[0.2em]">Manage all guest itineraries and settlement statuses</p>
        </div>
        <div id="auth-nav" class="flex items-center gap-3"></div>
      </header>

      <main class="p-10 page-transition">
        <div class="bg-white rounded-[3rem] border border-lux-navy/5 premium-shadow overflow-hidden">
          <div class="px-10 py-8 border-b border-lux-navy/5 flex justify-between items-center gap-8">
            <div class="relative flex-1 max-w-md group">
                <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-lux-navy/20 group-focus-within:text-lux-gold transition-colors"></i>
                <label for="booking-search" class="sr-only">Search Bookings</label>
                <input type="text" id="booking-search" oninput="searchBookings(this.value)" class="w-full pl-14 pr-6 py-4 rounded-2xl bg-lux-cream/30 border border-transparent focus:bg-white focus:border-lux-gold outline-none transition-all text-xs" placeholder="Search by Guest or ID..." title="Search by Guest or ID" aria-label="Search by Guest or ID">
            </div>
            <div class="flex gap-4 items-center">
                <label for="status-filter" class="text-[8px] font-black uppercase tracking-widest text-lux-navy/30">Filter</label>
                <select id="status-filter" onchange="applyFilters()" title="Select status" aria-label="Filter by status" class="px-6 py-4 rounded-2xl bg-lux-cream/30 border-transparent text-[8px] font-black uppercase tracking-widest text-lux-navy outline-none focus:bg-white focus:border-lux-gold transition-all">
                    <option value="all">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead>
                <tr class="bg-lux-navy/5 text-[8px] font-black uppercase tracking-[0.3em] text-lux-navy/40">
                  <th class="px-10 py-5">Guest Identity</th>
                  <th class="px-10 py-5">Asset Detail</th>
                  <th class="px-10 py-5">Temporal Window</th>
                  <th class="px-10 py-5">Settlement</th>
                  <th class="px-10 py-5">Protocol Status</th>
                  <th class="px-10 py-5">Management</th>
                </tr>
              </thead>
              <tbody id="bookings-list" class="divide-y divide-lux-navy/5">
                <!-- Bookings will be injected here -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/admin.js?v=2"></script>
  <script>
    if (!requireAdmin()) throw new Error('Admin required');
    renderAdminNav('bookings');

    let allBookings = [];

    async function loadBookings() {
      const res = await api.get('/admin/bookings');
      if (res.success) {
        allBookings = res.data;
        renderBookings(allBookings);
      }
    }

    function renderBookings(list) {
      const tbody = document.getElementById('bookings-list');
      tbody.innerHTML = list.map(b => {
        const statusColors = { 
          pending: 'bg-lux-gold/10 text-lux-gold border-lux-gold/20', 
          confirmed: 'bg-green-500/10 text-green-600 border-green-500/20', 
          cancelled: 'bg-red-500/10 text-red-600 border-red-500/20', 
          completed: 'bg-lux-navy/10 text-lux-navy/50 border-lux-navy/20' 
        };
        return `
          <tr class="hover:bg-lux-cream/50 transition-colors group">
            <td class="px-10 py-6">
              <div class="text-sm font-bold text-lux-navy">${b.guest_name}</div>
              <div class="text-[9px] font-mono text-lux-navy/30 uppercase tracking-widest mt-1">#${b.id.substring(0,8)}</div>
            </td>
            <td class="px-10 py-6">
                <div class="text-xs font-medium text-lux-navy/60">${b.facility_name}</div>
                <div class="text-[8px] font-black text-lux-gold uppercase tracking-widest mt-1">${b.quantity} Units</div>
            </td>
            <td class="px-10 py-6">
              <div class="text-xs font-bold text-lux-navy/60">${b.booking_date}</div>
              <div class="text-[9px] font-black text-lux-gold uppercase tracking-widest mt-1">${b.time_slot}</div>
            </td>
            <td class="px-10 py-6">
                <div class="text-sm font-black text-lux-navy">PHP ${Number(b.total_amount).toLocaleString('en-PH',{minimumFractionDigits:2})}</div>
                <div class="text-[8px] font-bold text-lux-navy/30 uppercase tracking-widest mt-1">${b.payment_status}</div>
            </td>
            <td class="px-10 py-6"><span class="px-3 py-1 text-[8px] font-black uppercase tracking-widest rounded-full border ${statusColors[b.status]||''}">${b.status}</span></td>
            <td class="px-10 py-6">
                <div class="flex gap-2">
                    <button class="text-lux-navy/20 hover:text-lux-gold transition-colors" aria-label="View Details" title="View Details"><i class="fas fa-eye"></i></button>
                    <button class="text-lux-navy/20 hover:text-red-500 transition-colors" aria-label="Cancel Booking" title="Cancel Booking"><i class="fas fa-ban"></i></button>
                </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function applyFilters() {
        const q = document.getElementById('booking-search').value.toLowerCase();
        const s = document.getElementById('status-filter').value;
        let filtered = allBookings;
        if (s !== 'all') filtered = filtered.filter(b => b.status === s);
        if (q) filtered = filtered.filter(b => b.guest_name.toLowerCase().includes(q) || b.id.toLowerCase().includes(q));
        renderBookings(filtered);
    }

    function searchBookings(q) { applyFilters(); }

    loadBookings();
  </script>
</body>
</html>
