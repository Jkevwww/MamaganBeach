<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings | Mamagan Beach Resort Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex-shrink-0 hidden md:flex flex-col">
      <div class="p-6 border-b border-gray-200">
        <a href="/" class="flex items-center gap-3 group">
          <img src="/images/logos/LOGO.png" alt="Logo" class="h-10 group-hover:scale-105 transition-transform">
          <div class="flex flex-col">
            <span class="font-heading font-bold text-lg leading-tight text-gray-900">Mamagan</span>
            <span class="text-[10px] font-bold uppercase tracking-wider text-primary-600">Admin Panel</span>
          </div>
        </a>
      </div>
      <nav id="admin-nav" class="flex-1 p-4 space-y-1 overflow-y-auto"></nav>
      <div class="p-4 border-t border-gray-200">
        <button id="logout-btn" class="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg transition-all">
          <i class="fas fa-sign-out-alt w-5 text-center"></i>
          <span class="text-sm font-medium">Sign Out</span>
        </button>
      </div>
    </aside>

    <div class="flex-1 overflow-y-auto bg-gray-50">
      <!-- Header -->
      <header class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center sticky top-0 z-10">
        <div>
          <h1 class="font-heading text-2xl font-bold text-gray-900">Bookings</h1>
          <p class="text-xs text-gray-500 mt-1">Manage all guest reservations</p>
        </div>
        <div id="auth-nav" class="flex items-center gap-3"></div>
      </header>

      <main class="p-6 space-y-5">
        <!-- Filters -->
        <div class="card p-4">
          <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
            <input id="f-search" type="text" placeholder="Search guest / ID..." class="form-input col-span-2 lg:col-span-2">
            <select id="f-status" class="form-input">
              <option value="">All Statuses</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
            <select id="f-payment" class="form-input">
              <option value="">All Payments</option>
              <option value="pending">Unpaid</option>
              <option value="paid">Paid</option>
              <option value="failed">Failed</option>
            </select>
            <input id="f-from" type="date" class="form-input" title="Date from">
            <input id="f-to" type="date" class="form-input" title="Date to">
          </div>
          <div class="flex gap-2 mt-3">
            <button onclick="loadBookings()" class="btn-primary text-sm px-4 py-2"><i class="fas fa-search mr-2"></i>Search</button>
            <button onclick="clearFilters()" class="btn-outline text-sm px-4 py-2"><i class="fas fa-times mr-2"></i>Clear</button>
            <span class="ml-auto text-xs text-gray-500 self-center" id="result-count"></span>
          </div>
        </div>

        <!-- Table -->
        <div class="card overflow-hidden">
          <div class="overflow-x-auto">
            <table class="table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Guest</th>
                  <th>Facility</th>
                  <th>Date / Slot</th>
                  <th>Amount</th>
                  <th>GCash Ref</th>
                  <th>Status</th>
                  <th>Payment</th>
                  <th class="text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="bookings-tbody" class="divide-y divide-gray-100">
                <tr><td colspan="9" class="text-center py-12 text-gray-400"><i class="fas fa-spinner fa-spin mr-2"></i>Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- View Modal -->
  <div id="modal-view" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl max-h-[90vh] overflow-y-auto">
      <div class="px-6 py-5 border-b border-gray-200 flex justify-between items-center">
        <h3 class="font-heading font-bold text-lg">Booking Detail</h3>
        <button onclick="closeModal('modal-view')" class="p-2 text-gray-400 hover:text-gray-600 rounded-lg hover:bg-gray-100"><i class="fas fa-times"></i></button>
      </div>
      <div id="modal-view-body" class="p-6 text-sm space-y-4"></div>
      <div class="px-6 py-4 border-t border-gray-200 flex gap-3 justify-end" id="modal-view-actions"></div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div id="modal-confirm" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
      <div class="px-6 py-5 border-b border-gray-200">
        <h3 class="font-heading font-bold text-lg">Confirm Booking</h3>
      </div>
      <div class="p-6">
        <p class="text-sm text-gray-600 mb-4" id="confirm-message"></p>
        <textarea id="confirm-note" rows="3" class="form-input w-full" placeholder="Optional note..."></textarea>
      </div>
      <div class="px-6 py-4 border-t border-gray-200 flex gap-3 justify-end">
        <button onclick="closeModal('modal-confirm')" class="btn-outline text-sm px-4 py-2">Cancel</button>
        <button id="confirm-btn" class="btn-primary text-sm px-4 py-2">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Reject Modal -->
  <div id="modal-reject" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
      <div class="px-6 py-5 border-b border-gray-200">
        <h3 class="font-heading font-bold text-lg text-red-700">Reject / Cancel Booking</h3>
      </div>
      <div class="p-6">
        <p class="text-sm text-gray-600 mb-3">This will cancel the booking. Provide a reason for the guest:</p>
        <textarea id="reject-reason" rows="3" class="form-input w-full" placeholder="Required: rejection reason..."></textarea>
      </div>
      <div class="px-6 py-4 border-t border-gray-200 flex gap-3 justify-end">
        <button onclick="closeModal('modal-reject')" class="btn-outline text-sm px-4 py-2">Back</button>
        <button id="reject-btn" class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium px-4 py-2 rounded-xl transition-colors">Reject</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/admin.js?v=2"></script>
  <script>
    (function() {
      const token = localStorage.getItem('token');
      const user = (() => { try { return JSON.parse(localStorage.getItem('user')); } catch { return null; } })();
      if (!token || !user || user.role !== 'admin') window.location.replace('/login.html');
    })();
    if (!requireAdmin()) throw new Error('Admin required');
    renderAdminNav('bookings');

    const STATUS_BADGE = {
      pending:   'bg-yellow-100 text-yellow-700',
      confirmed: 'bg-green-100 text-green-700',
      cancelled: 'bg-red-100 text-red-700',
      completed: 'bg-blue-100 text-blue-700',
    };
    const PAY_BADGE = {
      pending: 'bg-orange-100 text-orange-700',
      paid:    'bg-green-100 text-green-700',
      failed:  'bg-red-100 text-red-700',
    };

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    async function loadBookings() {
      const params = new URLSearchParams();
      const s = document.getElementById('f-search').value.trim();
      const status = document.getElementById('f-status').value;
      const pay = document.getElementById('f-payment').value;
      const from = document.getElementById('f-from').value;
      const to = document.getElementById('f-to').value;
      if (s) params.set('search', s);
      if (status) params.set('status', status);
      if (pay) params.set('payment_status', pay);
      if (from) params.set('date_from', from);
      if (to) params.set('date_to', to);

      document.getElementById('bookings-tbody').innerHTML =
        `<tr><td colspan="9" class="text-center py-12 text-gray-400"><i class="fas fa-spinner fa-spin mr-2"></i>Loading...</td></tr>`;

      const res = await api.get('/admin/bookings?' + params.toString());
      if (!res.success) { showToast('Failed to load bookings.', 'error'); return; }

      document.getElementById('result-count').textContent = `${res.data.length} result(s)`;
      renderTable(res.data);
    }

    function renderTable(bookings) {
      const tbody = document.getElementById('bookings-tbody');
      if (!bookings.length) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center py-12 text-gray-400">No bookings found.</td></tr>`;
        return;
      }
      tbody.innerHTML = bookings.map(b => `
        <tr class="hover:bg-gray-50 transition-colors">
          <td class="px-4 py-3 font-mono text-xs text-gray-500">#${b.id.substring(0,8)}</td>
          <td class="px-4 py-3">
            <div class="text-sm font-medium text-gray-900">${esc(b.guest_name)}</div>
            <div class="text-xs text-gray-400">${esc(b.guest_email)}</div>
          </td>
          <td class="px-4 py-3">
            <div class="text-sm text-gray-700">${esc(b.facility_name)}</div>
            <div class="text-xs text-gray-400 capitalize">${b.facility_category || ''}</div>
          </td>
          <td class="px-4 py-3">
            <div class="text-sm text-gray-700">${b.booking_date}</div>
            <div class="text-xs text-primary-600">${b.time_slot || '-'}</div>
          </td>
          <td class="px-4 py-3 text-sm font-semibold text-gray-900">₱${Number(b.total_amount).toLocaleString('en-PH',{minimumFractionDigits:2})}</td>
          <td class="px-4 py-3 text-xs font-mono text-gray-500">${b.gcash_ref_no || '-'}</td>
          <td class="px-4 py-3"><span class="px-2 py-1 text-xs font-medium rounded-full ${STATUS_BADGE[b.status]||'bg-gray-100 text-gray-600'}">${b.status}</span></td>
          <td class="px-4 py-3"><span class="px-2 py-1 text-xs font-medium rounded-full ${PAY_BADGE[b.payment_status]||'bg-gray-100 text-gray-600'}">${b.payment_status}</span></td>
          <td class="px-4 py-3 text-right">
            <div class="flex gap-1 justify-end">
              <button onclick="viewBooking('${b.id}')" class="p-1.5 text-gray-500 hover:text-primary-600 hover:bg-primary-50 rounded-lg transition-colors" title="View"><i class="fas fa-eye text-xs"></i></button>
              ${b.status !== 'cancelled' && b.status !== 'completed' ? `
              <button onclick="openConfirmModal('${b.id}')" class="p-1.5 text-gray-500 hover:text-green-600 hover:bg-green-50 rounded-lg transition-colors" title="Confirm"><i class="fas fa-check text-xs"></i></button>
              <button onclick="openRejectModal('${b.id}')" class="p-1.5 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Reject"><i class="fas fa-ban text-xs"></i></button>
              ` : ''}
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function viewBooking(id) {
      const res = await api.get(`/admin/bookings/${id}`);
      if (!res.success) { showToast('Failed to load detail.', 'error'); return; }
      const b = res.data;

      document.getElementById('modal-view-body').innerHTML = `
        <div class="grid grid-cols-2 gap-3">
          <div><p class="text-xs text-gray-500 mb-0.5">Booking ID</p><p class="font-mono text-xs">${b.id}</p></div>
          <div><p class="text-xs text-gray-500 mb-0.5">Created</p><p>${new Date(b.created_at).toLocaleDateString('en-PH',{dateStyle:'medium'})}</p></div>
          <div><p class="text-xs text-gray-500 mb-0.5">Guest</p><p class="font-medium">${esc(b.guest_name)}</p></div>
          <div><p class="text-xs text-gray-500 mb-0.5">Email</p><p>${esc(b.guest_email)}</p></div>
          <div><p class="text-xs text-gray-500 mb-0.5">Phone</p><p>${b.guest_phone || '-'}</p></div>
          <div><p class="text-xs text-gray-500 mb-0.5">Facility</p><p>${esc(b.facility_name)}</p></div>
          <div><p class="text-xs text-gray-500 mb-0.5">Date</p><p>${b.booking_date}</p></div>
          <div><p class="text-xs text-gray-500 mb-0.5">Time Slot</p><p>${b.time_slot || '-'}</p></div>
          <div><p class="text-xs text-gray-500 mb-0.5">Qty / Guests</p><p>${b.quantity||1} unit · ${b.guest_count||1} pax</p></div>
          <div><p class="text-xs text-gray-500 mb-0.5">Amount</p><p class="font-semibold text-gray-900">₱${Number(b.total_amount).toLocaleString('en-PH',{minimumFractionDigits:2})}</p></div>
          <div><p class="text-xs text-gray-500 mb-0.5">Status</p><span class="px-2 py-1 text-xs font-medium rounded-full ${STATUS_BADGE[b.status]||''}">${b.status}</span></div>
          <div><p class="text-xs text-gray-500 mb-0.5">Payment</p><span class="px-2 py-1 text-xs font-medium rounded-full ${PAY_BADGE[b.payment_status]||''}">${b.payment_status}</span></div>
          ${b.gcash_ref_no ? `<div class="col-span-2 bg-gray-50 rounded-lg p-3"><p class="text-xs text-gray-500 mb-0.5">GCash Ref #</p><p class="font-mono font-medium">${esc(b.gcash_ref_no)} <span class="text-xs text-gray-400">(${b.gcash_audit_status})</span></p></div>` : ''}
          ${b.rejection_reason ? `<div class="col-span-2 bg-red-50 rounded-lg p-3"><p class="text-xs text-red-600 mb-1 font-medium">Rejection Reason</p><p class="text-red-700">${esc(b.rejection_reason)}</p></div>` : ''}
          ${b.admin_note ? `<div class="col-span-2 bg-blue-50 rounded-lg p-3"><p class="text-xs text-blue-600 mb-1 font-medium">Admin Note</p><p class="text-blue-700">${esc(b.admin_note)}</p></div>` : ''}
        </div>
      `;

      const acts = document.getElementById('modal-view-actions');
      acts.innerHTML = b.status !== 'cancelled' && b.status !== 'completed' ? `
        <button onclick="closeModal('modal-view');openConfirmModal('${id}')" class="btn-primary text-sm px-4 py-2"><i class="fas fa-check mr-1"></i>Confirm</button>
        <button onclick="closeModal('modal-view');openRejectModal('${id}')" class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium px-4 py-2 rounded-xl transition-colors"><i class="fas fa-ban mr-1"></i>Reject</button>
      ` : `<span class="text-xs text-gray-400">No actions available for ${b.status} bookings.</span>`;

      openModal('modal-view');
    }

    function openConfirmModal(id) {
      document.getElementById('confirm-message').textContent = `Confirm booking #${id.substring(0,8)}? Guest will be notified.`;
      document.getElementById('confirm-note').value = '';
      document.getElementById('confirm-btn').onclick = async () => {
        const note = document.getElementById('confirm-note').value.trim();
        const btn = document.getElementById('confirm-btn');
        btn.disabled = true; btn.textContent = 'Confirming...';
        const res = await api.patch(`/admin/bookings/${id}/confirm`, { admin_note: note });
        btn.disabled = false; btn.textContent = 'Confirm';
        if (res.success) { showToast('Booking confirmed!', 'success'); closeModal('modal-confirm'); loadBookings(); }
        else showToast(res.message || 'Failed.', 'error');
      };
      openModal('modal-confirm');
    }

    function openRejectModal(id) {
      document.getElementById('reject-reason').value = '';
      document.getElementById('reject-btn').onclick = async () => {
        const reason = document.getElementById('reject-reason').value.trim();
        if (!reason) { showToast('Rejection reason is required.', 'error'); return; }
        const btn = document.getElementById('reject-btn');
        btn.disabled = true; btn.textContent = 'Rejecting...';
        const res = await api.patch(`/admin/bookings/${id}/reject`, { rejection_reason: reason });
        btn.disabled = false; btn.textContent = 'Reject';
        if (res.success) { showToast('Booking rejected.', 'success'); closeModal('modal-reject'); loadBookings(); }
        else showToast(res.message || 'Failed.', 'error');
      };
      openModal('modal-reject');
    }

    function clearFilters() {
      ['f-search','f-status','f-payment','f-from','f-to'].forEach(id => {
        const el = document.getElementById(id);
        el.tagName === 'SELECT' ? (el.selectedIndex = 0) : (el.value = '');
      });
      loadBookings();
    }

    loadBookings();
  </script>
</body>
</html>
