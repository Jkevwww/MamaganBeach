<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings | Mamagan Beach Resort Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex-shrink-0 hidden md:flex flex-col relative z-20">
      <div class="p-6 border-b border-gray-200">
        <a href="/" class="flex items-center gap-3 group">
          <img src="/images/logos/LOGO.png" alt="Mamagan Logo" class="h-10 group-hover:scale-105 transition-transform">
          <div class="flex flex-col">
            <span class="font-heading font-bold text-lg leading-tight text-gray-900">Mamagan</span>
            <span class="text-[10px] font-bold uppercase tracking-wider text-primary-600">Admin Panel</span>
          </div>
        </a>
      </div>
      <nav id="admin-nav" class="flex-1 p-4 space-y-1 overflow-y-auto"></nav>
      <div class="p-4 border-t border-gray-200">
        <button id="logout-btn" title="Sign Out" aria-label="Sign Out" class="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg transition-all">
          <i class="fas fa-sign-out-alt w-5 text-center"></i>
          <span class="text-sm font-medium">Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto bg-gray-50">
      <header class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center sticky top-0 z-10">
        <div>
          <h1 class="font-heading text-2xl font-bold text-gray-900">Bookings</h1>
          <p class="text-xs text-gray-500 mt-1">Manage all reservations</p>
        </div>
        <div id="auth-nav" class="flex items-center gap-3"></div>
      </header>

      <main class="p-8 page-transition">
        <div class="card overflow-hidden">
          <div class="px-6 py-5 border-b border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="relative flex-1 max-w-md w-full">
              <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <label for="booking-search" class="sr-only">Search Bookings</label>
              <input type="text" id="booking-search" oninput="searchBookings(this.value)" class="form-input pl-12 w-full" placeholder="Search by guest name or ID...">
            </div>
            <div class="flex gap-4 items-center w-full sm:w-auto">
              <label for="status-filter" class="text-sm font-medium text-gray-600 whitespace-nowrap">Status:</label>
              <select id="status-filter" onchange="applyFilters()" class="form-input form-select" aria-label="Filter by status">
                <option value="all">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="cancelled">Cancelled</option>
                <option value="completed">Completed</option>
              </select>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="table">
              <thead>
                <tr>
                  <th>Guest</th>
                  <th>Facility</th>
                  <th>Date & Time</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="bookings-list" class="divide-y divide-gray-100">
                <!-- Bookings will be injected here -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/admin.js?v=2"></script>
  <script>
    if (!requireAdmin()) throw new Error('Admin required');
    renderAdminNav('bookings');

    let allBookings = [];

    async function loadBookings() {
      const res = await api.get('/admin/bookings');
      if (res.success) {
        allBookings = res.data;
        renderBookings(allBookings);
      }
    }

    function renderBookings(list) {
      const tbody = document.getElementById('bookings-list');
      tbody.innerHTML = list.map(b => {
        const statusColors = { 
          pending: 'bg-yellow-100 text-yellow-700', 
          confirmed: 'bg-green-100 text-green-700', 
          cancelled: 'bg-red-100 text-red-700', 
          completed: 'bg-gray-100 text-gray-700' 
        };
        return `
          <tr class="hover:bg-gray-50 transition-colors group">
            <td class="px-6 py-4">
              <div class="text-sm font-medium text-gray-900">${b.guest_name}</div>
              <div class="text-xs text-gray-500 font-mono mt-0.5">#${b.id.substring(0,8)}</div>
            </td>
            <td class="px-6 py-4">
              <div class="text-sm text-gray-600">${b.facility_name}</div>
              <div class="text-xs text-primary-600 font-medium mt-0.5">${b.quantity} unit(s)</div>
            </td>
            <td class="px-6 py-4">
              <div class="text-sm text-gray-600">${b.booking_date}</div>
              <div class="text-xs text-gray-500 mt-0.5">${b.time_slot}</div>
            </td>
            <td class="px-6 py-4">
              <div class="text-sm font-semibold text-gray-900">PHP ${Number(b.total_amount).toLocaleString('en-PH',{minimumFractionDigits:2})}</div>
              <div class="text-xs text-gray-500 mt-0.5">${b.payment_status}</div>
            </td>
            <td class="px-6 py-4">
              <span class="px-3 py-1 text-xs font-medium rounded-full ${statusColors[b.status]||''}">${b.status}</span>
            </td>
            <td class="px-6 py-4">
              <div class="flex gap-2">
                <button class="btn-icon btn-ghost text-gray-500 hover:text-primary-600" aria-label="View Details" title="View Details">
                  <i class="fas fa-eye"></i>
                </button>
                <button class="btn-icon btn-ghost text-gray-500 hover:text-red-600" aria-label="Cancel Booking" title="Cancel Booking">
                  <i class="fas fa-ban"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function applyFilters() {
      const q = document.getElementById('booking-search').value.toLowerCase();
      const s = document.getElementById('status-filter').value;
      let filtered = allBookings;
      if (s !== 'all') filtered = filtered.filter(b => b.status === s);
      if (q) filtered = filtered.filter(b => b.guest_name.toLowerCase().includes(q) || b.id.toLowerCase().includes(q));
      renderBookings(filtered);
    }

    function searchBookings(q) { applyFilters(); }

    loadBookings();
  </script>
</body>
</html>
