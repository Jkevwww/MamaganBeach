<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Mamagan Beach Resort Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex-shrink-0 hidden md:flex flex-col relative z-20">
      <div class="p-6 border-b border-gray-200">
        <a href="/" class="flex items-center gap-3 group">
          <img src="/images/logos/LOGO.png" alt="Mamagan Logo" class="h-10 group-hover:scale-105 transition-transform">
          <div class="flex flex-col">
            <span class="font-heading font-bold text-lg leading-tight text-gray-900">Mamagan</span>
            <span class="text-[10px] font-bold uppercase tracking-wider text-primary-600">Admin Panel</span>
          </div>
        </a>
      </div>
      <nav id="admin-nav" class="flex-1 p-4 space-y-1 overflow-y-auto"></nav>
      <div class="p-4 border-t border-gray-200">
        <button id="logout-btn" title="Sign Out" aria-label="Sign Out" class="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg transition-all">
          <i class="fas fa-sign-out-alt w-5 text-center"></i>
          <span class="text-sm font-medium">Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto bg-gray-50">
      <!-- Top Bar -->
      <header class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center sticky top-0 z-10">
        <div>
          <h1 class="font-heading text-2xl font-bold text-gray-900">Dashboard</h1>
          <p class="text-xs text-gray-500 mt-1" id="current-date"></p>
        </div>
        <div class="flex items-center gap-4">
          <div id="auth-nav" class="flex items-center gap-3"></div>
        </div>
      </header>

      <main class="p-8 space-y-8 page-transition">
        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <div class="stat-card">
            <div class="flex items-center justify-between mb-4">
              <div class="stat-icon stat-icon-primary">
                <i class="fas fa-calendar-check"></i>
              </div>
              <span class="text-xs font-medium text-green-600 bg-green-50 px-2 py-1 rounded-full">+12%</span>
            </div>
            <p class="stat-value" id="stat-bookings">-</p>
            <p class="stat-label">Total Bookings</p>
          </div>
          
          <div class="stat-card">
            <div class="flex items-center justify-between mb-4">
              <div class="stat-icon stat-icon-success">
                <i class="fas fa-sun"></i>
              </div>
              <span class="text-xs font-medium text-green-600 bg-green-50 px-2 py-1 rounded-full">+8%</span>
            </div>
            <p class="stat-value" id="stat-today">-</p>
            <p class="stat-label">Today's Arrivals</p>
          </div>
          
          <div class="stat-card">
            <div class="flex items-center justify-between mb-4">
              <div class="stat-icon stat-icon-warning">
                <i class="fas fa-clock"></i>
              </div>
            </div>
            <p class="stat-value" id="stat-pending">-</p>
            <p class="stat-label">Pending Payments</p>
          </div>
          
          <div class="stat-card">
            <div class="flex items-center justify-between mb-4">
              <div class="stat-icon stat-icon-success">
                <i class="fas fa-peso-sign"></i>
              </div>
              <span class="text-xs font-medium text-green-600 bg-green-50 px-2 py-1 rounded-full">+15%</span>
            </div>
            <p class="stat-value" id="stat-revenue">-</p>
            <p class="stat-label">Total Revenue</p>
          </div>
        </div>

        <!-- Charts Row -->
        <div class="grid lg:grid-cols-2 gap-6">
          <div class="card p-6">
            <div class="flex items-center justify-between mb-6">
              <h3 class="font-heading font-bold text-lg text-gray-900">Revenue Trend</h3>
              <span class="text-xs text-gray-500">Last 7 days</span>
            </div>
            <div class="chart-container">
              <canvas id="revenueChart"></canvas>
            </div>
          </div>
          
          <div class="card p-6">
            <div class="flex items-center justify-between mb-6">
              <h3 class="font-heading font-bold text-lg text-gray-900">Facility Occupancy</h3>
              <span class="text-xs text-gray-500">Current rate</span>
            </div>
            <div class="chart-container">
              <canvas id="facilityChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="card overflow-hidden">
          <div class="px-6 py-5 border-b border-gray-200 flex justify-between items-center">
            <div>
              <h3 class="font-heading font-bold text-lg text-gray-900">Recent Bookings</h3>
              <p class="text-xs text-gray-500 mt-1">Latest reservations</p>
            </div>
            <a href="/admin/bookings.html" class="text-sm font-medium text-primary-600 hover:text-primary-700 transition-colors">View All</a>
          </div>
          <div class="overflow-x-auto">
            <table class="table">
              <thead>
                <tr>
                  <th>Guest</th>
                  <th>Facility</th>
                  <th>Date</th>
                  <th>Amount</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="recent-bookings" class="divide-y divide-gray-100"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/admin.js?v=2"></script>
  <script>
    // Admin Authorization Check
    (function() {
      const token = localStorage.getItem('token');
      const userStr = localStorage.getItem('user');
      try {
        const user = userStr ? JSON.parse(userStr) : null;
        if (!token || !user || user.role !== 'admin') {
          window.location.replace('/login.html?redirect=' + encodeURIComponent(window.location.pathname));
          return;
        }
      } catch (e) {
        window.location.replace('/login.html');
      }
    })();

    if (!requireAdmin()) throw new Error('Admin required');
    renderAdminNav('dashboard');
    document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-PH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    let revenueChartInstance = null;
    let facilityChartInstance = null;

    async function loadDashboard() {
      const res = await api.get('/admin/dashboard');
      if (!res.success) { showToast('Failed to load dashboard data.', 'error'); return; }
      const { stats, recent_bookings } = res.data;

      document.getElementById('stat-bookings').textContent = stats.total_bookings.toLocaleString();
      document.getElementById('stat-today').textContent = stats.today_bookings.toLocaleString();
      document.getElementById('stat-pending').textContent = stats.pending_payments.toLocaleString();
      document.getElementById('stat-revenue').textContent = 'PHP ' + stats.total_revenue.toLocaleString('en-PH', {minimumFractionDigits: 0});
      document.getElementById('stat-facilities').textContent = stats.total_facilities.toLocaleString();

      const tbody = document.getElementById('recent-bookings');
      tbody.innerHTML = recent_bookings.map(b => {
        const statusColors = { 
          pending: 'bg-yellow-100 text-yellow-700', 
          confirmed: 'bg-green-100 text-green-700', 
          cancelled: 'bg-red-100 text-red-700', 
          completed: 'bg-gray-100 text-gray-700' 
        };
        return `
          <tr class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4">
              <div class="text-sm font-medium text-gray-900">${b.guest_name}</div>
              <div class="text-xs text-gray-500 font-mono mt-0.5">#${b.id.substring(0,8)}</div>
            </td>
            <td class="px-6 py-4 text-sm text-gray-600">${b.facility_name}</td>
            <td class="px-6 py-4">
              <div class="text-sm text-gray-600">${b.booking_date}</div>
              <div class="text-xs text-primary-600 font-medium mt-0.5">${b.time_slot}</div>
            </td>
            <td class="px-6 py-4 text-sm font-semibold text-gray-900">PHP ${Number(b.total_amount).toLocaleString('en-PH',{minimumFractionDigits:2})}</td>
            <td class="px-6 py-4">
              <span class="px-3 py-1 text-xs font-medium rounded-full ${statusColors[b.status]||''}">${b.status}</span>
            </td>
          </tr>
        `;
      }).join('');

      loadCharts();
    }

    async function loadCharts() {
      const revRes = await api.get('/admin/reports/revenue?period=daily');
      if (revRes.success && revRes.data) {
        const labels = revRes.data.map(d => d.period).reverse();
        const data = revRes.data.map(d => parseFloat(d.revenue)).reverse();
        const ctx = document.getElementById('revenueChart').getContext('2d');
        if (revenueChartInstance) revenueChartInstance.destroy();
        revenueChartInstance = new Chart(ctx, {
          type: 'line',
          data: { 
            labels, 
            datasets: [{ 
              label: 'Revenue', 
              data, 
              borderColor: '#0891b2', 
              backgroundColor: 'rgba(8,145,178,0.1)', 
              fill: true, 
              tension: 0.4, 
              borderWidth: 2, 
              pointRadius: 4, 
              pointBackgroundColor: '#0891b2', 
              pointBorderColor: '#fff',
              pointBorderWidth: 2
            }] 
          },
          options: { 
            responsive: true, 
            maintainAspectRatio: false,
            plugins: { legend: { display: false } }, 
            scales: { 
              y: { 
                beginAtZero: true, 
                grid: { color: 'rgba(0,0,0,0.05)' },
                ticks: { font: { family: 'Inter' } }
              }, 
              x: { 
                grid: { display: false },
                ticks: { font: { family: 'Inter' } }
              } 
            } 
          }
        });
      }

      const occRes = await api.get('/admin/reports/occupancy');
      if (occRes.success && occRes.data) {
        const labels = occRes.data.map(r => r.facility_name);
        const data = occRes.data.map(r => parseFloat(r.occupancy_rate) || 0);
        const ctx2 = document.getElementById('facilityChart').getContext('2d');
        if (facilityChartInstance) facilityChartInstance.destroy();
        facilityChartInstance = new Chart(ctx2, {
          type: 'bar',
          data: { 
            labels, 
            datasets: [{ 
              label: 'Occupancy %', 
              data, 
              backgroundColor: '#0891b2', 
              borderRadius: 6, 
              hoverBackgroundColor: '#0e7490' 
            }] 
          },
          options: { 
            responsive: true, 
            maintainAspectRatio: false,
            plugins: { legend: { display: false } }, 
            scales: { 
              y: { 
                beginAtZero: true, 
                max: 100, 
                grid: { color: 'rgba(0,0,0,0.05)' },
                ticks: { font: { family: 'Inter' } }
              }, 
              x: { 
                grid: { display: false },
                ticks: { font: { family: 'Inter' } }
              } 
            } 
          }
        });
      }
    }

    loadDashboard();
  </script>
</body>
</html>
