<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Control | Mamagan Beach Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <style>
body .flatpickr-calendar .flatpickr-months { display: flex !important; align-items: center !important; justify-content: space-between !important; width: 100% !important; }
body .flatpickr-calendar .flatpickr-prev-month, body .flatpickr-calendar .flatpickr-next-month { position: static !important; display: flex !important; align-items: center !important; justify-content: center !important; width: 2.25rem !important; height: 2.25rem !important; border-radius: 9999px !important; background: rgba(11,25,44,0.05) !important; color: #0B192C !important; padding: 0 !important; }
body .flatpickr-calendar .flatpickr-prev-month:hover, body .flatpickr-calendar .flatpickr-next-month:hover { background: #0B192C !important; color: #ffffff !important; }
body .flatpickr-calendar .flatpickr-current-month { position: static !important; display: flex !important; align-items: center !important; justify-content: center !important; gap: 0.25rem !important; font-size: 1.125rem !important; font-weight: 800 !important; color: #0B192C !important; width: auto !important; height: auto !important; padding: 0 !important; }
body .flatpickr-calendar select.flatpickr-monthDropdown-months { background: transparent !important; border: none !important; font-weight: 800 !important; color: #0B192C !important; padding: 0 !important; appearance: none !important; }
body .flatpickr-calendar input.cur-year { background: transparent !important; border: none !important; box-shadow: none !important; font-weight: 800 !important; color: #0B192C !important; padding: 0 !important; margin: 0 !important; width: 3.2rem !important; appearance: textfield !important; display: inline-block !important; }
body .flatpickr-calendar input.cur-year::-webkit-inner-spin-button, body .flatpickr-calendar input.cur-year::-webkit-outer-spin-button { -webkit-appearance: none !important; margin: 0 !important; }
body .flatpickr-calendar .flatpickr-weekdays { display: flex !important; width: 100% !important; }
body .flatpickr-calendar .flatpickr-weekdaycontainer { display: grid !important; grid-template-columns: repeat(7, 1fr) !important; width: 100% !important; }
body .flatpickr-calendar span.flatpickr-weekday { display: block !important; text-align: center !important; font-size: 0.7rem !important; font-weight: 900 !important; text-transform: uppercase !important; color: rgba(11,25,44,0.3) !important; }
body .flatpickr-calendar .flatpickr-days, body .flatpickr-calendar .dayContainer { display: grid !important; grid-template-columns: repeat(7, 1fr) !important; width: 100% !important; justify-items: center !important; }
body .flatpickr-calendar .flatpickr-day { display: flex !important; align-items: center !important; justify-content: center !important; border-radius: 9999px !important; font-weight: 600 !important; color: #0B192C !important; border: 1px solid transparent !important; margin: 0 !important; }
body .flatpickr-calendar .flatpickr-day:hover { background: rgba(197,168,128,0.2) !important; color: #C5A880 !important; }
body .flatpickr-calendar .flatpickr-day.selected, body .flatpickr-calendar .flatpickr-day.startRange, body .flatpickr-calendar .flatpickr-day.endRange { background: #0B192C !important; color: #ffffff !important; border-color: #0B192C !important; }
body .flatpickr-calendar .flatpickr-day.today { border-color: #C5A880 !important; color: #C5A880 !important; }
body .flatpickr-calendar.inline { display: block !important; width: 100% !important; background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
body .flatpickr-calendar.inline .flatpickr-months { margin-bottom: 2rem !important; }
body .flatpickr-calendar.inline .flatpickr-weekdays { margin-bottom: 1rem !important; }
body .flatpickr-calendar.inline .dayContainer { gap: 0.5rem !important; }
body .flatpickr-calendar.inline .flatpickr-day { width: 2.5rem !important; height: 2.5rem !important; }
body > .flatpickr-calendar:not(.inline) { position: absolute !important; display: none !important; width: 310px !important; max-width: 310px !important; background: #ffffff !important; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1) !important; border-radius: 1.5rem !important; padding: 1.25rem !important; border: 1px solid rgba(11,25,44,0.05) !important; z-index: 99999 !important; }
body > .flatpickr-calendar:not(.inline).open { display: block !important; }
body > .flatpickr-calendar:not(.inline) .flatpickr-months { margin-bottom: 1rem !important; }
body > .flatpickr-calendar:not(.inline) .flatpickr-weekdays { margin-bottom: 0.5rem !important; }
body > .flatpickr-calendar:not(.inline) .dayContainer { gap: 0.25rem !important; }
body > .flatpickr-calendar:not(.inline) .flatpickr-day { width: 2rem !important; height: 2rem !important; font-size: 0.875rem !important; }
  </style>
</head>
<body class="bg-lux-cream font-sans text-lux-navy">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-80 bg-white border-r border-lux-navy/5 flex-shrink-0 hidden md:flex flex-col relative z-20">
      <div class="p-10 border-b border-lux-navy/5">
        <a href="/" class="flex items-center gap-4 group">
          <img src="/images/logos/LOGO.png" alt="Mamagan Logo" class="h-12 group-hover:scale-110 transition-transform">
          <div class="flex flex-col">
            <span class="luxury-heading font-bold text-xl leading-none">Mamagan</span>
            <span class="text-[8px] font-black uppercase tracking-[0.4em] text-lux-gold mt-1">Beach Resort</span>
          </div>
        </a>
      </div>
      <nav id="admin-nav" class="flex-1 p-6 space-y-2"></nav>
      <div class="p-8 border-t border-lux-navy/5">
        <button id="logout-btn" class="w-full flex items-center gap-4 px-6 py-4 text-red-600 hover:bg-red-50 rounded-2xl transition-all">
          <i class="fas fa-sign-out-alt"></i>
          <span class="text-[10px] font-black uppercase tracking-widest">TERMINATE SESSION</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto">
      <header class="bg-white/80 backdrop-blur-xl border-b border-lux-navy/5 px-10 py-6 flex justify-between items-center sticky top-0 z-30">
        <div>
          <h1 class="luxury-heading text-2xl font-bold text-lux-navy">Inventory Control</h1>
          <p class="text-[10px] font-bold text-lux-navy/30 uppercase tracking-widest">Global Asset Blackout Protocol</p>
        </div>
        <div id="auth-nav"></div>
      </header>

      <main class="p-10">
        <div class="grid lg:grid-cols-2 gap-10">
          
          <!-- Column 1: Asset Calendar -->
          <div class="bg-white rounded-[3rem] p-12 border border-lux-navy/5 shadow-2xl shadow-lux-navy/5">
            <div class="flex justify-between items-center mb-10">
              <h3 class="luxury-heading text-xl font-bold">Asset Calendar</h3>
              <div class="flex gap-4">
                <div class="flex items-center gap-2">
                  <div class="w-2 h-2 rounded-full bg-lux-navy/10"></div>
                  <span class="text-[9px] font-black uppercase tracking-widest text-lux-navy/40">Blocked</span>
                </div>
                <div class="flex items-center gap-2">
                  <div class="w-2 h-2 rounded-full border border-lux-gold"></div>
                  <span class="text-[9px] font-black uppercase tracking-widest text-lux-navy/40">Today</span>
                </div>
              </div>
            </div>
            
            <!-- Blueprint Container -->
            <div id="isolated-inline-wrapper" class="w-full">
              <div id="inline-calendar"></div>
            </div>
          </div>

          <!-- Column 2: Form -->
          <div class="space-y-8">
            <div class="bg-white/50 backdrop-blur-md p-12 rounded-[3rem] border border-lux-navy/5 shadow-xl">
              <h3 class="luxury-heading text-xl font-bold mb-8">Blackout Protocol</h3>
              <form id="block-form" class="space-y-6">
                <div>
                  <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/40 ml-2">Target Asset</label>
                  <select id="facility-select" class="premium-input mt-1">
                    <option value="all">Global (All Assets)</option>
                  </select>
                </div>
                <div>
                  <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/40 ml-2">Temporal Window</label>
                  <input type="text" id="block-dates" class="premium-input mt-1" placeholder="Select date range...">
                </div>
                <div>
                  <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/40 ml-2">Justification</label>
                  <textarea id="reason" class="premium-input mt-1 h-32 focus:ring-2 focus:ring-lux-gold/20" placeholder="State reason for blockage..."></textarea>
                </div>
                <button type="submit" class="premium-button-navy w-full py-5 rounded-2xl flex items-center justify-center gap-3">
                  <span class="text-[11px] font-black uppercase tracking-widest">Activate Blackout</span>
                  <i class="fas fa-lock text-[10px]"></i>
                </button>
              </form>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/admin.js?v=2"></script>
  <script>
    let calendar;
    let currentBlockedDates = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof renderAdminNav === 'function') renderAdminNav('calendar');
      const user = await loadUser();
      if (!user || user.role !== 'admin') {
        window.location.replace('/login.html');
        return;
      }

      // 1. Initialize SINGLE Inline Calendar
      calendar = flatpickr("#inline-calendar", {
        inline: true,
        mode: "multiple",
        minDate: "today",
        dateFormat: "Y-m-d",
        onDayCreate: function(dObj, dStr, fp, dayElem) {
          const dateStr = dayElem.dateObj.toISOString().split('T')[0];
          if (currentBlockedDates.includes(dateStr)) {
            dayElem.classList.add("is-blocked");
          }
        }
      });

      // 2. Initialize Range Picker
      flatpickr("#block-dates", {
        mode: "range",
        minDate: "today",
        dateFormat: "Y-m-d"
      });

      await loadFacilities();
    });

    async function loadBlockedDates() {
      try {
        const facilityId = document.getElementById('facility-select').value;
        const res = await api.get(`/admin/block-dates${facilityId !== 'all' ? '?facility_id=' + facilityId : ''}`);
        if (res.success) {
          currentBlockedDates = res.data.map(d => d.block_date.split('T')[0]);
          if (calendar) calendar.redraw();
        }
      } catch (err) {
        console.error('Blocked dates error:', err);
      }
    }

    async function loadFacilities() {
      try {
        const res = await api.get('/facilities');
        if (res.success) {
          const select = document.getElementById('facility-select');
          res.data.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f.id;
            opt.textContent = f.name;
            select.appendChild(opt);
          });
        }
        await loadBlockedDates();
      } catch (err) {
        console.error('Facilities error:', err);
      }
    }

    document.getElementById('block-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const facilityId = document.getElementById('facility-select').value;
      const dateStr = document.getElementById('block-dates').value;
      const reason = document.getElementById('reason').value;

      if (!dateStr) return showToast('Temporal window is required.', 'error');

      const parts = dateStr.split(' to ');
      const start = parts[0];
      const end = parts[1] || start;
      
      try {
        const res = await api.post('/admin/block-dates', {
          facility_id: facilityId === 'all' ? null : facilityId,
          start_date: start,
          end_date: end,
          reason: reason
        });

        if (res.success) {
          showToast('Blackout activated.', 'success');
          document.getElementById('block-form').reset();
          await loadBlockedDates();
        } else {
          showToast(res.message || 'Error.', 'error');
        }
      } catch (err) {
        showToast('Communication failure.', 'error');
      }
    });

    document.getElementById('facility-select').addEventListener('change', loadBlockedDates);
  </script>
</body>
</html>
