<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asset & Maintenance Management | Mamagan Beach Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .tab-active { border-bottom-color: var(--lux-gold) !important; color: #00234b !important; opacity: 1 !important; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .calendar-day { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; border-radius: 1rem; transition: all 0.3s; }
    .calendar-day:hover:not(.empty) { background-color: rgba(0, 35, 75, 0.05); }
    .calendar-day.active { background-color: #00234b; color: white; }
    .calendar-day.maintenance { background-color: #c5a059; color: white; }
    .calendar-day.today { border: 2px solid #c5a059; font-weight: 800; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 35, 75, 0.05); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #c5a059; border-radius: 10px; }
  </style>
</head>
<body class="bg-lux-cream font-sans text-lux-navy">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-80 bg-white border-r border-lux-navy/5 flex-shrink-0 hidden md:flex flex-col relative z-20">
      <div class="p-10 border-b border-lux-navy/5">
        <a href="/" class="flex items-center gap-4 group">
          <img src="/images/logos/LOGO.png" alt="Mamagan" class="h-12 group-hover:scale-110 transition-transform">
          <div class="flex flex-col">
            <span class="luxury-heading font-bold text-xl leading-none">Mamagan</span>
            <span class="text-[8px] font-black uppercase tracking-[0.4em] text-lux-gold mt-1">Beach Resort</span>
          </div>
        </a>
      </div>
      <nav id="admin-nav" class="flex-1 p-6 space-y-2"></nav>
      <div class="p-8 border-t border-lux-navy/5">
        <button id="logout-btn" class="w-full flex items-center gap-4 px-6 py-4 text-red-600 hover:bg-red-50 rounded-2xl transition-all group">
          <i class="fas fa-sign-out-alt w-5 text-center group-hover:-translate-x-1 transition-transform"></i>
          <span class="text-[10px] font-black uppercase tracking-widest">Terminate Session</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto bg-lux-cream/50">
      <header class="bg-white/80 backdrop-blur-xl border-b border-lux-navy/5 px-10 py-6 flex justify-between items-center sticky top-0 z-30">
        <div class="flex items-center gap-6">
            <!-- Mobile Menu Toggle -->
            <button class="md:hidden text-lux-navy text-xl"><i class="fas fa-bars"></i></button>
            <div>
              <h1 class="luxury-heading text-2xl font-bold text-lux-navy">Facility Management</h1>
              <p class="text-[10px] font-bold text-lux-navy/30 uppercase tracking-[0.2em]">Assets, Inventory & Maintenance Control</p>
            </div>
        </div>
        <div class="flex items-center gap-6">
          <div class="flex bg-lux-navy/5 p-1 rounded-full border border-lux-navy/5">
            <button onclick="switchTab('assets')" id="btn-tab-assets" class="tab-btn px-6 py-2 text-[10px] font-black uppercase tracking-widest rounded-full transition-all bg-white shadow-sm text-lux-navy">Assets</button>
            <button onclick="switchTab('calendar')" id="btn-tab-calendar" class="tab-btn px-6 py-2 text-[10px] font-black uppercase tracking-widest rounded-full transition-all text-lux-navy/40 hover:text-lux-navy">Maintenance</button>
          </div>
          <button onclick="openAssetModal()" class="px-8 py-3 bg-lux-navy text-white text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-lux-gold transition-all shadow-xl">
            <i class="fas fa-plus mr-2"></i>New Asset
          </button>
          <div id="auth-nav"></div>
        </div>
      </header>

      <main class="p-10 page-transition">
        <!-- Assets Tab -->
        <section id="tab-content-assets" class="space-y-8">
          <div class="flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
              <h3 class="luxury-heading text-xl font-bold">Registered Assets</h3>
              <p class="text-[10px] font-bold text-lux-navy/30 uppercase tracking-[0.2em]">Total inventory overview</p>
            </div>
            <div class="flex items-center gap-4 w-full md:w-auto">
              <div class="relative w-full md:w-80">
                <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-lux-navy/20"></i>
                <input type="text" id="asset-search" oninput="renderAssets()" placeholder="Search assets..." class="w-full pl-14 pr-6 py-3 bg-white rounded-full border border-lux-navy/5 text-[10px] font-bold uppercase tracking-widest outline-none focus:border-lux-gold shadow-sm">
              </div>
              <button onclick="clearAllAssets()" class="px-6 py-3 bg-red-50 text-red-600 text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-red-600 hover:text-white transition-all whitespace-nowrap">
                <i class="fas fa-trash-sweep mr-2"></i>Clear All
              </button>
            </div>
          </div>
          <div id="assets-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
            <!-- Asset Cards injected here -->
          </div>
        </section>

        <!-- Maintenance Calendar Tab -->
        <section id="tab-content-calendar" class="hidden space-y-10">
          <div class="grid lg:grid-cols-3 gap-10">
            <!-- Calendar View -->
            <div class="lg:col-span-2 bg-white rounded-[3rem] p-10 premium-shadow">
              <div class="flex justify-between items-center mb-8">
                <div>
                  <h3 id="calendar-month-year" class="luxury-heading text-2xl font-bold">Month Year</h3>
                  <p class="text-[10px] font-bold text-lux-navy/30 uppercase tracking-[0.2em]">Maintenance Schedule</p>
                </div>
                <div class="flex gap-2">
                  <button onclick="prevMonth()" class="w-10 h-10 rounded-full border border-lux-navy/10 flex items-center justify-center hover:bg-lux-navy hover:text-white transition-all"><i class="fas fa-chevron-left text-xs"></i></button>
                  <button onclick="nextMonth()" class="w-10 h-10 rounded-full border border-lux-navy/10 flex items-center justify-center hover:bg-lux-navy hover:text-white transition-all"><i class="fas fa-chevron-right text-xs"></i></button>
                </div>
              </div>
              
              <div class="calendar-grid text-center mb-4">
                <div class="text-[10px] font-black text-lux-navy/20 uppercase tracking-widest py-4">Sun</div>
                <div class="text-[10px] font-black text-lux-navy/20 uppercase tracking-widest py-4">Mon</div>
                <div class="text-[10px] font-black text-lux-navy/20 uppercase tracking-widest py-4">Tue</div>
                <div class="text-[10px] font-black text-lux-navy/20 uppercase tracking-widest py-4">Wed</div>
                <div class="text-[10px] font-black text-lux-navy/20 uppercase tracking-widest py-4">Thu</div>
                <div class="text-[10px] font-black text-lux-navy/20 uppercase tracking-widest py-4">Fri</div>
                <div class="text-[10px] font-black text-lux-navy/20 uppercase tracking-widest py-4">Sat</div>
              </div>
              <div id="calendar-days" class="calendar-grid gap-2">
                <!-- Days injected here -->
              </div>
            </div>

            <!-- Maintenance CRUD -->
            <div class="space-y-6">
              <div class="bg-white rounded-[3rem] p-8 premium-shadow">
                <h4 id="maint-form-title" class="luxury-heading text-lg font-bold mb-6">Schedule Maintenance</h4>
                <form id="maintenance-form" class="space-y-4">
                  <input type="hidden" id="maint-id">
                  <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Select Asset</label>
                    <select id="maint-asset-id" required class="premium-input bg-lux-navy/5 border-transparent focus:bg-white"></select>
                  </div>
                  <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                      <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Start Date</label>
                      <input type="date" id="maint-start" required class="premium-input bg-lux-navy/5 border-transparent focus:bg-white text-xs">
                    </div>
                    <div class="space-y-1">
                      <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">End Date</label>
                      <input type="date" id="maint-end" required class="premium-input bg-lux-navy/5 border-transparent focus:bg-white text-xs">
                    </div>
                  </div>
                  <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Reason</label>
                    <input type="text" id="maint-reason" placeholder="Routine check, cleaning, repair..." required class="premium-input bg-lux-navy/5 border-transparent focus:bg-white">
                  </div>
                  <div class="flex gap-2">
                    <button type="submit" id="maint-submit-btn" class="premium-button-gold flex-1">Schedule Blackout</button>
                    <button type="button" id="maint-cancel-btn" onclick="resetMaintenanceForm()" class="hidden px-6 py-3 bg-lux-navy/5 text-lux-navy/40 text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-lux-navy/10 transition-all">Cancel</button>
                  </div>
                </form>
              </div>

              <div class="bg-white rounded-[3rem] p-8 premium-shadow overflow-hidden">
                <h4 class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 mb-6">Upcoming Blackouts</h4>
                <div id="maintenance-list" class="space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                  <!-- List items -->
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Asset Modal -->
  <div id="asset-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6">
    <div class="absolute inset-0 bg-lux-navy/40 backdrop-blur-sm" onclick="closeAssetModal()"></div>
    <div class="relative bg-white rounded-[3rem] w-full max-w-2xl overflow-hidden shadow-2xl fade-in">
      <div class="p-10 border-b border-lux-navy/5 flex justify-between items-center">
        <h3 id="asset-modal-title" class="luxury-heading text-2xl font-bold">Asset Registration</h3>
        <button onclick="closeAssetModal()" class="text-lux-navy/20 hover:text-lux-navy transition-colors"><i class="fas fa-times"></i></button>
      </div>
      <form id="asset-form" class="p-10 space-y-6">
        <input type="hidden" id="asset-id">
        <div class="grid md:grid-cols-2 gap-6">
          <div class="space-y-1">
            <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Asset Name</label>
            <input type="text" id="asset-name" required class="premium-input bg-lux-navy/5 border-transparent focus:bg-white" placeholder="e.g. Presidential Suite">
          </div>
          <div class="space-y-1">
            <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Category</label>
            <input type="text" id="asset-category" required class="premium-input bg-lux-navy/5 border-transparent focus:bg-white" placeholder="e.g. Accommodation">
          </div>
        </div>
        <div class="grid md:grid-cols-2 gap-6">
          <div class="space-y-1">
            <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Status</label>
            <select id="asset-status" required class="premium-input bg-lux-navy/5 border-transparent focus:bg-white">
              <option value="Available">Available</option>
              <option value="Maintenance">Maintenance</option>
              <option value="Occupied">Occupied</option>
              <option value="Decommissioned">Decommissioned</option>
            </select>
          </div>
          <div class="space-y-1">
            <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Rate (PHP)</label>
            <input type="number" id="asset-rate" required class="premium-input bg-lux-navy/5 border-transparent focus:bg-white" placeholder="0.00">
          </div>
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Description</label>
          <textarea id="asset-description" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white h-24" placeholder="Features, amenities, or notes..."></textarea>
        </div>
        <div class="space-y-4">
          <div class="flex p-1 bg-lux-navy/5 rounded-2xl w-fit">
            <button type="button" onclick="setImgSrc('url')" id="img-tab-url" class="px-6 py-2 text-[8px] font-black uppercase tracking-widest rounded-xl transition-all bg-lux-navy text-white">URL</button>
            <button type="button" onclick="setImgSrc('file')" id="img-tab-file" class="px-6 py-2 text-[8px] font-black uppercase tracking-widest rounded-xl transition-all text-lux-navy/40">Upload</button>
          </div>
          <div id="img-url-input" class="space-y-1">
            <input type="url" id="asset-image-url" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white" placeholder="https://image-link.com/photo.jpg">
          </div>
          <div id="img-file-input" class="hidden space-y-1">
            <input type="file" id="asset-image-file" accept="image/*" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white">
          </div>
          <div class="flex items-center gap-4 p-4 bg-lux-navy/5 rounded-2xl">
            <div id="img-preview" class="w-16 h-16 rounded-xl bg-lux-navy/10 overflow-hidden bg-cover bg-center flex items-center justify-center">
              <i class="fas fa-image text-lux-navy/10 text-xl"></i>
            </div>
            <span class="text-[10px] font-bold text-lux-navy/30 uppercase tracking-widest">Image Preview</span>
          </div>
        </div>
        <button type="submit" class="premium-button-gold w-full flex items-center justify-center gap-4 group">
          <span id="save-btn-text">Register Asset</span>
          <i class="fas fa-save"></i>
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/admin.js?v=2"></script>
  
  <script>
    // --- Data Management (LocalStorage with API Sync) ---
    const STORAGE_KEY_ASSETS = 'mamagan_assets';
    const STORAGE_KEY_MAINT = 'mamagan_maintenance';

    let assets = [];
    let maintenance = [];

    async function initData() {
      // 1. Load Maintenance from LocalStorage
      try {
        const storedMaint = localStorage.getItem(STORAGE_KEY_MAINT);
        maintenance = storedMaint ? JSON.parse(storedMaint) : [];
      } catch(e) {
        console.error('Maintenance data corrupted', e);
        maintenance = [];
      }

      // 2. Load Assets from LocalStorage
      try {
        const storedAssets = localStorage.getItem(STORAGE_KEY_ASSETS);
        if (storedAssets && JSON.parse(storedAssets).length > 0) {
          assets = JSON.parse(storedAssets);
        } else {
          // 3. Fallback: Load from API if localStorage is empty
          console.log('LocalStorage empty or empty array, syncing from server...');
          const res = await api.get('/facilities');
          if (res.success && res.data && res.data.length > 0) {
            assets = res.data.map(f => ({
              id: f.id.toString(),
              name: f.name,
              category: f.type,
              status: f.status || 'Available',
              rate: f.base_price,
              description: f.description,
              image: (f.images && f.images.length > 0) ? f.images[0] : ''
            }));
            saveData();
          } else {
            // Static defaults if API fails or also empty
            assets = [
              { id: '1', name: 'Royal Villa', category: 'Accommodation', status: 'Available', rate: 15000, description: 'Private pool, ocean view, 2 bedrooms.', image: 'https://images.unsplash.com/photo-1540541338287-41700207dee6?auto=format&fit=crop&w=800&q=80' },
              { id: '2', name: 'Zen Garden Spa', category: 'Wellness', status: 'Maintenance', rate: 5000, description: 'Traditional massage and aromatherapy center.', image: 'https://images.unsplash.com/photo-1544161515-4ae6ce6be87e?auto=format&fit=crop&w=800&q=80' }
            ];
          }
        }
      } catch(e) {
        console.error('Asset data corrupted', e);
        assets = [];
      }
      
      renderAssets();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY_ASSETS, JSON.stringify(assets));
      localStorage.setItem(STORAGE_KEY_MAINT, JSON.stringify(maintenance));
    }

    // --- Tab Switching ---
    function switchTab(tab) {
      document.getElementById('tab-content-assets').classList.toggle('hidden', tab !== 'assets');
      document.getElementById('tab-content-calendar').classList.toggle('hidden', tab !== 'calendar');
      
      const btnAssets = document.getElementById('btn-tab-assets');
      const btnCalendar = document.getElementById('btn-tab-calendar');
      
      if(tab === 'assets') {
        btnAssets.classList.add('bg-white', 'shadow-sm', 'text-lux-navy');
        btnAssets.classList.remove('text-lux-navy/40');
        btnCalendar.classList.remove('bg-white', 'shadow-sm', 'text-lux-navy');
        btnCalendar.classList.add('text-lux-navy/40');
        renderAssets();
      } else {
        btnCalendar.classList.add('bg-white', 'shadow-sm', 'text-lux-navy');
        btnCalendar.classList.remove('text-lux-navy/40');
        btnAssets.classList.remove('bg-white', 'shadow-sm', 'text-lux-navy');
        btnAssets.classList.add('text-lux-navy/40');
        initCalendar();
        renderMaintenanceList();
      }
    }

    // --- Assets Logic ---
    function renderAssets() {
      const container = document.getElementById('assets-container');
      if (!container) return;
      
      const query = document.getElementById('asset-search').value.toLowerCase();
      const filtered = assets.filter(a => 
        (a.name && a.name.toLowerCase().includes(query)) || 
        (a.category && a.category.toLowerCase().includes(query)) ||
        (a.id && a.id.toLowerCase().includes(query))
      );
      
      if(filtered.length === 0) {
        container.innerHTML = `
            <div class="col-span-full py-20 text-center flex flex-col items-center gap-4 opacity-20">
                <i class="fas fa-box-open text-6xl"></i>
                <span class="font-black uppercase tracking-[0.5em]">No Assets Found</span>
            </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(a => `
        <div class="bg-white rounded-[2.5rem] overflow-hidden premium-shadow group hover:-translate-y-2 transition-all duration-500 border border-lux-navy/5 card-hover">
          <div class="h-56 overflow-hidden relative">
            <div class="absolute inset-0 bg-cover bg-center transition-transform duration-1000 group-hover:scale-110" style="background-image: url('${a.image || '/images/placeholders/asset-placeholder.jpg'}')"></div>
            <div class="absolute top-6 right-6 flex gap-2">
              <button onclick="editAsset('${a.id}')" title="Edit Asset" class="w-10 h-10 rounded-full bg-white/90 backdrop-blur flex items-center justify-center text-lux-navy hover:text-lux-gold transition-all shadow-lg"><i class="fas fa-pencil-alt text-xs"></i></button>
              <button onclick="deleteAsset('${a.id}')" title="Decommission" class="w-10 h-10 rounded-full bg-white/90 backdrop-blur flex items-center justify-center text-red-500 hover:bg-red-500 hover:text-white transition-all shadow-lg"><i class="fas fa-trash-alt text-xs"></i></button>
            </div>
            <div class="absolute bottom-6 left-6">
              <span class="px-4 py-1.5 bg-lux-navy/90 backdrop-blur text-white text-[8px] font-black uppercase tracking-widest rounded-full">${a.category || 'Asset'}</span>
            </div>
          </div>
          <div class="p-8 space-y-4">
            <div class="flex justify-between items-start">
              <div class="flex-1">
                <h3 class="luxury-heading text-xl font-bold line-clamp-1">${a.name}</h3>
                <span class="text-[9px] font-bold ${getStatusColor(a.status)} uppercase tracking-widest">${a.status || 'Available'}</span>
              </div>
              <p class="text-xl font-black text-lux-gold ml-4">₱${Number(a.rate || 0).toLocaleString()}</p>
            </div>
            <p class="text-xs text-lux-navy/50 leading-relaxed line-clamp-2 h-10">${a.description || 'No description provided.'}</p>
            <div class="pt-6 border-t border-lux-navy/5 flex justify-between items-center">
              <span class="text-[8px] font-black text-lux-navy/20 uppercase tracking-widest italic">ID: ${(a.id || '').substring(0,8)}</span>
              <button onclick="editAsset('${a.id}')" class="text-[9px] font-black text-lux-gold hover:text-lux-navy uppercase tracking-[0.2em] transition-all">Modify <i class="fas fa-chevron-right ml-1"></i></button>
            </div>
          </div>
        </div>
      `).join('');

      // Update maintenance select options
      const maintSelect = document.getElementById('maint-asset-id');
      if (maintSelect) {
        maintSelect.innerHTML = assets.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
      }
    }

    function getStatusColor(status) {
      switch(status) {
        case 'Available': return 'text-green-500';
        case 'Maintenance': return 'text-amber-500';
        case 'Occupied': return 'text-lux-gold';
        default: return 'text-red-500';
      }
    }

    function openAssetModal(id = null) {
      const modal = document.getElementById('asset-modal');
      const form = document.getElementById('asset-form');
      const title = document.getElementById('asset-modal-title');
      const btnText = document.getElementById('save-btn-text');
      
      form.reset();
      document.getElementById('asset-id').value = '';
      updatePreview('');

      if(id) {
        const asset = assets.find(a => a.id === id);
        if(asset) {
          title.textContent = 'Modify Asset';
          btnText.textContent = 'Update Asset';
          document.getElementById('asset-id').value = asset.id;
          document.getElementById('asset-name').value = asset.name;
          document.getElementById('asset-category').value = asset.category;
          document.getElementById('asset-status').value = asset.status;
          document.getElementById('asset-rate').value = asset.rate;
          document.getElementById('asset-description').value = asset.description;
          document.getElementById('asset-image-url').value = (asset.image && !asset.image.startsWith('data:')) ? asset.image : '';
          if(asset.image) updatePreview(asset.image);
        }
      } else {
        title.textContent = 'Asset Registration';
        btnText.textContent = 'Register Asset';
      }

      modal.classList.remove('hidden');
    }

    function closeAssetModal() {
      document.getElementById('asset-modal').classList.add('hidden');
    }

    function setImgSrc(type) {
      const urlTab = document.getElementById('img-tab-url');
      const fileTab = document.getElementById('img-tab-file');
      const urlInput = document.getElementById('img-url-input');
      const fileInput = document.getElementById('img-file-input');
      
      if(type === 'url') {
        urlTab.classList.add('bg-lux-navy', 'text-white');
        urlTab.classList.remove('text-lux-navy/40');
        fileTab.classList.remove('bg-lux-navy', 'text-white');
        fileTab.classList.add('text-lux-navy/40');
        urlInput.classList.remove('hidden');
        fileInput.classList.add('hidden');
      } else {
        fileTab.classList.add('bg-lux-navy', 'text-white');
        fileTab.classList.remove('text-lux-navy/40');
        urlTab.classList.remove('bg-lux-navy', 'text-white');
        urlTab.classList.add('text-lux-navy/40');
        fileInput.classList.remove('hidden');
        urlInput.classList.add('hidden');
      }
    }

    function updatePreview(src) {
      const preview = document.getElementById('img-preview');
      if (src) {
        preview.style.backgroundImage = `url('${src}')`;
        preview.innerHTML = '';
      } else {
        preview.style.backgroundImage = 'none';
        preview.innerHTML = '<i class="fas fa-image text-lux-navy/10 text-xl"></i>';
      }
    }

    document.getElementById('asset-image-url').addEventListener('input', (e) => updatePreview(e.target.value));
    document.getElementById('asset-image-file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if(file) {
        const reader = new FileReader();
        reader.onload = (ev) => updatePreview(ev.target.result);
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('asset-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('asset-id').value;
      const preview = document.getElementById('img-preview').style.backgroundImage;
      
      const imageStr = preview && preview !== 'none' ? preview.replace(/^url\(["']?/, '').replace(/["']?\)$/, '') : '';
      
      const assetData = {
        id: id || Date.now().toString(),
        name: document.getElementById('asset-name').value,
        category: document.getElementById('asset-category').value,
        status: document.getElementById('asset-status').value,
        rate: document.getElementById('asset-rate').value,
        description: document.getElementById('asset-description').value,
        image: imageStr
      };

      if(id) {
        const index = assets.findIndex(a => a.id === id);
        if (index !== -1) assets[index] = assetData;
        showToast('Asset updated successfully', 'success');
      } else {
        assets.push(assetData);
        showToast('New asset registered', 'success');
      }

      saveData();
      renderAssets();
      closeAssetModal();
    });

    window.editAsset = (id) => openAssetModal(id);
    window.deleteAsset = (id) => {
      if(confirm('Are you sure you want to decommission this asset? This will also affect any associated maintenance schedules.')) {
        assets = assets.filter(a => a.id !== id);
        // Also remove associated maintenance
        maintenance = maintenance.filter(m => m.assetId !== id);
        saveData();
        renderAssets();
        renderMaintenanceList();
        initCalendar();
        showToast('Asset decommissioned', 'info');
      }
    };

    window.clearAllAssets = () => {
        if (confirm('DANGER: This will delete ALL assets and maintenance records from LocalStorage. Proceed?')) {
            assets = [];
            maintenance = [];
            saveData();
            renderAssets();
            renderMaintenanceList();
            initCalendar();
            showToast('All local data cleared', 'info');
        }
    }

    // --- Calendar & Maintenance Logic ---
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();

    function initCalendar() {
      const daysContainer = document.getElementById('calendar-days');
      const monthYearLabel = document.getElementById('calendar-month-year');
      if (!daysContainer) return;
      
      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      monthYearLabel.textContent = `${monthNames[currentMonth]} ${currentYear}`;
      
      daysContainer.innerHTML = '';
      
      for(let i = 0; i < firstDay; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'calendar-day empty';
        daysContainer.appendChild(emptyDiv);
      }
      
      const today = new Date();
      for(let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayDiv = document.createElement('div');
        dayDiv.className = 'calendar-day text-[10px] font-bold';
        dayDiv.textContent = d;
        
        if(today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === d) {
          dayDiv.classList.add('today');
        }
        
        const isMaintenance = maintenance.some(m => {
          const start = new Date(m.start);
          const end = new Date(m.end);
          const current = new Date(dateStr);
          return current >= start && current <= end;
        });
        
        if(isMaintenance) dayDiv.classList.add('maintenance');
        
        daysContainer.appendChild(dayDiv);
      }
    }

    function prevMonth() {
      currentMonth--;
      if(currentMonth < 0) { currentMonth = 11; currentYear--; }
      initCalendar();
    }

    function nextMonth() {
      currentMonth++;
      if(currentMonth > 11) { currentMonth = 0; currentYear++; }
      initCalendar();
    }

    function renderMaintenanceList() {
      const container = document.getElementById('maintenance-list');
      if (!container) return;
      
      if(maintenance.length === 0) {
        container.innerHTML = `
            <div class="flex flex-col items-center gap-2 py-10 opacity-20">
                <i class="fas fa-calendar-check text-4xl"></i>
                <p class="text-[10px] font-bold uppercase tracking-widest">No maintenance scheduled</p>
            </div>
        `;
        return;
      }

      container.innerHTML = maintenance.sort((a,b) => new Date(a.start) - new Date(b.start)).map(m => {
        const asset = assets.find(a => a.id === m.assetId);
        return `
          <div class="p-4 bg-lux-navy/5 rounded-2xl flex justify-between items-center group hover:bg-lux-navy/10 transition-all border border-transparent hover:border-lux-gold/20">
            <div class="flex items-center gap-4">
              <div class="w-2 h-2 rounded-full bg-lux-gold shadow-glow"></div>
              <div>
                <h5 class="text-[10px] font-black uppercase tracking-widest text-lux-navy">${asset ? asset.name : 'Unknown Asset'}</h5>
                <p class="text-[8px] font-bold text-lux-navy/40 uppercase tracking-widest">${m.start} to ${m.end}</p>
                <p class="text-[8px] font-medium text-lux-navy/60 italic mt-0.5">${m.reason}</p>
              </div>
            </div>
            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                <button onclick="editMaintenance('${m.id}')" title="Edit Schedule" class="text-lux-navy/40 hover:text-lux-gold transition-colors"><i class="fas fa-edit"></i></button>
                <button onclick="deleteMaintenance('${m.id}')" title="Cancel Schedule" class="text-red-400 hover:text-red-600 transition-colors"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('maintenance-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const mid = document.getElementById('maint-id').value;
      const maintData = {
        id: mid || Date.now().toString(),
        assetId: document.getElementById('maint-asset-id').value,
        start: document.getElementById('maint-start').value,
        end: document.getElementById('maint-end').value,
        reason: document.getElementById('maint-reason').value
      };

      if(new Date(maintData.start) > new Date(maintData.end)) {
        return showToast('Start date cannot be after end date', 'error');
      }

      if (mid) {
          const index = maintenance.findIndex(m => m.id === mid);
          if (index !== -1) maintenance[index] = maintData;
          showToast('Schedule updated', 'success');
      } else {
          maintenance.push(maintData);
          showToast('Maintenance scheduled', 'success');
      }

      saveData();
      initCalendar();
      renderMaintenanceList();
      resetMaintenanceForm();
    });

    window.editMaintenance = (id) => {
        const m = maintenance.find(item => item.id === id);
        if (!m) return;
        
        document.getElementById('maint-id').value = m.id;
        document.getElementById('maint-asset-id').value = m.assetId;
        document.getElementById('maint-start').value = m.start;
        document.getElementById('maint-end').value = m.end;
        document.getElementById('maint-reason').value = m.reason;
        
        document.getElementById('maint-form-title').textContent = 'Modify Maintenance';
        document.getElementById('maint-submit-btn').textContent = 'Update Schedule';
        document.getElementById('maint-cancel-btn').classList.remove('hidden');
        
        // Scroll to form
        document.getElementById('maintenance-form').scrollIntoView({ behavior: 'smooth' });
    };

    window.resetMaintenanceForm = () => {
        document.getElementById('maintenance-form').reset();
        document.getElementById('maint-id').value = '';
        document.getElementById('maint-form-title').textContent = 'Schedule Maintenance';
        document.getElementById('maint-submit-btn').textContent = 'Schedule Blackout';
        document.getElementById('maint-cancel-btn').classList.add('hidden');
    }

    window.deleteMaintenance = (id) => {
      if (confirm('Cancel this maintenance schedule?')) {
        maintenance = maintenance.filter(m => m.id !== id);
        saveData();
        initCalendar();
        renderMaintenanceList();
        showToast('Schedule removed', 'info');
      }
    };

    // --- Init ---
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // Essential initialization
        if (typeof renderAdminNav === 'function') {
            console.log('Rendering Admin Nav');
            renderAdminNav('facilities');
        } else {
            console.warn('renderAdminNav not found');
        }
        
        const user = await loadUser();
        if (!user || user.role !== 'admin') {
           console.warn('Unauthorized access, redirecting...');
           window.location.replace('/login.html');
           return;
        }

        await initData();
        
        document.getElementById('logout-btn').addEventListener('click', () => {
          logout();
        });

      } catch(err) {
        console.error('Initialization error:', err);
      }
    });
  </script>
</body>
</html>
