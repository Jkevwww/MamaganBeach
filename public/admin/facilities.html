<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asset Management | Mamagan Beach Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-lux-cream font-sans text-lux-navy">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-80 bg-white border-r border-lux-navy/5 flex-shrink-0 hidden md:flex flex-col relative z-20">
      <div class="p-10 border-b border-lux-navy/5">
        <a href="/" class="flex items-center gap-4 group">
          <img src="/images/logos/LOGO.png" alt="Mamagan" class="h-12 group-hover:scale-110 transition-transform">
          <div class="flex flex-col">
            <span class="luxury-heading font-bold text-xl leading-none">Mamagan</span>
            <span class="text-[8px] font-black uppercase tracking-[0.4em] text-lux-gold mt-1">Beach Resort</span>
          </div>
        </a>
      </div>
      <nav id="admin-nav" class="flex-1 p-6 space-y-2"></nav>
      <div class="p-8 border-t border-lux-navy/5">
        <button id="logout-btn" title="Sign Out" aria-label="Sign Out" class="w-full flex items-center gap-4 px-6 py-4 text-red-600 hover:bg-red-50 rounded-2xl transition-all group">
          <i class="fas fa-sign-out-alt w-5 text-center group-hover:-translate-x-1 transition-transform"></i>
          <span class="text-[10px] font-black uppercase tracking-widest">Terminate Session</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto bg-lux-cream/50">
      <header class="bg-white/80 backdrop-blur-xl border-b border-lux-navy/5 px-10 py-6 flex justify-between items-center sticky top-0 z-10">
        <div>
          <h1 class="luxury-heading text-2xl font-bold text-lux-navy">Asset Management</h1>
          <p class="text-[10px] font-bold text-lux-navy/30 uppercase tracking-[0.2em]">Manage resort facilities, inventory, and blackouts</p>
        </div>
        <div class="flex items-center gap-8">
          <button onclick="openFacilityModal()" class="px-8 py-3 bg-lux-navy text-white text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-lux-gold transition-all shadow-xl">
            <i class="fas fa-plus mr-2"></i>Register New Asset
          </button>
          <div id="auth-nav" class="flex items-center gap-3"></div>
        </div>
      </header>

      <main class="p-10 page-transition space-y-10">
        <!-- Asset Cards Grid -->
        <div class="space-y-8">
            <div class="flex justify-between items-end">
                <div>
                    <h3 class="luxury-heading text-xl font-bold">Registered Assets</h3>
                    <p class="text-[10px] font-bold text-lux-navy/30 uppercase tracking-[0.2em]">Total inventory overview</p>
                </div>
            </div>
            <div id="facilities-container" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-8">
                <!-- Facilities will be injected here -->
            </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Facility Modal -->
  <div id="facility-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6">
    <div class="absolute inset-0 bg-lux-navy/40 backdrop-blur-sm" onclick="closeModal()"></div>
    <div class="relative bg-white rounded-[3rem] w-full max-w-2xl overflow-hidden shadow-2xl fade-in">
        <div class="p-10 border-b border-lux-navy/5 flex justify-between items-center">
            <h3 id="modal-title" class="luxury-heading text-2xl font-bold">Asset Registration</h3>
            <button onclick="closeModal()" title="Close modal" aria-label="Close modal" class="text-lux-navy/20 hover:text-lux-navy transition-colors"><i class="fas fa-times"></i></button>
        </div>
        <form id="facility-form" class="p-10 space-y-6">
            <input type="hidden" id="facility-id" name="id">
            <div class="grid md:grid-cols-2 gap-6">
                <div class="space-y-1">
                    <label for="facility-name" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Asset Name</label>
                    <input type="text" id="facility-name" name="name" required class="premium-input bg-lux-navy/5 border-transparent focus:bg-white" placeholder="e.g. Royal Cabana">
                </div>
                <div class="space-y-1">
                    <label for="facility-type" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Asset Category</label>
                    <input type="text" id="facility-type" name="type" required class="premium-input bg-lux-navy/5 border-transparent focus:bg-white" placeholder="e.g. Cabana">
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <div class="space-y-1">
                    <label for="facility-status" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Asset Status</label>
                    <select id="facility-status" name="status" required class="premium-input bg-lux-navy/5 border-transparent focus:bg-white">
                        <option value="Active">Active</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Retired">Retired</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label for="facility-price" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Rate (PHP)</label>
                    <input type="number" id="facility-price" name="base_price" required class="premium-input bg-lux-navy/5 border-transparent focus:bg-white" placeholder="0.00">
                </div>
            </div>

            <div class="space-y-1">
                <label for="facility-description" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Description</label>
                <textarea id="facility-description" name="description" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white h-24" placeholder="Describe the asset..."></textarea>
            </div>

            <!-- Image Source Toggle -->
            <div class="space-y-4">
                <div class="flex p-1 bg-lux-navy/5 rounded-2xl w-fit">
                    <button type="button" onclick="toggleImageSource('url')" id="btn-url" class="px-6 py-2 text-[8px] font-black uppercase tracking-widest rounded-xl transition-all bg-lux-navy text-white">Image URL</button>
                    <button type="button" onclick="toggleImageSource('file')" id="btn-file" class="px-6 py-2 text-[8px] font-black uppercase tracking-widest rounded-xl transition-all text-lux-navy/40">Upload File</button>
                </div>

                <div id="url-source" class="space-y-1">
                    <label for="facility-image-link" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Image URL</label>
                    <input type="url" id="facility-image-link" name="images_link" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white" placeholder="https://...">
                </div>

                <div id="file-source" class="hidden space-y-1">
                    <label for="facility-image-file" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Upload Image</label>
                    <input type="file" id="facility-image-file" accept="image/*" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white">
                </div>

                <div class="flex items-center gap-4">
                    <span class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30">Preview</span>
                    <div id="facility-image-preview" class="w-24 h-24 rounded-2xl bg-lux-navy/5 border border-lux-navy/10 overflow-hidden flex items-center justify-center bg-cover bg-center">
                        <span class="text-[10px] font-bold text-lux-navy/20">No image</span>
                    </div>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="premium-button-gold w-full flex items-center justify-center gap-4 group">
                <span id="submit-btn-text">Save Asset</span>
                <i class="fas fa-save group-hover:scale-110 transition-transform"></i>
            </button>
        </form>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/admin.js?v=2"></script>
  <script>
    if (!requireAdmin()) throw new Error('Admin required');
    renderAdminNav('facilities');

    let currentResortId = null;
    let editingId = null;
    let currentImageSource = 'url';
    let base64Image = null;

    // --- Data Loading ---
    async function loadResort() {
        const res = await api.get('/resorts');
        if (res.success && res.data.length > 0) {
            currentResortId = res.data[0].id;
        }
    }

    async function loadFacilities() {
        const res = await api.get('/facilities');
        const container = document.getElementById('facilities-container');
        
        if (res.success) {
            // Update Cards Grid
            renderFacilityCards(res.data);
        } else {
            showToast('Failed to load assets', 'error');
            container.innerHTML = '<div class="col-span-full text-center py-20 text-lux-navy/20 font-black uppercase tracking-[0.5em]">System Offline</div>';
        }
    }

    function renderFacilityCards(facilities) {
        const container = document.getElementById('facilities-container');
        if (facilities.length === 0) {
            container.innerHTML = '<div class="col-span-full text-center py-20 text-lux-navy/20 font-black uppercase tracking-[0.5em]">No Assets Registered</div>';
            return;
        }

        container.innerHTML = facilities.map(f => `
            <div class="bg-white rounded-[2.5rem] overflow-hidden premium-shadow border border-lux-navy/5 card-hover group fade-in">
                <div class="h-48 bg-cover bg-center transition-transform duration-700 group-hover:scale-110 relative" style="background-image: url('${(f.images && f.images.length > 0) ? f.images[0] : '/images/placeholders/asset-placeholder.jpg'}')">
                    <div class="absolute top-6 left-6">
                        <span class="px-4 py-1.5 bg-white/90 backdrop-blur text-lux-navy text-[8px] font-black uppercase tracking-[0.2em] rounded-full">${f.type}</span>
                    </div>
                    <div class="absolute top-6 right-6 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="editFacility('${f.id}')" class="w-8 h-8 rounded-full bg-white/90 backdrop-blur flex items-center justify-center text-lux-navy hover:text-lux-gold transition-all shadow-lg">
                            <i class="fas fa-pencil-alt text-[10px]"></i>
                        </button>
                        <button onclick="deleteFacility('${f.id}')" class="w-8 h-8 rounded-full bg-white/90 backdrop-blur flex items-center justify-center text-red-500 hover:bg-red-50 transition-all shadow-lg">
                            <i class="fas fa-trash text-[10px]"></i>
                        </button>
                    </div>
                    ${f.status !== 'Active' ? `
                        <div class="absolute inset-0 bg-lux-navy/60 flex items-center justify-center">
                            <span class="text-white text-[10px] font-black uppercase tracking-widest border border-white/20 px-4 py-2 rounded-full">${f.status}</span>
                        </div>
                    ` : ''}
                </div>
                <div class="p-8">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="luxury-heading font-bold text-xl text-lux-navy">${f.name}</h3>
                        <span class="text-xl font-black text-lux-gold">₱${Number(f.base_price).toLocaleString()}</span>
                    </div>
                    <p class="text-xs text-lux-navy/60 leading-relaxed line-clamp-2 mb-6 font-medium">${f.description || 'No description provided.'}</p>
                    <div class="pt-6 border-t border-lux-navy/5 flex justify-between items-center">
                        <span class="text-[8px] font-black uppercase tracking-widest text-lux-navy/20 italic">ID: ${f.id.substring(0, 8)}</span>
                        <button onclick="editFacility('${f.id}')" class="text-[8px] font-black uppercase tracking-widest text-lux-gold hover:text-lux-navy transition-colors">Details <i class="fas fa-chevron-right ml-1"></i></button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // --- CRUD Actions ---
    async function editFacility(id) {
        const res = await api.get(`/facilities/${id}`);
        if (!res.success) return showToast('Unable to retrieve asset details.', 'error');
        
        const f = res.data;
        editingId = f.id;
        const form = document.getElementById('facility-form');
        form.elements['name'].value = f.name;
        form.elements['type'].value = f.type;
        form.elements['status'].value = f.status || 'Active';
        form.elements['base_price'].value = f.base_price;
        form.elements['description'].value = f.description || '';

        const preview = document.getElementById('facility-image-preview');
        const firstImg = (f.images && f.images.length > 0) ? f.images[0] : null;
        if (firstImg) {
            updatePreview(firstImg);
            if (firstImg.startsWith('http')) {
                toggleImageSource('url');
                document.getElementById('facility-image-link').value = firstImg;
            } else {
                toggleImageSource('file');
            }
        }

        document.getElementById('modal-title').textContent = 'Modify Asset';
        document.getElementById('submit-btn-text').textContent = 'Update Asset';
        openFacilityModal();
    }

    async function deleteFacility(id) {
        if (!confirm('Are you sure you want to decommission this asset? This cannot be undone.')) return;
        const res = await api.delete(`/facilities/${id}`);
        if (res.success) {
            showToast('Asset decommissioned successfully.', 'success');
            await loadFacilities();
        } else {
            showToast(res.message || 'Decommissioning failed.', 'error');
        }
    }

    // --- Modal & Form Logic ---
    function openFacilityModal() {
        document.getElementById('facility-modal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('facility-modal').classList.add('hidden');
        document.body.style.overflow = '';
        document.getElementById('facility-form').reset();
        document.getElementById('facility-id').value = '';
        editingId = null;
        base64Image = null;
        updatePreview(null);
        document.getElementById('modal-title').textContent = 'Asset Registration';
        document.getElementById('submit-btn-text').textContent = 'Save Asset';
    }

    function toggleImageSource(source) {
        currentImageSource = source;
        document.getElementById('url-source').classList.toggle('hidden', source !== 'url');
        document.getElementById('file-source').classList.toggle('hidden', source !== 'file');
        
        const btnUrl = document.getElementById('btn-url');
        const btnFile = document.getElementById('btn-file');
        
        if (source === 'url') {
            btnUrl.classList.add('bg-lux-navy', 'text-white');
            btnUrl.classList.remove('text-lux-navy/40');
            btnFile.classList.remove('bg-lux-navy', 'text-white');
            btnFile.classList.add('text-lux-navy/40');
        } else {
            btnFile.classList.add('bg-lux-navy', 'text-white');
            btnFile.classList.remove('text-lux-navy/40');
            btnUrl.classList.remove('bg-lux-navy', 'text-white');
            btnUrl.classList.add('text-lux-navy/40');
        }
    }

    function updatePreview(src) {
        const preview = document.getElementById('facility-image-preview');
        if (src) {
            preview.style.backgroundImage = `url('${src}')`;
            preview.innerHTML = '';
        } else {
            preview.style.backgroundImage = '';
            preview.innerHTML = '<span class="text-[10px] font-bold text-lux-navy/20">No image</span>';
        }
    }

    document.getElementById('facility-image-link').addEventListener('input', (e) => {
        if (currentImageSource === 'url') updatePreview(e.target.value.trim());
    });

    document.getElementById('facility-image-file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                base64Image = event.target.result;
                updatePreview(base64Image);
            };
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('facility-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentResortId) await loadResort();

        const formData = new FormData(e.target);
        const data = {
            resort_id: currentResortId,
            name: formData.get('name'),
            type: formData.get('type'),
            status: formData.get('status'),
            base_price: formData.get('base_price'),
            description: formData.get('description'),
            images_link: currentImageSource === 'url' ? formData.get('images_link') : base64Image
        };

        if (!data.images_link) delete data.images_link;

        let res;
        if (editingId) {
            res = await api.put(`/facilities/${editingId}`, data);
        } else {
            res = await api.post('/facilities', data);
        }

        if (res.success) {
            showToast(editingId ? 'Asset updated successfully.' : 'New asset registered.', 'success');
            closeModal();
            await loadFacilities();
        } else {
            showToast(res.message || 'Action failed.', 'error');
        }
    });

    // --- Init ---
    async function init() {
        await loadResort();
        await loadFacilities();
    }
    init();
  </script>
</body>
</html>
