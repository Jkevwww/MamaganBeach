<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asset Management | Mamagan Beach Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-lux-cream font-sans text-lux-navy">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-80 bg-white border-r border-lux-navy/5 flex-shrink-0 hidden md:flex flex-col relative z-20">
      <div class="p-10 border-b border-lux-navy/5">
        <a href="/" class="flex items-center gap-4 group">
          <img src="/images/logos/LOGO.png" alt="Mamagan" class="h-12 group-hover:scale-110 transition-transform">
          <div class="flex flex-col">
            <span class="luxury-heading font-bold text-xl leading-none">Mamagan</span>
            <span class="text-[8px] font-black uppercase tracking-[0.4em] text-lux-gold mt-1">Beach Resort</span>
          </div>
        </a>
      </div>
      <nav id="admin-nav" class="flex-1 p-6 space-y-2"></nav>
      <div class="p-8 border-t border-lux-navy/5">
        <button id="logout-btn" title="Sign Out" aria-label="Sign Out" class="w-full flex items-center gap-4 px-6 py-4 text-red-600 hover:bg-red-50 rounded-2xl transition-all group">
          <i class="fas fa-sign-out-alt w-5 text-center group-hover:-translate-x-1 transition-transform"></i>
          <span class="text-[10px] font-black uppercase tracking-widest">Terminate Session</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto bg-lux-cream/50">
      <header class="bg-white/80 backdrop-blur-xl border-b border-lux-navy/5 px-10 py-6 flex justify-between items-center sticky top-0 z-10">
        <div>
          <h1 class="luxury-heading text-2xl font-bold text-lux-navy">Asset Management</h1>
          <p class="text-[10px] font-bold text-lux-navy/30 uppercase tracking-[0.2em]">Manage resort facilities and inventory</p>
        </div>
        <div class="flex items-center gap-8">
          <button onclick="openModal('facility-modal')" class="px-8 py-3 bg-lux-navy text-white text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-lux-gold transition-all shadow-xl">
            <i class="fas fa-plus mr-2"></i>Register New Asset
          </button>
          <div id="auth-nav" class="flex items-center gap-3"></div>
        </div>
      </header>

      <main class="p-10 page-transition">
        <div id="facilities-container" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-8">
          <!-- Facilities will be injected here -->
        </div>
      </main>
    </div>
  </div>

  <!-- Facility Modal -->
  <div id="facility-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6">
    <div class="absolute inset-0 bg-lux-navy/40 backdrop-blur-sm" onclick="closeModal('facility-modal')"></div>
    <div class="relative bg-white rounded-[3rem] w-full max-w-2xl overflow-hidden shadow-2xl fade-in">
        <div class="p-10 border-b border-lux-navy/5 flex justify-between items-center">
            <h3 class="luxury-heading text-2xl font-bold">Asset Registration</h3>
            <button onclick="closeModal('facility-modal')" title="Close modal" aria-label="Close modal" class="text-lux-navy/20 hover:text-lux-navy transition-colors"><i class="fas fa-times"></i></button>
        </div>
        <form id="facility-form" class="p-10 space-y-6">
            <div class="grid md:grid-cols-2 gap-6">
                <div class="space-y-1">
                    <label for="facility-name" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Asset Name</label>
                    <input type="text" id="facility-name" name="name" required class="premium-input bg-lux-navy/5 border-transparent focus:bg-white" placeholder="e.g. Royal Cabana">
                </div>
                <div class="space-y-1">
                    <label for="facility-type" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Asset Type</label>
                    <select id="facility-type" name="type" required title="Select asset type" aria-label="Asset type" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white">
                        <option value="cabana">Cabana</option>
                        <option value="day_bed">Day Bed</option>
                        <option value="jet_ski">Jet Ski</option>
                        <option value="island_tour">Island Tour</option>
                    </select>
                </div>
            </div>

            <div class="space-y-1">
                <label for="facility-description" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Description</label>
                <textarea id="facility-description" name="description" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white h-24" placeholder="Describe the premium features..."></textarea>
            </div>

            <div class="space-y-4">
              <div class="grid md:grid-cols-2 gap-6">
                <div class="space-y-1">
                  <label for="facility-image-link" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Image URL (optional)</label>
                  <input type="url" id="facility-image-link" name="images_link" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white" placeholder="https://...">
                </div>
                <div class="space-y-1">
                  <label for="facility-image-file" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Upload Image (optional)</label>
                  <input type="file" id="facility-image-file" name="image_file" accept="image/*" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white">
                </div>
              </div>

              <div class="flex items-center gap-4">
                <span class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30">Preview</span>
                <div id="facility-image-preview" class="w-20 h-20 rounded-2xl bg-lux-navy/5 border border-lux-navy/10 overflow-hidden flex items-center justify-center">
                  <span class="text-[10px] font-bold text-lux-navy/20">No image</span>
                </div>
              </div>
            </div>
            <div class="grid md:grid-cols-3 gap-6">
                <div class="space-y-1">
                    <label for="facility-price" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Base Rate (PHP)</label>
                    <input type="number" id="facility-price" name="base_price" required title="Base Rate" placeholder="Enter base price" aria-label="Base Rate" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white">
                </div>
                <div class="space-y-1">
                    <label for="facility-capacity" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Max Capacity</label>
                    <input type="number" id="facility-capacity" name="capacity" required title="Max Capacity" placeholder="Enter max capacity" aria-label="Max Capacity" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white">
                </div>
                <div class="space-y-1">
                    <label for="facility-units" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Total Units</label>
                    <input type="number" id="facility-units" name="total_units" required class="premium-input bg-lux-navy/5 border-transparent focus:bg-white" placeholder="0">
                </div>
            </div>
            <button type="submit" class="premium-button-gold w-full flex items-center justify-center gap-4 group">
                <span>Synchronize Asset</span>
                <i class="fas fa-sync-alt group-hover:rotate-180 transition-transform"></i>
            </button>
        </form>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/admin.js?v=2"></script>
  <script>
    if (!requireAdmin()) throw new Error('Admin required');
    renderAdminNav('facilities');

    let currentResortId = null;
    let editingFacilityId = null;

    async function loadResort() {
      const res = await api.get('/resorts');
      if (res.success && res.data.length > 0) {
        currentResortId = res.data[0].id;
      }
    }

    async function loadFacilities() {
      const res = await api.get('/facilities');
      const container = document.getElementById('facilities-container');
      if (!res.success) { 
        showToast('Synchronization failed. Backend link inactive.', 'error'); 
        container.innerHTML = '<div class="col-span-full text-center py-20 text-lux-navy/20 font-black uppercase tracking-[0.5em]">System Offline</div>';
        return; 
      }
      
      if (res.data.length === 0) {
        container.innerHTML = '<div class="col-span-full text-center py-20 text-lux-navy/20 font-black uppercase tracking-[0.5em]">No Assets Registered</div>';
        return;
      }

      container.innerHTML = res.data.map(f => `
        <div class="bg-white rounded-[2.5rem] overflow-hidden premium-shadow border border-lux-navy/5 card-hover group">
          <div class="h-48 bg-cover bg-center transition-transform duration-700 group-hover:scale-110 relative" style="background-image: url('${f.images?.[0] || 'https://images.unsplash.com/photo-1544644181-1484b3fdfc62?w=600'}')">
            <div class="absolute top-6 left-6">
                <span class="px-4 py-1.5 bg-white/90 backdrop-blur text-lux-navy text-[8px] font-black uppercase tracking-[0.2em] rounded-full">${f.type.replace('_',' ')}</span>
            </div>
            ${!f.is_active ? '<div class="absolute inset-0 bg-lux-navy/60 flex items-center justify-center"><span class="text-white text-[10px] font-black uppercase tracking-widest border border-white/20 px-4 py-2 rounded-full">Inactive</span></div>' : ''}
          </div>
          <div class="p-8">
            <div class="flex justify-between items-start mb-4">
              <h3 class="luxury-heading font-bold text-xl text-lux-navy">${f.name}</h3>
              <div class="flex gap-2">
                <button onclick="editFacility('${f.id}')" class="w-8 h-8 rounded-full bg-lux-cream/50 flex items-center justify-center text-lux-navy/20 hover:text-lux-gold hover:bg-lux-navy transition-all"><i class="fas fa-edit text-xs"></i></button>
                <button onclick="deleteFacility('${f.id}')" class="w-8 h-8 rounded-full bg-lux-cream/50 flex items-center justify-center text-lux-navy/20 hover:text-red-500 hover:bg-red-50 transition-all"><i class="fas fa-trash text-xs"></i></button>
              </div>
            </div>
            <div class="flex justify-between items-end">
              <div>
                <span class="text-[8px] font-black uppercase tracking-widest text-lux-navy/30 block mb-1">Inflow per Slot</span>
                <span class="text-2xl font-black text-lux-navy">PHP ${Number(f.base_price).toLocaleString()}</span>
              </div>
              <div class="text-right">
                <span class="text-[8px] font-black uppercase tracking-widest text-lux-navy/30 block mb-1">Inventory</span>
                <span class="text-xs font-bold text-lux-gold">${f.total_units} Managed Units</span>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function editFacility(id) {
      const res = await api.get(`/facilities/${id}`);
      if (!res.success) return showToast('Unable to retrieve asset details.', 'error');
      
      const f = res.data;
      editingFacilityId = f.id;
      const form = document.getElementById('facility-form');
      form.elements['name'].value = f.name;
      form.elements['type'].value = f.type;
      form.elements['description'].value = f.description || '';
      form.elements['base_price'].value = f.base_price;
      form.elements['capacity'].value = f.capacity;
      form.elements['total_units'].value = f.total_units;

      // Image preview + link (if present)
      const preview = document.getElementById('facility-image-preview');
      const imageLinkInput = document.getElementById('facility-image-link');
      preview.innerHTML = '';
      const firstImg = (Array.isArray(f.images) && f.images.length) ? f.images[0] : null;
      if (firstImg) {
        preview.style.backgroundImage = `url('${firstImg}')`;
        preview.style.backgroundSize = 'cover';
        preview.style.backgroundPosition = 'center';
        preview.innerHTML = '';
        imageLinkInput.value = firstImg;
      } else {
        preview.style.backgroundImage = '';
        preview.style.backgroundSize = '';
        preview.style.backgroundPosition = '';
        preview.innerHTML = '<span class="text-[10px] font-bold text-lux-navy/20">No image</span>';
        imageLinkInput.value = '';
      }

      document.querySelector('#facility-modal h3').textContent = 'Asset Modification';
      openModal('facility-modal');
    }

    async function deleteFacility(id) {
      if (!confirm('Are you sure you want to decommission this asset? This action is irreversible if no dependencies exist.')) return;
      const res = await api.delete(`/facilities/${id}`);
      if (res.success) {
        showToast('Asset decommissioned successfully.', 'success');
        loadFacilities();
      } else {
        showToast(res.message || 'Decommissioning failed.', 'error');
      }
    }

    // Image preview logic (link + local file)
    const imageLinkInput = document.getElementById('facility-image-link');
    const imageFileInput = document.getElementById('facility-image-file');


    function setPreviewFromLink(link) {
      const preview = document.getElementById('facility-image-preview');
      preview.innerHTML = '';
      if (link) {
        preview.style.backgroundImage = `url('${link}')`;
        preview.style.backgroundSize = 'cover';
        preview.style.backgroundPosition = 'center';
        preview.innerHTML = '';
      } else {
        preview.style.backgroundImage = '';
        preview.style.backgroundSize = '';
        preview.style.backgroundPosition = '';
        preview.innerHTML = '<span class="text-[10px] font-bold text-lux-navy/20">No image</span>';
      }
    }

    if (imageLinkInput) {
      imageLinkInput.addEventListener('input', () => {
        // If user is uploading a file, prefer file preview.
        if (imageFileInput && imageFileInput.files && imageFileInput.files.length > 0) return;
        setPreviewFromLink(imageLinkInput.value.trim());
      });
    }

    if (imageFileInput) {
      imageFileInput.addEventListener('change', () => {
        const preview = document.getElementById('facility-image-preview');
        preview.innerHTML = '';
        const file = imageFileInput.files && imageFileInput.files[0];
        if (!file) {
          setPreviewFromLink(imageLinkInput ? imageLinkInput.value.trim() : '');
          return;
        }
        const url = URL.createObjectURL(file);
        preview.style.backgroundImage = `url('${url}')`;
        preview.style.backgroundSize = 'cover';
        preview.style.backgroundPosition = 'center';
      });
    }

    document.getElementById('facility-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!currentResortId) await loadResort();

      const form = e.target;
      const hasFile = !!(imageFileInput && imageFileInput.files && imageFileInput.files.length > 0);
      const linkVal = imageLinkInput ? imageLinkInput.value.trim() : '';

      let res;

      if (hasFile) {
        // multipart upload (local file)
        const fd = new FormData(form);
        fd.set('resort_id', currentResortId);
        if (!linkVal) fd.delete('images_link');
        // api.js is JSON-only, so use fetch directly
        const endpoint = editingFacilityId ? `/api/facilities/${editingFacilityId}` : '/api/facilities';
        const token = localStorage.getItem('token');
        const headers = token ? { Authorization: `Bearer ${token}` } : {};

        res = await fetch(endpoint, {
          method: editingFacilityId ? 'PUT' : 'POST',
          headers,
          body: fd,
        }).then(r => r.json().catch(() => ({})));
      } else {
        // JSON submit (link only)
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        data.resort_id = currentResortId;
        if (!linkVal) delete data.images_link;
        if (editingFacilityId) {
          res = await api.put(`/facilities/${editingFacilityId}`, data);
        } else {
          res = await api.post('/facilities', data);
        }
      }

      if (res.success) {
        showToast(editingFacilityId ? 'Asset synchronized successfully.' : 'New asset registered.', 'success');
        closeModal('facility-modal');
        e.target.reset();
        editingFacilityId = null;
        document.querySelector('#facility-modal h3').textContent = 'Asset Registration';
        loadFacilities();
      } else {
        showToast(res.message || 'Synchronization failure.', 'error');
      }
    });

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { 
        document.getElementById(id).classList.add('hidden');
        if (id === 'facility-modal') {
            editingFacilityId = null;
            document.getElementById('facility-form').reset();
            document.querySelector('#facility-modal h3').textContent = 'Asset Registration';

            // reset preview
            const preview = document.getElementById('facility-image-preview');
            if (preview) {
              preview.style.backgroundImage = '';
              preview.style.backgroundSize = '';
              preview.style.backgroundPosition = '';
              preview.innerHTML = '<span class="text-[10px] font-bold text-lux-navy/20">No image</span>';
            }
        }
    }

    async function init() {
      await loadResort();
      await loadFacilities();
    }

    init();
  </script>
</body>
</html>
