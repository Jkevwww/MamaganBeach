<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facilities | Mamagan Beach Resort Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .tab-btn { border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab-btn.active { border-bottom-color: #c5a059; color: #00234b; font-weight: 600; }
    .tab-btn:not(.active) { color: #6b7280; }
    .tab-btn:not(.active):hover { color: #374151; border-bottom-color: #d1d5db; }

    .category-badge-cottage { background-color: #fef3c7; color: #92400e; }
    .category-badge-cabana { background-color: #ccfbf1; color: #134e4a; }
    .category-badge-beach_equipment { background-color: #cffafe; color: #164e63; }

    .modal-backdrop { position: fixed; inset: 0; background-color: rgba(0,35,75,0.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal-box { background: white; border-radius: 1rem; width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 60px rgba(0,0,0,0.2); }

    .facility-card { transition: transform 0.2s, box-shadow 0.2s; }
    .facility-card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.1); }

    .toggle-switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
    .toggle-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .toggle-slider { width: 2.5rem; height: 1.25rem; background: #d1d5db; border-radius: 9999px; transition: background 0.2s; position: relative; }
    .toggle-slider::after { content: ''; position: absolute; top: 2px; left: 2px; width: 1rem; height: 1rem; background: white; border-radius: 9999px; transition: transform 0.2s; }
    .toggle-switch input:checked + .toggle-slider { background: #059669; }
    .toggle-switch input:checked + .toggle-slider::after { transform: translateX(1.25rem); }

    .skeleton { background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 0.5rem; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex-shrink-0 hidden md:flex flex-col">
      <div class="p-6 border-b border-gray-200">
        <a href="/" class="flex items-center gap-3 group">
          <img src="/images/logos/LOGO.png" alt="Logo" class="h-10 group-hover:scale-105 transition-transform">
          <div class="flex flex-col">
            <span class="font-heading font-bold text-lg leading-tight text-gray-900">Mamagan</span>
            <span class="text-[10px] font-bold uppercase tracking-wider text-primary-600">Admin Panel</span>
          </div>
        </a>
      </div>
      <nav id="admin-nav" class="flex-1 p-4 space-y-1 overflow-y-auto"></nav>
      <div class="p-4 border-t border-gray-200">
        <button id="logout-btn" class="w-full flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg transition-all">
          <i class="fas fa-sign-out-alt w-5 text-center"></i>
          <span class="text-sm font-medium">Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto bg-gray-50">

      <!-- Header -->
      <header class="bg-white border-b border-gray-200 px-8 py-5 flex justify-between items-center sticky top-0 z-10">
        <div>
          <h1 class="font-heading text-2xl font-bold text-gray-900">Facilities</h1>
          <p class="text-xs text-gray-500 mt-1">Manage resort facilities, pricing and availability</p>
        </div>
        <button onclick="openAddModal()" class="btn-primary flex items-center gap-2 px-4 py-2 text-sm">
          <i class="fas fa-plus"></i>
          Add Facility
        </button>
      </header>

      <main class="p-6 space-y-5">

        <!-- Category Tabs -->
        <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
          <div class="flex border-b border-gray-200 px-2 pt-2 gap-1 overflow-x-auto">
            <button class="tab-btn active px-5 py-3 text-sm whitespace-nowrap" data-category="" onclick="switchTab(this, '')">
              <i class="fas fa-th-large mr-2 text-gray-400"></i>All
            </button>
            <button class="tab-btn px-5 py-3 text-sm whitespace-nowrap" data-category="cottage" onclick="switchTab(this, 'cottage')">
              <i class="fas fa-home mr-2 text-amber-400"></i>Cottages
            </button>
            <button class="tab-btn px-5 py-3 text-sm whitespace-nowrap" data-category="cabana" onclick="switchTab(this, 'cabana')">
              <i class="fas fa-building mr-2 text-teal-400"></i>Cabanas
            </button>
            <button class="tab-btn px-5 py-3 text-sm whitespace-nowrap" data-category="beach_equipment" onclick="switchTab(this, 'beach_equipment')">
              <i class="fas fa-water mr-2 text-cyan-400"></i>Beach Equipment
            </button>
          </div>

          <!-- Cards Grid -->
          <div class="p-6">
            <div id="facilities-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
              <!-- Skeleton loaders -->
              <div class="skeleton h-56 rounded-xl"></div>
              <div class="skeleton h-56 rounded-xl"></div>
              <div class="skeleton h-56 rounded-xl"></div>
            </div>
            <div id="empty-state" class="hidden text-center py-16">
              <i class="fas fa-layer-group text-4xl text-gray-300 mb-3"></i>
              <p class="text-gray-500 font-medium">No facilities found</p>
              <p class="text-gray-400 text-sm mt-1">Add a facility to get started.</p>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Add / Edit Modal -->
  <div id="facility-modal" class="modal-backdrop hidden" onclick="handleBackdropClick(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between p-6 border-b border-gray-100">
        <h2 id="modal-title" class="font-heading text-xl font-bold text-gray-900">Add Facility</h2>
        <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition-colors">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <form id="facility-form" onsubmit="handleSubmit(event)" class="p-6 space-y-5">
        <input type="hidden" id="f-id">

        <!-- Name & Category -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="form-label">Facility Name <span class="text-red-500">*</span></label>
            <input id="f-name" type="text" class="form-input" placeholder="e.g. Beachfront Cottage A" required>
          </div>
          <div>
            <label class="form-label">Category <span class="text-red-500">*</span></label>
            <select id="f-category" class="form-input" aria-label="Category" required>
              <option value="" disabled selected>Select category</option>
              <option value="cottage">Cottage</option>
              <option value="cabana">Cabana</option>
              <option value="beach_equipment">Beach Equipment</option>
            </select>
          </div>
        </div>

        <!-- Units & Price -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="form-label">Total Units <span class="text-red-500">*</span></label>
            <input id="f-total-units" type="number" min="1" class="form-input" placeholder="e.g. 5" required>
          </div>
          <div>
            <label class="form-label">Base Price (₱) <span class="text-red-500">*</span></label>
            <input id="f-base-price" type="number" min="0" step="0.01" class="form-input" placeholder="e.g. 2500.00" required>
          </div>
        </div>

        <!-- Capacity -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="form-label">Min Capacity <span class="text-red-500">*</span></label>
            <input id="f-capacity-min" type="number" min="1" class="form-input" placeholder="e.g. 1" required>
          </div>
          <div>
            <label class="form-label">Max Capacity <span class="text-red-500">*</span></label>
            <input id="f-capacity-max" type="number" min="1" class="form-input" placeholder="e.g. 8" required>
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="form-label">Description</label>
          <textarea id="f-description" rows="3" class="form-input resize-none" placeholder="Describe the facility, its amenities and features..."></textarea>
        </div>

        <!-- Images Link -->
        <div>
          <label class="form-label">Images URL</label>
          <input id="f-images-link" type="url" class="form-input" placeholder="https://example.com/images/facility">
          <p class="text-xs text-gray-400 mt-1">Link to the facility image or image gallery.</p>
        </div>

        <!-- Unavailable Reason -->
        <div>
          <label class="form-label">Unavailable Reason</label>
          <input id="f-unavailable-reason" type="text" class="form-input" placeholder="e.g. Under renovation until June 2026">
          <p class="text-xs text-gray-400 mt-1">Shown to guests when the facility is unavailable. Leave blank if not applicable.</p>
        </div>

        <!-- Checkboxes -->
        <div class="bg-gray-50 rounded-xl p-4 space-y-3">
          <p class="text-sm font-semibold text-gray-700 mb-2">Settings</p>
          <label class="flex items-center gap-3 cursor-pointer">
            <input id="f-bookable" type="checkbox" class="w-4 h-4 accent-primary-600 rounded" checked>
            <span class="text-sm text-gray-700">Bookable by guests</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer">
            <input id="f-restricted-peak" type="checkbox" class="w-4 h-4 accent-primary-600 rounded">
            <span class="text-sm text-gray-700">Restricted during peak hours</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer">
            <input id="f-is-active" type="checkbox" class="w-4 h-4 accent-primary-600 rounded" checked>
            <span class="text-sm text-gray-700">Active (visible to guests)</span>
          </label>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="btn-outline text-sm px-5 py-2">Cancel</button>
          <button type="submit" id="submit-btn" class="btn-primary text-sm px-6 py-2 flex items-center gap-2">
            <i class="fas fa-save"></i>
            <span id="submit-label">Save Facility</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/admin.js?v=2"></script>
  <script>
    /* ─── Auth Guard ──────────────────────────────────────────────── */
    (function () {
      const token = localStorage.getItem('token');
      let user = null;
      try { user = JSON.parse(localStorage.getItem('user')); } catch (_) {}
      if (!token || !user || user.role !== 'admin') {
        window.location.href = '/login.html';
      }
    })();

    /* ─── State ───────────────────────────────────────────────────── */
    let currentCategory = '';
    let editingId = null;

    /* ─── Category helpers ───────────────────────────────────────── */
    const CATEGORY_META = {
      cottage: { label: 'Cottage', icon: 'fa-home', badgeClass: 'category-badge-cottage', iconColor: 'text-amber-500' },
      cabana: { label: 'Cabana', icon: 'fa-building', badgeClass: 'category-badge-cabana', iconColor: 'text-teal-500' },
      beach_equipment: { label: 'Beach Equipment', icon: 'fa-water', badgeClass: 'category-badge-beach_equipment', iconColor: 'text-cyan-500' },
    };

    function getCategoryMeta(cat) {
      return CATEGORY_META[cat] || { label: cat, icon: 'fa-layer-group', badgeClass: 'bg-gray-100 text-gray-700', iconColor: 'text-gray-400' };
    }

    /* ─── Init ────────────────────────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof renderAdminNav === 'function') renderAdminNav('facilities');
      if (typeof requireAdmin === 'function') requireAdmin();

      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          window.location.href = '/login.html';
        });
      }

      loadFacilities();
    });

    /* ─── Tab Switching ───────────────────────────────────────────── */
    function switchTab(btn, category) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = category;
      loadFacilities();
    }

    /* ─── Load Facilities ─────────────────────────────────────────── */
    async function loadFacilities() {
      const grid = document.getElementById('facilities-grid');
      const empty = document.getElementById('empty-state');

      grid.innerHTML = `
        <div class="skeleton h-56 rounded-xl"></div>
        <div class="skeleton h-56 rounded-xl"></div>
        <div class="skeleton h-56 rounded-xl"></div>
      `;
      empty.classList.add('hidden');

      try {
        const query = currentCategory ? `?category=${encodeURIComponent(currentCategory)}` : '';
        const data = await api.get(`/admin/facilities${query}`);
        const facilities = Array.isArray(data) ? data : (data.facilities || data.data || []);

        grid.innerHTML = '';

        if (!facilities.length) {
          empty.classList.remove('hidden');
          return;
        }

        facilities.forEach(f => {
          grid.insertAdjacentHTML('beforeend', buildCard(f));
        });
      } catch (err) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        showToast(err.message || 'Failed to load facilities.', 'error');
      }
    }

    /* ─── Build Card HTML ─────────────────────────────────────────── */
    function buildCard(f) {
      const meta = getCategoryMeta(f.category);
      const price = Number(f.base_price).toLocaleString('en-PH', { style: 'currency', currency: 'PHP' });
      const capacityStr = f.capacity_min === f.capacity_max
        ? `${f.capacity_max} pax`
        : `${f.capacity_min}–${f.capacity_max} pax`;

      const activeBadge = f.is_active
        ? `<span class="inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded-full bg-green-100 text-green-700"><span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span>Active</span>`
        : `<span class="inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded-full bg-red-100 text-red-600"><span class="w-1.5 h-1.5 bg-red-500 rounded-full"></span>Inactive</span>`;

      const bookableBadge = f.bookable
        ? `<span class="text-xs font-medium px-2 py-0.5 rounded-full bg-blue-50 text-blue-600">Bookable</span>`
        : `<span class="text-xs font-medium px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">Not Bookable</span>`;

      const peakBadge = f.restricted_during_peak_hours
        ? `<span class="text-xs font-medium px-2 py-0.5 rounded-full bg-orange-50 text-orange-600">Peak Restricted</span>`
        : '';

      const description = f.description
        ? `<p class="text-xs text-gray-500 line-clamp-2 mt-1">${escHtml(f.description)}</p>`
        : '';

      return `
        <div class="facility-card bg-white border border-gray-200 rounded-xl overflow-hidden">
          <div class="px-5 py-4 border-b border-gray-100 flex items-start justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 rounded-lg ${meta.badgeClass} flex items-center justify-center flex-shrink-0">
                <i class="fas ${meta.icon} ${meta.iconColor} text-sm"></i>
              </div>
              <div class="min-w-0">
                <h3 class="font-semibold text-gray-900 text-sm truncate">${escHtml(f.name)}</h3>
                <span class="text-xs font-medium px-2 py-0.5 rounded-full ${meta.badgeClass}">${meta.label}</span>
              </div>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              ${activeBadge}
            </div>
          </div>

          <div class="px-5 py-4 space-y-3">
            ${description}

            <div class="grid grid-cols-3 gap-2 text-center">
              <div class="bg-gray-50 rounded-lg py-2 px-1">
                <p class="text-[10px] text-gray-400 uppercase tracking-wide font-semibold">Price</p>
                <p class="text-sm font-bold text-gray-800 mt-0.5">${price}</p>
              </div>
              <div class="bg-gray-50 rounded-lg py-2 px-1">
                <p class="text-[10px] text-gray-400 uppercase tracking-wide font-semibold">Units</p>
                <p class="text-sm font-bold text-gray-800 mt-0.5">${f.total_units ?? '—'}</p>
              </div>
              <div class="bg-gray-50 rounded-lg py-2 px-1">
                <p class="text-[10px] text-gray-400 uppercase tracking-wide font-semibold">Capacity</p>
                <p class="text-sm font-bold text-gray-800 mt-0.5">${capacityStr}</p>
              </div>
            </div>

            <div class="flex flex-wrap gap-1.5">
              ${bookableBadge}
              ${peakBadge}
            </div>
          </div>

          <div class="px-5 py-3 border-t border-gray-100 flex items-center justify-between gap-2">
            <button onclick="openEditModal(${f.id})" class="flex items-center gap-1.5 text-xs font-medium text-primary-600 hover:text-primary-800 hover:bg-primary-50 px-3 py-1.5 rounded-lg transition-colors">
              <i class="fas fa-pen"></i> Edit
            </button>
            <button onclick="toggleActive(${f.id}, ${!f.is_active})"
              class="flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg transition-colors ${f.is_active ? 'text-red-600 hover:bg-red-50' : 'text-green-700 hover:bg-green-50'}">
              <i class="fas ${f.is_active ? 'fa-toggle-off' : 'fa-toggle-on'}"></i>
              ${f.is_active ? 'Deactivate' : 'Activate'}
            </button>
          </div>
        </div>
      `;
    }

    /* ─── Open Add Modal ──────────────────────────────────────────── */
    function openAddModal() {
      editingId = null;
      document.getElementById('modal-title').textContent = 'Add Facility';
      document.getElementById('submit-label').textContent = 'Save Facility';
      document.getElementById('facility-form').reset();
      document.getElementById('f-bookable').checked = true;
      document.getElementById('f-is-active').checked = true;
      document.getElementById('f-restricted-peak').checked = false;
      document.getElementById('facility-modal').classList.remove('hidden');
    }

    /* ─── Open Edit Modal ─────────────────────────────────────────── */
    async function openEditModal(id) {
      editingId = id;
      document.getElementById('modal-title').textContent = 'Edit Facility';
      document.getElementById('submit-label').textContent = 'Update Facility';
      document.getElementById('facility-modal').classList.remove('hidden');

      try {
        const f = await api.get(`/admin/facilities/${id}`);
        document.getElementById('f-id').value = f.id;
        document.getElementById('f-name').value = f.name || '';
        document.getElementById('f-category').value = f.category || '';
        document.getElementById('f-total-units').value = f.total_units ?? '';
        document.getElementById('f-base-price').value = f.base_price ?? '';
        document.getElementById('f-capacity-min').value = f.capacity_min ?? '';
        document.getElementById('f-capacity-max').value = f.capacity_max ?? '';
        document.getElementById('f-description').value = f.description || '';
        document.getElementById('f-images-link').value = f.images_link || '';
        document.getElementById('f-unavailable-reason').value = f.unavailable_reason || '';
        document.getElementById('f-bookable').checked = !!f.bookable;
        document.getElementById('f-restricted-peak').checked = !!f.restricted_during_peak_hours;
        document.getElementById('f-is-active').checked = !!f.is_active;
      } catch (err) {
        closeModal();
        showToast(err.message || 'Failed to load facility details.', 'error');
      }
    }

    /* ─── Close Modal ─────────────────────────────────────────────── */
    function closeModal() {
      document.getElementById('facility-modal').classList.add('hidden');
      document.getElementById('facility-form').reset();
      editingId = null;
    }

    function handleBackdropClick(e) {
      if (e.target === document.getElementById('facility-modal')) {
        closeModal();
      }
    }

    /* ─── Form Submit ─────────────────────────────────────────────── */
    async function handleSubmit(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submit-btn');
      const submitLabel = document.getElementById('submit-label');
      const originalLabel = submitLabel.textContent;

      submitBtn.disabled = true;
      submitLabel.textContent = 'Saving...';

      const payload = {
        name: document.getElementById('f-name').value.trim(),
        category: document.getElementById('f-category').value,
        total_units: parseInt(document.getElementById('f-total-units').value, 10),
        base_price: parseFloat(document.getElementById('f-base-price').value),
        capacity_min: parseInt(document.getElementById('f-capacity-min').value, 10),
        capacity_max: parseInt(document.getElementById('f-capacity-max').value, 10),
        description: document.getElementById('f-description').value.trim(),
        images_link: document.getElementById('f-images-link').value.trim() || null,
        unavailable_reason: document.getElementById('f-unavailable-reason').value.trim() || null,
        bookable: document.getElementById('f-bookable').checked,
        restricted_during_peak_hours: document.getElementById('f-restricted-peak').checked,
        is_active: document.getElementById('f-is-active').checked,
      };

      // Basic validation
      if (payload.capacity_min > payload.capacity_max) {
        showToast('Min capacity cannot exceed max capacity.', 'error');
        submitBtn.disabled = false;
        submitLabel.textContent = originalLabel;
        return;
      }

      try {
        if (editingId) {
          await api.put(`/admin/facilities/${editingId}`, payload);
          showToast('Facility updated successfully.', 'success');
        } else {
          await api.post('/admin/facilities', payload);
          showToast('Facility created successfully.', 'success');
        }
        closeModal();
        loadFacilities();
      } catch (err) {
        showToast(err.message || 'Failed to save facility.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitLabel.textContent = originalLabel;
      }
    }

    /* ─── Toggle Active ───────────────────────────────────────────── */
    async function toggleActive(id, newState) {
      try {
        await api.put(`/admin/facilities/${id}`, { is_active: newState });
        showToast(`Facility ${newState ? 'activated' : 'deactivated'} successfully.`, 'success');
        loadFacilities();
      } catch (err) {
        showToast(err.message || 'Failed to update facility status.', 'error');
      }
    }

    /* ─── Utility ─────────────────────────────────────────────────── */
    function escHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
