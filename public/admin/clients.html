<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients | Mamagan Beach Resort Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Layout Wrapper -->
  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <nav id="admin-nav" class="w-64 bg-white shadow-lg flex flex-col flex-shrink-0">
      <!-- Sidebar content rendered by renderAdminNav() -->
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">

      <!-- Page Header -->
      <div class="bg-white border-b border-gray-200 px-8 py-6">
        <h1 class="text-2xl font-bold text-gray-900">Clients</h1>
        <p class="text-sm text-gray-500 mt-1">Manage registered guests and staff</p>
      </div>

      <div class="flex-1 overflow-auto p-8">

        <!-- Filter Bar -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-6">
          <div class="flex flex-wrap gap-3 items-end">

            <!-- Search Input -->
            <div class="flex-1 min-w-[200px]">
              <label class="block text-xs font-medium text-gray-600 mb-1">Search</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
                  <i class="fa fa-search text-sm"></i>
                </span>
                <input
                  id="filter-search"
                  type="text"
                  placeholder="Name or email..."
                  class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
            </div>

            <!-- Role Filter -->
            <div class="min-w-[140px]">
              <label class="block text-xs font-medium text-gray-600 mb-1">Role</label>
              <select id="filter-role" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All Roles</option>
                <option value="guest">Guest</option>
                <option value="staff">Staff</option>
                <option value="admin">Admin</option>
              </select>
            </div>

            <!-- Status Filter -->
            <div class="min-w-[140px]">
              <label class="block text-xs font-medium text-gray-600 mb-1">Status</label>
              <select id="filter-status" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">All Status</option>
                <option value="true">Active</option>
                <option value="false">Inactive</option>
              </select>
            </div>

            <!-- Buttons -->
            <div class="flex gap-2">
              <button id="btn-search" onclick="applyFilters()" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition">
                <i class="fa fa-search mr-1"></i> Search
              </button>
              <button id="btn-clear" onclick="clearFilters()" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-200 transition">
                <i class="fa fa-xmark mr-1"></i> Clear
              </button>
            </div>

            <!-- Result Count -->
            <div class="ml-auto flex items-end">
              <span id="result-count" class="text-sm text-gray-500"></span>
            </div>

          </div>
        </div>

        <!-- Users Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-100">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">User</th>
                  <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Phone</th>
                  <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Role</th>
                  <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Auth</th>
                  <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
                  <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Joined</th>
                  <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
              </thead>
              <tbody id="clients-table-body" class="divide-y divide-gray-100 bg-white">
                <tr id="table-loading">
                  <td colspan="7" class="px-5 py-12 text-center text-gray-400">
                    <i class="fa fa-spinner fa-spin text-2xl mb-2 block"></i>
                    Loading clients...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- ===================== CLIENT DETAIL MODAL ===================== -->
  <div id="client-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">

      <!-- Modal Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
        <h2 class="text-lg font-bold text-gray-900">Client Details</h2>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition">
          <i class="fa fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- Modal Body (scrollable) -->
      <div class="overflow-y-auto flex-1 px-6 py-5 space-y-6">

        <!-- User Info Section -->
        <div id="modal-user-info" class="flex items-start gap-4">
          <!-- Populated by JS -->
        </div>

        <!-- User Meta Grid -->
        <div id="modal-user-meta" class="grid grid-cols-2 gap-4 text-sm">
          <!-- Populated by JS -->
        </div>

        <!-- Booking History -->
        <div>
          <h3 class="text-sm font-semibold text-gray-700 mb-3">Booking History</h3>
          <div class="overflow-x-auto rounded-lg border border-gray-100">
            <table class="min-w-full divide-y divide-gray-100 text-sm">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Facility</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Date</th>
                  <th class="px-4 py-2 text-left text-xs font-semibold text-gray-500 uppercase">Status</th>
                  <th class="px-4 py-2 text-right text-xs font-semibold text-gray-500 uppercase">Amount</th>
                </tr>
              </thead>
              <tbody id="modal-bookings-body" class="divide-y divide-gray-50 bg-white">
                <tr>
                  <td colspan="4" class="px-4 py-6 text-center text-gray-400">
                    <i class="fa fa-spinner fa-spin mr-1"></i> Loading...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Action Panel -->
        <div id="modal-actions" class="space-y-4">
          <!-- Populated by JS -->
        </div>

      </div>
    </div>
  </div>
  <!-- =================== END MODAL =================== -->

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/admin.js?v=2"></script>

  <script>
    // ── Auth guard ──────────────────────────────────────────────────────────────
    requireAdmin();
    renderAdminNav('clients');

    // ── State ───────────────────────────────────────────────────────────────────
    let currentUser = null;
    let viewingClientId = null;

    try {
      currentUser = JSON.parse(localStorage.getItem('user') || 'null');
    } catch (e) {
      currentUser = null;
    }

    // ── Helpers ─────────────────────────────────────────────────────────────────
    function getInitials(name) {
      if (!name) return '?';
      return name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join('');
    }

    function avatarColor(name) {
      const colors = [
        'bg-blue-500', 'bg-green-500', 'bg-purple-500',
        'bg-pink-500', 'bg-yellow-500', 'bg-indigo-500', 'bg-teal-500'
      ];
      if (!name) return colors[0];
      let hash = 0;
      for (let c of name) hash = (hash * 31 + c.charCodeAt(0)) % colors.length;
      return colors[hash];
    }

    function roleBadge(role) {
      const map = {
        admin: 'bg-red-100 text-red-700',
        staff: 'bg-blue-100 text-blue-700',
        guest: 'bg-gray-100 text-gray-600'
      };
      const cls = map[role] || 'bg-gray-100 text-gray-600';
      return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${cls}">${capitalize(role || 'guest')}</span>`;
    }

    function statusBadge(is_active) {
      return is_active
        ? `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-700"><i class="fa fa-circle text-[8px] mr-1"></i>Active</span>`
        : `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-600"><i class="fa fa-circle text-[8px] mr-1"></i>Inactive</span>`;
    }

    function bookingStatusBadge(status) {
      const map = {
        confirmed: 'bg-green-100 text-green-700',
        pending:   'bg-yellow-100 text-yellow-700',
        cancelled: 'bg-red-100 text-red-600',
        completed: 'bg-blue-100 text-blue-700'
      };
      const cls = map[status] || 'bg-gray-100 text-gray-600';
      return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold ${cls}">${capitalize(status || '')}</span>`;
    }

    function authProviderIcon(provider) {
      if (provider === 'google')
        return `<span class="inline-flex items-center gap-1 text-xs text-red-500"><i class="fa-brands fa-google"></i> Google</span>`;
      if (provider === 'github')
        return `<span class="inline-flex items-center gap-1 text-xs text-gray-800"><i class="fa-brands fa-github"></i> GitHub</span>`;
      return `<span class="inline-flex items-center gap-1 text-xs text-gray-500"><i class="fa fa-lock"></i> Local</span>`;
    }

    function capitalize(s) {
      return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      try {
        return new Date(dateStr).toLocaleDateString('en-PH', {
          year: 'numeric', month: 'short', day: 'numeric'
        });
      } catch { return dateStr; }
    }

    function formatCurrency(amount) {
      if (amount == null) return '—';
      return new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' }).format(amount);
    }

    // ── Filter Logic ─────────────────────────────────────────────────────────────
    function getFilters() {
      return {
        search:    document.getElementById('filter-search').value.trim(),
        role:      document.getElementById('filter-role').value,
        is_active: document.getElementById('filter-status').value
      };
    }

    function applyFilters() {
      loadClients();
    }

    function clearFilters() {
      document.getElementById('filter-search').value = '';
      document.getElementById('filter-role').value = '';
      document.getElementById('filter-status').value = '';
      loadClients();
    }

    // Allow pressing Enter in search field
    document.getElementById('filter-search').addEventListener('keydown', e => {
      if (e.key === 'Enter') applyFilters();
    });

    // ── Load Clients ─────────────────────────────────────────────────────────────
    async function loadClients() {
      const tbody = document.getElementById('clients-table-body');
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="px-5 py-12 text-center text-gray-400">
            <i class="fa fa-spinner fa-spin text-2xl mb-2 block"></i>
            Loading clients...
          </td>
        </tr>`;
      document.getElementById('result-count').textContent = '';

      const { search, role, is_active } = getFilters();
      const params = new URLSearchParams();
      if (search)    params.set('search', search);
      if (role)      params.set('role', role);
      if (is_active !== '') params.set('is_active', is_active);

      const path = '/admin/clients' + (params.toString() ? '?' + params.toString() : '');

      try {
        const data = await api.get(path);
        const clients = Array.isArray(data) ? data : (data.clients || data.users || []);
        renderClients(clients);
      } catch (err) {
        console.error(err);
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="px-5 py-12 text-center text-red-400">
              <i class="fa fa-triangle-exclamation text-2xl mb-2 block"></i>
              Failed to load clients.
            </td>
          </tr>`;
        document.getElementById('result-count').textContent = '';
        showToast('Failed to load clients.', 'error');
      }
    }

    function renderClients(clients) {
      const tbody = document.getElementById('clients-table-body');
      document.getElementById('result-count').textContent =
        clients.length === 1 ? '1 client found' : `${clients.length} clients found`;

      if (!clients.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="px-5 py-12 text-center text-gray-400">
              <i class="fa fa-users-slash text-2xl mb-2 block"></i>
              No clients found.
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = clients.map(client => {
        const initials = getInitials(client.full_name || client.name);
        const color    = avatarColor(client.full_name || client.name);
        const avatarSrc = client.avatar_url || client.avatar || client.profile_picture || '';

        const avatarHTML = avatarSrc
          ? `<img src="${avatarSrc}" alt="${initials}" class="w-9 h-9 rounded-full object-cover">`
          : `<div class="w-9 h-9 rounded-full ${color} flex items-center justify-center text-white text-sm font-bold">${initials}</div>`;

        return `
          <tr class="hover:bg-gray-50 transition">
            <td class="px-5 py-3">
              <div class="flex items-center gap-3">
                ${avatarHTML}
                <div>
                  <div class="text-sm font-semibold text-gray-800">${client.full_name || client.name || '—'}</div>
                  <div class="text-xs text-gray-400">${client.email || '—'}</div>
                </div>
              </div>
            </td>
            <td class="px-5 py-3 text-sm text-gray-600">${client.phone || '—'}</td>
            <td class="px-5 py-3">${roleBadge(client.role)}</td>
            <td class="px-5 py-3">${authProviderIcon(client.auth_provider || client.provider)}</td>
            <td class="px-5 py-3">${statusBadge(client.is_active)}</td>
            <td class="px-5 py-3 text-sm text-gray-500 whitespace-nowrap">${formatDate(client.created_at || client.joined_at)}</td>
            <td class="px-5 py-3">
              <button
                onclick="openClientModal(${client.id})"
                class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-blue-600 bg-blue-50 rounded-lg hover:bg-blue-100 transition">
                <i class="fa fa-eye"></i> View
              </button>
            </td>
          </tr>`;
      }).join('');
    }

    // ── Client Detail Modal ───────────────────────────────────────────────────────
    async function openClientModal(clientId) {
      viewingClientId = clientId;
      const modal = document.getElementById('client-modal');

      // Reset modal content
      document.getElementById('modal-user-info').innerHTML = `
        <div class="text-gray-400 text-sm"><i class="fa fa-spinner fa-spin mr-1"></i> Loading...</div>`;
      document.getElementById('modal-user-meta').innerHTML = '';
      document.getElementById('modal-bookings-body').innerHTML = `
        <tr><td colspan="4" class="px-4 py-6 text-center text-gray-400"><i class="fa fa-spinner fa-spin mr-1"></i> Loading...</td></tr>`;
      document.getElementById('modal-actions').innerHTML = '';

      modal.classList.remove('hidden');
      modal.classList.add('flex');

      try {
        const data = await api.get(`/admin/clients/${clientId}`);
        const client   = data.client || data.user || data;
        const bookings = data.bookings || [];

        renderModalUserInfo(client);
        renderModalBookings(bookings);
        renderModalActions(client);
      } catch (err) {
        console.error(err);
        document.getElementById('modal-user-info').innerHTML = `
          <div class="text-red-400 text-sm"><i class="fa fa-triangle-exclamation mr-1"></i> Failed to load client details.</div>`;
        showToast('Failed to load client details.', 'error');
      }
    }

    function closeModal() {
      const modal = document.getElementById('client-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      viewingClientId = null;
    }

    // Close modal on backdrop click
    document.getElementById('client-modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    function renderModalUserInfo(client) {
      const initials = getInitials(client.full_name || client.name);
      const color    = avatarColor(client.full_name || client.name);
      const avatarSrc = client.avatar_url || client.avatar || client.profile_picture || '';

      const avatarHTML = avatarSrc
        ? `<img src="${avatarSrc}" alt="${initials}" class="w-16 h-16 rounded-full object-cover shadow">`
        : `<div class="w-16 h-16 rounded-full ${color} flex items-center justify-center text-white text-xl font-bold shadow">${initials}</div>`;

      document.getElementById('modal-user-info').innerHTML = `
        ${avatarHTML}
        <div>
          <div class="text-lg font-bold text-gray-900">${client.full_name || client.name || '—'}</div>
          <div class="text-sm text-gray-500">${client.email || '—'}</div>
          <div class="mt-1 flex items-center gap-2">
            ${roleBadge(client.role)}
            ${statusBadge(client.is_active)}
          </div>
        </div>`;

      document.getElementById('modal-user-meta').innerHTML = `
        <div class="bg-gray-50 rounded-lg p-3">
          <div class="text-xs text-gray-400 uppercase font-semibold mb-1">Phone</div>
          <div class="text-sm text-gray-700">${client.phone || '—'}</div>
        </div>
        <div class="bg-gray-50 rounded-lg p-3">
          <div class="text-xs text-gray-400 uppercase font-semibold mb-1">Auth Provider</div>
          <div>${authProviderIcon(client.auth_provider || client.provider)}</div>
        </div>
        <div class="bg-gray-50 rounded-lg p-3">
          <div class="text-xs text-gray-400 uppercase font-semibold mb-1">Joined</div>
          <div class="text-sm text-gray-700">${formatDate(client.created_at || client.joined_at)}</div>
        </div>
        <div class="bg-gray-50 rounded-lg p-3">
          <div class="text-xs text-gray-400 uppercase font-semibold mb-1">User ID</div>
          <div class="text-sm text-gray-700 font-mono">#${client.id}</div>
        </div>`;
    }

    function renderModalBookings(bookings) {
      const tbody = document.getElementById('modal-bookings-body');
      if (!bookings.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="px-4 py-6 text-center text-gray-400 text-sm">No bookings found.</td>
          </tr>`;
        return;
      }
      tbody.innerHTML = bookings.map(b => `
        <tr class="hover:bg-gray-50 transition">
          <td class="px-4 py-2 text-sm text-gray-700">${b.facility_name || b.facility || '—'}</td>
          <td class="px-4 py-2 text-sm text-gray-500 whitespace-nowrap">${formatDate(b.date || b.booking_date || b.check_in)}</td>
          <td class="px-4 py-2">${bookingStatusBadge(b.status)}</td>
          <td class="px-4 py-2 text-sm text-gray-700 text-right">${formatCurrency(b.amount || b.total_amount)}</td>
        </tr>`).join('');
    }

    function renderModalActions(client) {
      const actionsDiv = document.getElementById('modal-actions');
      const isSelf = currentUser && String(currentUser.id) === String(client.id);

      if (isSelf) {
        actionsDiv.innerHTML = `
          <div class="flex items-center gap-2 p-3 bg-yellow-50 border border-yellow-200 rounded-lg text-sm text-yellow-700">
            <i class="fa fa-triangle-exclamation"></i>
            You cannot modify your own account from here.
          </div>`;
        return;
      }

      const isActive = client.is_active;
      const currentRole = client.role || 'guest';

      actionsDiv.innerHTML = `
        <div class="flex flex-wrap gap-3">

          <!-- Enable / Disable Toggle -->
          <button
            id="modal-toggle-btn"
            onclick="toggleAccountStatus(${client.id}, ${!isActive})"
            class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-lg transition
              ${isActive
                ? 'bg-red-50 text-red-600 hover:bg-red-100'
                : 'bg-green-50 text-green-700 hover:bg-green-100'}">
            <i class="fa ${isActive ? 'fa-ban' : 'fa-circle-check'}"></i>
            ${isActive ? 'Disable Account' : 'Enable Account'}
          </button>

          <!-- Change Role -->
          <div class="flex items-center gap-2">
            <select
              id="modal-role-select"
              class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="guest"  ${currentRole === 'guest'  ? 'selected' : ''}>Guest</option>
              <option value="staff"  ${currentRole === 'staff'  ? 'selected' : ''}>Staff</option>
              <option value="admin"  ${currentRole === 'admin'  ? 'selected' : ''}>Admin</option>
            </select>
            <button
              onclick="changeRole(${client.id})"
              class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition">
              <i class="fa fa-floppy-disk"></i> Apply Role
            </button>
          </div>

        </div>`;
    }

    // ── API Actions ───────────────────────────────────────────────────────────────
    async function toggleAccountStatus(clientId, newStatus) {
      const btn = document.getElementById('modal-toggle-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa fa-spinner fa-spin"></i> Saving...`;
      }
      try {
        await api.patch(`/admin/clients/${clientId}`, { is_active: newStatus });
        showToast(`Account ${newStatus ? 'enabled' : 'disabled'} successfully.`, 'success');
        // Reload the modal with fresh data
        await openClientModal(clientId);
        // Refresh table in background
        loadClients();
      } catch (err) {
        console.error(err);
        showToast('Failed to update account status.', 'error');
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = newStatus
            ? `<i class="fa fa-circle-check"></i> Enable Account`
            : `<i class="fa fa-ban"></i> Disable Account`;
        }
      }
    }

    async function changeRole(clientId) {
      const select = document.getElementById('modal-role-select');
      const newRole = select ? select.value : null;
      if (!newRole) return;

      const applyBtn = select ? select.nextElementSibling : null;
      if (applyBtn) {
        applyBtn.disabled = true;
        applyBtn.innerHTML = `<i class="fa fa-spinner fa-spin"></i> Saving...`;
      }

      try {
        await api.patch(`/admin/clients/${clientId}`, { role: newRole });
        showToast(`Role changed to "${capitalize(newRole)}" successfully.`, 'success');
        await openClientModal(clientId);
        loadClients();
      } catch (err) {
        console.error(err);
        showToast('Failed to change role.', 'error');
        if (applyBtn) {
          applyBtn.disabled = false;
          applyBtn.innerHTML = `<i class="fa fa-floppy-disk"></i> Apply Role`;
        }
      }
    }

    // ── Init ─────────────────────────────────────────────────────────────────────
    loadClients();
  </script>
</body>
</html>
