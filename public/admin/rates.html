<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revenue Optimization | Mamagan Beach Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-lux-cream font-sans text-lux-navy">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-80 bg-white border-r border-lux-navy/5 flex-shrink-0 hidden md:flex flex-col relative z-20">
      <div class="p-10 border-b border-lux-navy/5">
        <a href="/" class="flex items-center gap-4 group">
          <img src="/images/logos/LOGO.png" alt="Mamagan Logo" class="h-12 group-hover:scale-110 transition-transform">
          <div class="flex flex-col">
            <span class="luxury-heading font-bold text-xl leading-none">Mamagan</span>
            <span class="text-[8px] font-black uppercase tracking-[0.4em] text-lux-gold mt-1">Beach Resort</span>
          </div>
        </a>
      </div>
      <nav id="admin-nav" class="flex-1 p-6 space-y-2"></nav>
      <div class="p-8 border-t border-lux-navy/5">
        <button id="logout-btn" title="Sign Out" aria-label="Sign Out" class="w-full flex items-center gap-4 px-6 py-4 text-red-600 hover:bg-red-50 rounded-2xl transition-all group">
          <i class="fas fa-sign-out-alt w-5 text-center group-hover:-translate-x-1 transition-transform"></i>
          <span class="text-[10px] font-black uppercase tracking-widest">Terminate Session</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto bg-lux-cream/50">
      <header class="bg-white/80 backdrop-blur-xl border-b border-lux-navy/5 px-10 py-6 flex justify-between items-center sticky top-0 z-10" style="-webkit-backdrop-filter: blur(24px);">
        <div>
          <h1 class="luxury-heading text-2xl font-bold text-lux-navy">Rates & Promos</h1>
          <p class="text-[10px] font-bold text-lux-navy/30 uppercase tracking-[0.2em]">Optimize yields and seasonal offerings</p>
        </div>
        <div class="flex items-center gap-8">
          <button onclick="openModal('promo-modal')" class="px-8 py-3 bg-lux-navy text-white text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-lux-gold transition-all shadow-xl" aria-label="Launch New Promo" title="Launch New Promo">
            <i class="fas fa-tag mr-2"></i>Launch New Promo
          </button>
          <div id="auth-nav" class="flex items-center gap-3"></div>
        </div>
      </header>

      <main class="p-10 page-transition">
        <div class="grid lg:grid-cols-3 gap-10">
            <div class="lg:col-span-2 space-y-8">
                <div class="bg-white rounded-[3rem] p-10 border border-lux-navy/5 premium-shadow">
                    <h3 class="luxury-heading text-xl font-bold mb-8">Active Campains</h3>
                    <div id="promos-list" class="space-y-6"></div>
                </div>
            </div>
            <div class="space-y-8">
                <div class="bg-lux-navy rounded-[3rem] p-10 text-white premium-shadow relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-48 h-48 bg-lux-gold/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
                    <h3 class="luxury-heading text-xl font-bold mb-6 relative z-10">Peak Pricing</h3>
                    <p class="text-[10px] font-bold text-white/40 uppercase tracking-widest mb-8 relative z-10">Global multipliers for high-demand windows</p>
                    <form class="space-y-6 relative z-10">
                        <div class="space-y-1">
                            <label for="weekend-mult" class="text-[8px] font-black uppercase tracking-widest text-white/30">Weekend Multiplier</label>
                            <input type="number" id="weekend-mult" step="0.1" value="1.2" class="premium-input bg-white/5 border-white/10 text-white focus:bg-white focus:text-lux-navy" title="Weekend Multiplier" aria-label="Weekend Multiplier">
                        </div>
                        <div class="space-y-1">
                            <label for="holiday-surge" class="text-[8px] font-black uppercase tracking-widest text-white/30">Holiday Surge</label>
                            <input type="number" id="holiday-surge" step="0.1" value="1.5" class="premium-input bg-white/5 border-white/10 text-white focus:bg-white focus:text-lux-navy" title="Holiday Surge" aria-label="Holiday Surge">
                        </div>
                        <button type="submit" class="w-full py-4 bg-lux-gold text-lux-navy text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-white transition-all">Apply Multipliers</button>
                    </form>
                </div>
            </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/admin.js?v=2"></script>
  <script>
    if (!requireAdmin()) throw new Error('Admin required');
    renderAdminNav('rates');
    async function loadPromos() {
      const container = document.getElementById('promos-list');
      container.innerHTML = `<div class="flex items-center justify-between p-6 bg-lux-cream/50 rounded-3xl border border-lux-navy/5">
            <div class="flex items-center gap-6">
                <div class="w-14 h-14 bg-lux-gold/10 rounded-2xl flex items-center justify-center text-lux-gold"><i class="fas fa-umbrella-beach text-xl"></i></div>
                <div>
                    <h4 class="font-bold text-lux-navy">Summer Solstice 2024</h4>
                    <p class="text-[8px] font-bold text-lux-navy/30 uppercase tracking-widest mt-1">CODE: SUMMER20 | 20% Discount</p>
                </div>
            </div>
            <div class="text-right">
                <span class="px-3 py-1 bg-green-500/10 text-green-600 text-[8px] font-black uppercase tracking-widest rounded-full border border-green-500/20">Active</span>
                <p class="text-[8px] font-bold text-lux-navy/20 uppercase tracking-widest mt-2">Expires June 30</p>
            </div>
        </div>`;
    }
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    loadPromos();
  </script>
</body>
</html>
