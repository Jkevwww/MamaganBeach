<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrival Verification | Mamagan Beach Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
  <style>
    #qr-reader video {
        object-fit: cover !important;
        border-radius: 2rem !important;
        width: 100% !important;
        height: 100% !important;
    }
    #qr-reader__scan_region {
        border: none !important;
        min-height: 300px !important;
    }
    #qr-reader__dashboard {
        display: none !important;
    }
    #qr-reader__camera_permission {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        height: 100% !important;
    }
    .scanner-active {
        border-color: #c5a059 !important;
        box-shadow: 0 0 40px rgba(197, 160, 89, 0.2);
    }
    .camera-error {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        height: 100% !important;
        text-align: center !important;
        padding: 2rem !important;
    }
    .camera-error i {
        font-size: 3rem !important;
        margin-bottom: 1rem !important;
        color: #ef4444 !important;
    }
    .camera-error p {
        color: #64748b !important;
        font-size: 0.875rem !important;
        line-height: 1.5 !important;
    }
  </style>
</head>
<body class="bg-lux-cream font-sans text-lux-navy">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-80 bg-white border-r border-lux-navy/5 flex-shrink-0 hidden md:flex flex-col relative z-20">
      <div class="p-10 border-b border-lux-navy/5">
        <a href="/" class="flex items-center gap-4 group" aria-label="Mamagan Beach Resort Home">
          <img src="/images/logos/LOGO.png" alt="Mamagan Logo" class="h-12 group-hover:scale-110 transition-transform">
          <div class="flex flex-col">
            <span class="luxury-heading font-bold text-xl leading-none">Mamagan</span>
            <span class="text-[8px] font-black uppercase tracking-[0.4em] text-lux-gold mt-1">Beach Resort</span>
          </div>
        </a>
      </div>
      <nav id="admin-nav" class="flex-1 p-6 space-y-2" aria-label="Admin Navigation"></nav>
      <div class="p-8 border-t border-lux-navy/5">
        <button id="logout-btn" title="Sign Out" aria-label="Sign Out" class="w-full flex items-center gap-4 px-6 py-4 text-red-600 hover:bg-red-50 rounded-2xl transition-all group">
          <i class="fas fa-sign-out-alt w-5 text-center group-hover:-translate-x-1 transition-transform" aria-hidden="true"></i>
          <span class="text-[10px] font-black uppercase tracking-widest">Terminate Session</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto bg-lux-cream/50">
      <header class="bg-white/80 backdrop-blur-xl border-b border-lux-navy/5 px-10 py-6 flex justify-between items-center sticky top-0 z-30">
        <div>
          <h1 class="luxury-heading text-2xl font-bold text-lux-navy">Arrival Verification</h1>
          <p class="text-[10px] font-bold text-lux-navy/30 uppercase tracking-[0.2em]">Validate guest admission passes</p>
        </div>
        <div id="auth-nav" class="flex items-center gap-3"></div>
      </header>

      <main class="p-10 page-transition">
        <div class="grid lg:grid-cols-2 gap-10 max-w-6xl mx-auto">
          <!-- Premium Scanner -->
          <div class="bg-white rounded-[3rem] p-10 border border-lux-navy/5 premium-shadow">
            <div class="flex justify-between items-center mb-8">
                <h3 class="luxury-heading text-xl font-bold">Digital QR Scan</h3>
                <div id="scanner-status" class="hidden flex items-center gap-2">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-lux-gold opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-lux-gold"></span>
                    </span>
                    <span class="text-[8px] font-black uppercase tracking-widest text-lux-gold">Optics Active</span>
                </div>
            </div>
            <div id="qr-reader" class="rounded-[2.5rem] overflow-hidden border-2 border-lux-navy/5 bg-lux-navy/5 aspect-square flex items-center justify-center transition-all duration-500">
                <div id="placeholder-icon" class="text-center">
                    <i class="fas fa-camera text-5xl text-lux-navy/10 mb-4 block"></i>
                    <p class="text-[10px] font-black uppercase tracking-widest text-lux-navy/20">Awaiting Optics Initialization</p>
                </div>
            </div>
            <!-- Permission & Device Status -->
            <div id="permission-status" class="mb-6 p-4 rounded-xl bg-blue-50 border border-blue-200 hidden">
              <div class="flex items-center gap-2">
                <i class="fas fa-info-circle text-blue-600"></i>
                <span class="text-xs font-medium text-blue-700">Camera permission required. Click "Allow" when prompted or enable in browser settings.</span>
              </div>
            </div>

            <!-- Camera Selection Dropdown -->
            <div class="mb-6 space-y-2">
              <label for="camera-select" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Camera Device</label>
              <select id="camera-select" aria-label="Select camera device" class="w-full px-4 py-3 rounded-xl border border-lux-navy/10 bg-white text-sm font-medium text-lux-navy focus:ring-2 focus:ring-lux-gold focus:border-transparent transition-all">
                <option value="">Detecting cameras...</option>
              </select>
            </div>

            <!-- Camera Controls Panel (Collapsible) -->
            <div class="mb-6 bg-lux-navy/5 rounded-2xl p-4 transition-all" id="camera-controls-panel">
              <button type="button" id="toggle-controls" class="w-full flex items-center justify-between text-sm font-bold text-lux-navy mb-3 hover:text-lux-gold transition-colors" aria-expanded="false">
                <span class="flex items-center gap-2"><i class="fas fa-sliders-h"></i> Advanced Controls</span>
                <i class="fas fa-chevron-down transition-transform"></i>
              </button>
              
              <div id="controls-content" class="hidden space-y-4 pt-3 border-t border-lux-navy/10">
                <!-- Brightness Control -->
                <div class="space-y-1">
                  <div class="flex items-center justify-between">
                    <label for="brightness-slider" class="text-[8px] font-black uppercase tracking-widest text-lux-navy/30">Brightness</label>
                    <span id="brightness-value" class="text-[8px] font-bold text-lux-navy">100%</span>
                  </div>
                  <input type="range" id="brightness-slider" min="50" max="150" value="100" class="w-full h-2 bg-lux-navy/10 rounded-full appearance-none cursor-pointer" aria-label="Adjust brightness">
                </div>

                <!-- Contrast Control -->
                <div class="space-y-1">
                  <div class="flex items-center justify-between">
                    <label for="contrast-slider" class="text-[8px] font-black uppercase tracking-widest text-lux-navy/30">Contrast</label>
                    <span id="contrast-value" class="text-[8px] font-bold text-lux-navy">100%</span>
                  </div>
                  <input type="range" id="contrast-slider" min="50" max="150" value="100" class="w-full h-2 bg-lux-navy/10 rounded-full appearance-none cursor-pointer" aria-label="Adjust contrast">
                </div>

                <!-- Zoom Control -->
                <div class="space-y-1">
                  <div class="flex items-center justify-between">
                    <label for="zoom-slider" class="text-[8px] font-black uppercase tracking-widest text-lux-navy/30">Zoom</label>
                    <span id="zoom-value" class="text-[8px] font-bold text-lux-navy">1.0x</span>
                  </div>
                  <input type="range" id="zoom-slider" min="100" max="200" value="100" step="10" class="w-full h-2 bg-lux-navy/10 rounded-full appearance-none cursor-pointer" aria-label="Adjust zoom">
                </div>

                <!-- Mirror/Flip Option -->
                <div class="flex items-center gap-2 pt-2">
                  <input type="checkbox" id="mirror-checkbox" class="w-4 h-4 rounded border-lux-navy/20 text-lux-gold focus:ring-lux-gold" aria-label="Mirror camera feed">
                  <label for="mirror-checkbox" class="text-xs font-medium text-lux-navy">Mirror Feed (for selfie camera)</label>
                </div>

                <!-- Reset Button -->
                <button type="button" id="reset-controls-btn" class="w-full mt-3 py-2 px-4 bg-lux-navy/10 hover:bg-lux-navy/20 text-lux-navy text-xs font-bold rounded-lg transition-colors">
                  <i class="fas fa-undo mr-2"></i> Reset to Defaults
                </button>
              </div>
            </div>

            <!-- Camera State Badge -->
            <div class="mb-6 flex items-center justify-between px-4 py-2 bg-lux-navy/5 rounded-lg">
              <span class="text-xs font-bold text-lux-navy">Camera Status:</span>
              <span id="camera-state-badge" class="inline-flex items-center gap-1 px-3 py-1 bg-gray-200 text-gray-700 text-xs font-bold rounded-full">
                <i class="fas fa-circle text-gray-500 text-[6px]"></i> OFF
              </span>
            </div>

            <!-- Toggle Button -->
            <div class="mt-10 flex gap-3">
              <button id="camera-toggle-btn" aria-label="Toggle camera on/off" class="flex-1 py-5 bg-lux-navy text-white text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-lux-gold transition-all shadow-xl shadow-lux-navy/10 flex items-center justify-center gap-3">
                <i id="toggle-icon" class="fas fa-power-off"></i>
                <span id="toggle-text">Turn On Camera</span>
              </button>
            </div>
          </div>

          <!-- Manual Verification -->
          <div class="space-y-8">
              <div class="bg-white p-10 rounded-[3rem] premium-shadow border border-lux-navy/5">
                <h3 class="luxury-heading text-xl font-bold mb-8">Manual Audit</h3>
                <div class="space-y-6">
                  <div class="space-y-1">
                    <label for="manual-qr" class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Admission ID or Payload</label>
                    <textarea id="manual-qr" rows="4" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white h-32 text-center font-mono text-sm tracking-widest" placeholder="PASTE VERIFICATION STRING..."></textarea>
                  </div>
                  <button id="manual-verify-btn" class="w-full py-5 bg-lux-gold text-lux-navy text-[10px] font-black uppercase tracking-widest rounded-full hover:shadow-2xl hover:-translate-y-0.5 transition-all flex items-center justify-center gap-3">
                    <i class="fas fa-fingerprint"></i>
                    <span id="manual-btn-text">Authorize Manually</span>
                  </button>
                </div>
              </div>

              <!-- Verification Result -->
              <div id="checkin-result" class="hidden page-transition">
                <div class="bg-lux-navy rounded-[3rem] p-10 text-white premium-shadow relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-lux-gold/10 rounded-full blur-[80px] -mr-32 -mt-32"></div>
                    <div id="result-content" class="relative z-10 text-center">
                        <!-- Dynamic Result Content -->
                    </div>
                </div>
              </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/admin.js?v=2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
        if (typeof renderAdminNav === 'function') renderAdminNav('checkin');
        const user = await loadUser();
        if (!user || user.role !== 'admin') {
            window.location.replace('/login.html');
            return;
        }
    });

    let html5QrCode = null;
    let currentCameraId = null;
    let availableCameras = [];
    let cameraActive = false;
    let cameraSettings = {
      brightness: 100,
      contrast: 100,
      zoom: 100,
      mirror: false
    };

    // Check camera permissions on page load
    async function checkCameraPermission() {
      try {
        if (navigator.permissions) {
          const result = await navigator.permissions.query({ name: 'camera' });
          updatePermissionStatus(result.state);
          result.addEventListener('change', () => updatePermissionStatus(result.state));
        }
      } catch (err) {
        // Permissions API not supported, continue anyway
      }
    }

    function updatePermissionStatus(state) {
      const statusBadge = document.getElementById('permission-status');
      if (state === 'denied') {
        statusBadge.classList.remove('hidden');
      } else {
        statusBadge.classList.add('hidden');
      }
    }

    // Load camera settings from localStorage
    function loadCameraSettings() {
      const saved = localStorage.getItem('cameraSettings_' + (typeof loadUser !== 'undefined' ? 'default' : 'default'));
      if (saved) {
        cameraSettings = { ...cameraSettings, ...JSON.parse(saved) };
        updateSettingsUI();
      }
    }

    // Save camera settings to localStorage
    function saveCameraSettings() {
      localStorage.setItem('cameraSettings_default', JSON.stringify(cameraSettings));
    }

    // Update UI to reflect current settings
    function updateSettingsUI() {
      document.getElementById('brightness-slider').value = cameraSettings.brightness;
      document.getElementById('brightness-value').textContent = cameraSettings.brightness + '%';
      document.getElementById('contrast-slider').value = cameraSettings.contrast;
      document.getElementById('contrast-value').textContent = cameraSettings.contrast + '%';
      document.getElementById('zoom-slider').value = cameraSettings.zoom;
      document.getElementById('zoom-value').textContent = (cameraSettings.zoom / 100).toFixed(1) + 'x';
      document.getElementById('mirror-checkbox').checked = cameraSettings.mirror;
      applyVideoFilters();
    }

    // Apply video filters based on settings
    function applyVideoFilters() {
      const qrReader = document.getElementById('qr-reader');
      if (!qrReader) return;
      
      const video = qrReader.querySelector('video');
      if (!video) return;
      
      let filters = [];
      filters.push(`brightness(${cameraSettings.brightness}%)`);
      filters.push(`contrast(${cameraSettings.contrast}%)`);
      
      video.style.filter = filters.join(' ');
      video.style.zoom = (cameraSettings.zoom / 100);
      
      if (cameraSettings.mirror) {
        video.style.transform = 'scaleX(-1)';
      } else {
        video.style.transform = 'scaleX(1)';
      }
    }

    // Toggle advanced controls visibility
    function setupControlsToggle() {
      const toggleBtn = document.getElementById('toggle-controls');
      const content = document.getElementById('controls-content');
      const chevron = toggleBtn.querySelector('i.fa-chevron-down');
      
      if (!toggleBtn) return;
      
      toggleBtn.addEventListener('click', () => {
        const isHidden = content.classList.contains('hidden');
        if (isHidden) {
          content.classList.remove('hidden');
          toggleBtn.setAttribute('aria-expanded', 'true');
          chevron.style.transform = 'rotate(180deg)';
        } else {
          content.classList.add('hidden');
          toggleBtn.setAttribute('aria-expanded', 'false');
          chevron.style.transform = 'rotate(0deg)';
        }
      });
    }

    // Setup camera controls event listeners
    function setupCameraControls() {
      const brightnessSlider = document.getElementById('brightness-slider');
      const contrastSlider = document.getElementById('contrast-slider');
      const zoomSlider = document.getElementById('zoom-slider');
      const mirrorCheckbox = document.getElementById('mirror-checkbox');
      const resetBtn = document.getElementById('reset-controls-btn');
      
      brightnessSlider?.addEventListener('input', (e) => {
        cameraSettings.brightness = parseInt(e.target.value);
        document.getElementById('brightness-value').textContent = cameraSettings.brightness + '%';
        applyVideoFilters();
      });
      
      contrastSlider?.addEventListener('input', (e) => {
        cameraSettings.contrast = parseInt(e.target.value);
        document.getElementById('contrast-value').textContent = cameraSettings.contrast + '%';
        applyVideoFilters();
      });
      
      zoomSlider?.addEventListener('input', (e) => {
        cameraSettings.zoom = parseInt(e.target.value);
        document.getElementById('zoom-value').textContent = (cameraSettings.zoom / 100).toFixed(1) + 'x';
        applyVideoFilters();
      });
      
      mirrorCheckbox?.addEventListener('change', (e) => {
        cameraSettings.mirror = e.target.checked;
        applyVideoFilters();
      });
      
      resetBtn?.addEventListener('click', () => {
        cameraSettings = { brightness: 100, contrast: 100, zoom: 100, mirror: false };
        updateSettingsUI();
        showToast('Camera settings reset to defaults.', 'info');
      });
    }

    // Update camera selection dropdown
    async function updateCameraList() {
      const select = document.getElementById('camera-select');
      await getCameras();
      
      select.innerHTML = '';
      if (availableCameras.length === 0) {
        select.innerHTML = '<option value="">No cameras found</option>';
        return;
      }
      
      availableCameras.forEach((camera, index) => {
        const option = document.createElement('option');
        option.value = camera.deviceId;
        let label = camera.label || `Camera ${index + 1}`;
        if (label.toLowerCase().includes('environment') || label.toLowerCase().includes('back')) {
          label = '📷 Back Camera - ' + label;
        } else if (label.toLowerCase().includes('user') || label.toLowerCase().includes('front')) {
          label = '🤳 Front Camera - ' + label;
        }
        option.textContent = label;
        select.appendChild(option);
      });
      
      // Select previously used camera if available
      if (currentCameraId && availableCameras.find(c => c.deviceId === currentCameraId)) {
        select.value = currentCameraId;
      } else if (availableCameras.length > 0) {
        currentCameraId = availableCameras[0].deviceId;
        select.value = currentCameraId;
      }
    }

    // Handle camera selection change
    function setupCameraSelection() {
      const select = document.getElementById('camera-select');
      select?.addEventListener('change', (e) => {
        currentCameraId = e.target.value;
        if (cameraActive) {
          showToast('Camera will switch on next activation.', 'info');
        }
      });
    }

    // Toggle camera on/off
    async function toggleCamera() {
      if (cameraActive) {
        await stopScan();
      } else {
        await startScan();
      }
    }

    // Update camera state badge
    function updateCameraStateBadge() {
      const badge = document.getElementById('camera-state-badge');
      const toggleBtn = document.getElementById('camera-toggle-btn');
      const toggleText = document.getElementById('toggle-text');
      const toggleIcon = document.getElementById('toggle-icon');
      
      if (cameraActive) {
        badge.innerHTML = '<i class="fas fa-circle text-lux-gold text-[6px] animate-pulse"></i> SCANNING';
        badge.className = 'inline-flex items-center gap-1 px-3 py-1 bg-lux-gold/20 text-lux-gold text-xs font-bold rounded-full';
        toggleBtn.classList.remove('hover:bg-lux-gold');
        toggleBtn.classList.add('bg-lux-gold', 'text-lux-navy');
        toggleText.textContent = 'Turn Off Camera';
        toggleIcon.className = 'fas fa-power-off';
      } else {
        badge.innerHTML = '<i class="fas fa-circle text-gray-500 text-[6px]"></i> OFF';
        badge.className = 'inline-flex items-center gap-1 px-3 py-1 bg-gray-200 text-gray-700 text-xs font-bold rounded-full';
        toggleBtn.classList.remove('bg-lux-gold', 'text-lux-navy');
        toggleBtn.classList.add('hover:bg-lux-gold');
        toggleText.textContent = 'Turn On Camera';
        toggleIcon.className = 'fas fa-power-off';
      }
    }

    // Get available cameras
    async function getCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        availableCameras = devices.filter(device => device.kind === 'videoinput');
        return availableCameras;
      } catch (err) {
        console.error('Failed to enumerate cameras:', err);
        return [];
      }
    }

    // Show camera error in the reader div
    function showCameraError(message) {
      const readerDiv = document.getElementById('qr-reader');
      if (!readerDiv) return;
      
      const placeholder = document.getElementById('placeholder-icon');
      if (placeholder) {
        placeholder.classList.add('hidden');
      }
      
      // Remove existing error if any
      const existingError = readerDiv.querySelector('.camera-error');
      if (existingError) {
        existingError.remove();
      }
      
      const errorDiv = document.createElement('div');
      errorDiv.className = 'camera-error';
      errorDiv.innerHTML = `
        <i class="fas fa-camera-slash"></i>
        <p class="text-[10px] font-black uppercase tracking-widest text-lux-navy/40 mb-2">Camera Unavailable</p>
        <p>${message}</p>
        <button id="retry-camera-btn" class="mt-6 px-6 py-3 bg-lux-navy text-white text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-lux-gold transition-all">
          Retry Access
        </button>
      `;
      readerDiv.appendChild(errorDiv);
      
      // Attach event listener to retry button
      const retryBtn = document.getElementById('retry-camera-btn');
      if (retryBtn) {
        retryBtn.addEventListener('click', retryCamera);
      }
    }

    // Retry camera access
    async function retryCamera() {
      const readerDiv = document.getElementById('qr-reader');
      const existingError = readerDiv.querySelector('.camera-error');
      if (existingError) {
        existingError.remove();
      }
      const placeholder = document.getElementById('placeholder-icon');
      placeholder.classList.remove('hidden');
      await startScan();
    }

    async function startScan() {
      const readerDiv = document.getElementById('qr-reader');
      const placeholder = document.getElementById('placeholder-icon');
      const statusIndicator = document.getElementById('scanner-status');
      const toggleBtn = document.getElementById('camera-toggle-btn');
      
      // Check if browser supports camera
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showCameraError('Your browser does not support camera access. Please use a modern browser like Chrome, Firefox, or Safari.');
        return;
      }

      try {
        if (html5QrCode) {
          await stopScan();
        }

        // Remove any existing error messages
        const existingError = readerDiv.querySelector('.camera-error');
        if (existingError) {
          existingError.remove();
        }

        html5QrCode = new Html5Qrcode("qr-reader");
        
        toggleBtn.disabled = true;
        toggleBtn.classList.add('opacity-50');
        toggleBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Initializing...</span>';

        // Try to get cameras first
        await getCameras();

        // Determine which camera to use
        let cameraConfig;
        if (currentCameraId && availableCameras.find(c => c.deviceId === currentCameraId)) {
          // Use previously selected camera
          cameraConfig = { deviceId: { exact: currentCameraId } };
        } else if (availableCameras.length > 0) {
          // Try environment (back) camera first, fallback to any available
          const envCamera = availableCameras.find(c => c.label.toLowerCase().includes('environment') || c.label.toLowerCase().includes('back'));
          if (envCamera) {
            cameraConfig = { deviceId: { exact: envCamera.deviceId } };
            currentCameraId = envCamera.deviceId;
          } else {
            cameraConfig = { facingMode: "environment" };
          }
        } else {
          // No cameras enumerated, try generic environment mode
          cameraConfig = { facingMode: "environment" };
        }

        await html5QrCode.start(
          cameraConfig,
          { 
            fps: 10, 
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0,
            disableFlip: false
          },
          (decodedText) => {
            console.log('Optics Protocol Match:', decodedText);
            // Visual feedback on scan
            readerDiv.classList.add('scanner-active');
            setTimeout(() => readerDiv.classList.remove('scanner-active'), 500);
            
            // Play a subtle beep sound
            playScanSound();
            
            verifyArrival(decodedText);
          },
          (errorMessage) => {
            // Ignore constant lookup errors - this is normal behavior
          }
        );
        
        placeholder.classList.add('hidden');
        statusIndicator.classList.remove('hidden');
        
        cameraActive = true;
        updateCameraStateBadge();
        toggleBtn.disabled = false;
        toggleBtn.innerHTML = '<i id="toggle-icon" class="fas fa-power-off"></i><span id="toggle-text">Turn Off Camera</span>';
        
        // Apply saved camera settings
        applyVideoFilters();
        
        showToast('Optical verification system active.', 'success');
      } catch (err) {
        console.error('Camera failed:', err);
        toggleBtn.disabled = false;
        toggleBtn.innerHTML = '<i id="toggle-icon" class="fas fa-power-off"></i><span id="toggle-text">Turn On Camera</span>';
        
        // Provide specific error messages
        let errorMessage = 'Camera access denied. Please check permissions.';
        
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          errorMessage = 'Camera permission denied. Please allow camera access in your browser settings and refresh the page.';
          showCameraError(errorMessage);
        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
          errorMessage = 'No camera device found. Please connect a camera and try again.';
          showCameraError(errorMessage);
        } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
          errorMessage = 'Camera is already in use by another application. Please close other apps using the camera.';
          showCameraError(errorMessage);
        } else if (err.name === 'OverconstrainedError') {
          errorMessage = 'Camera does not support required settings. Trying fallback...';
          // Try with user-facing camera as fallback
          try {
            if (html5QrCode) {
              await html5QrCode.stop();
              html5QrCode.clear();
            }
            html5QrCode = new Html5Qrcode("qr-reader");
            await html5QrCode.start(
              { facingMode: "user" },
              { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
              },
              (decodedText) => {
                readerDiv.classList.add('scanner-active');
                setTimeout(() => readerDiv.classList.remove('scanner-active'), 500);
                playScanSound();
                verifyArrival(decodedText);
              },
              () => {}
            );
            
            placeholder.classList.add('hidden');
            statusIndicator.classList.remove('hidden');
            
            cameraActive = true;
            updateCameraStateBadge();
            toggleBtn.disabled = false;
            toggleBtn.innerHTML = '<i id="toggle-icon" class="fas fa-power-off"></i><span id="toggle-text">Turn Off Camera</span>';
            applyVideoFilters();
            
            showToast('Using front camera for verification.', 'success');
            return;
          } catch (fallbackErr) {
            errorMessage = 'Unable to access camera. Please check your device and try again.';
            showCameraError(errorMessage);
          }
        } else {
          showCameraError(errorMessage);
        }
        
        showToast(errorMessage, 'error');
      }
    }

    async function stopScan() {
      const placeholder = document.getElementById('placeholder-icon');
      const statusIndicator = document.getElementById('scanner-status');
      const toggleBtn = document.getElementById('camera-toggle-btn');

      if (html5QrCode) {
        try {
          await html5QrCode.stop();
          await html5QrCode.clear();
          html5QrCode = null;
          
          // Remove any error messages
          const readerDiv = document.getElementById('qr-reader');
          const existingError = readerDiv.querySelector('.camera-error');
          if (existingError) {
            existingError.remove();
          }
          
          placeholder.classList.remove('hidden');
          statusIndicator.classList.add('hidden');
          
          cameraActive = false;
          updateCameraStateBadge();
          toggleBtn.disabled = false;
          toggleBtn.innerHTML = '<i id="toggle-icon" class="fas fa-power-off"></i><span id="toggle-text">Turn On Camera</span>';
          
          showToast('Optical system offline.', 'info');
        } catch (err) {
          console.error('Failed to stop optics:', err);
          // Force reset even if stop fails
          html5QrCode = null;
          placeholder.classList.remove('hidden');
          statusIndicator.classList.add('hidden');
          
          cameraActive = false;
          updateCameraStateBadge();
          toggleBtn.disabled = false;
          toggleBtn.innerHTML = '<i id="toggle-icon" class="fas fa-power-off"></i><span id="toggle-text">Turn On Camera</span>';
        }
      }
    }

    // Play a subtle scan success sound
    function playScanSound() {
      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        oscillator.frequency.value = 880; // A5 note
        oscillator.type = 'sine';
        gainNode.gain.value = 0.1;
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
        
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.1);
      } catch (err) {
        // Audio not supported or blocked, silently fail
      }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', async () => {
      // Ensure optics library is loaded
      if (typeof window.Html5Qrcode === 'undefined') {
        showCameraError('Optics library failed to load. Refresh the page and allow scripts if blocked.');
        return;
      }

      // Setup UI controls
      setupControlsToggle();
      setupCameraControls();
      setupCameraSelection();
      
      // Setup event listeners for buttons
      const toggleBtn = document.getElementById('camera-toggle-btn');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', toggleCamera);
      }
      
      const manualVerifyBtn = document.getElementById('manual-verify-btn');
      if (manualVerifyBtn) {
        manualVerifyBtn.addEventListener('click', verifyManual);
      }
      
      // Load settings and check permissions
      loadCameraSettings();
      checkCameraPermission();
      
      // Update camera list
      await updateCameraList();
      
      // Initialize camera state
      updateCameraStateBadge();
    });


    async function verifyManual() {
      const input = document.getElementById('manual-qr');
      const btn = document.getElementById('manual-verify-btn');
      const btnText = document.getElementById('manual-btn-text');
      const val = input.value.trim();
      
      if (!val) {
        showToast('Manual verification requires a payload.', 'error');
        input.focus();
        return;
      }

      // Loading state
      btn.disabled = true;
      btn.style.opacity = '0.7';
      btnText.textContent = 'Verifying Protocol...';

      await verifyArrival(val);

      // Reset loading state
      btn.disabled = false;
      btn.style.opacity = '1';
      btnText.textContent = 'Authorize Manually';
    }

    async function verifyArrival(payload) {
      try {
        // Using the requested verification endpoint
        const res = await api.post('/verify-arrival', { admission_id: payload });
        
        if (res.success) {
            showToast('Guest verified successfully', 'success');
            // Save camera settings after successful scan
            saveCameraSettings();
        } else {
            showToast(res.message || 'Invalid Admission ID', 'error');
        }
        
        showResult(res);
      } catch (err) {
        showToast('Verification server unreachable', 'error');
      }
    }

    function showResult(res) {
      const container = document.getElementById('checkin-result');
      const content = document.getElementById('result-content');
      container.classList.remove('hidden');
      
      // Auto-scroll to result
      container.scrollIntoView({ behavior: 'smooth', block: 'center' });

      if (res.success) {
        content.innerHTML = `
          <div class="w-24 h-24 bg-green-500/10 rounded-full flex items-center justify-center mx-auto mb-8 border-2 border-green-500/20 shadow-lg shadow-green-500/10">
            <i class="fas fa-check-circle text-green-400 text-4xl"></i>
          </div>
          <h2 class="luxury-heading text-3xl font-bold mb-3 text-white">Verification Success</h2>
          <p class="text-[10px] font-black uppercase tracking-[0.3em] text-lux-gold mb-10">Guest Authorized for Entry</p>
          
          <div class="space-y-4 text-left bg-white/[0.03] backdrop-blur-sm p-8 rounded-[2rem] border border-white/10 shadow-inner">
            <div class="flex justify-between items-center">
                <span class="text-[8px] font-black uppercase tracking-widest text-white/30">Guest Name</span>
                <span class="text-sm font-bold text-white">${res.data?.guest_name || 'Protocol Guest'}</span>
            </div>
            <div class="h-px bg-white/5 w-full"></div>
            <div class="flex justify-between items-center">
                <span class="text-[8px] font-black uppercase tracking-widest text-white/30">Asset Assigned</span>
                <span class="text-sm font-bold text-lux-gold">${res.data?.facility_name || 'N/A'}</span>
            </div>
            <div class="h-px bg-white/5 w-full"></div>
            <div class="flex justify-between items-center">
                <span class="text-[8px] font-black uppercase tracking-widest text-white/30">Verification Time</span>
                <span class="text-sm font-bold text-white">${new Date().toLocaleTimeString()}</span>
            </div>
          </div>
        `;
      } else {
        content.innerHTML = `
          <div class="w-24 h-24 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-8 border-2 border-red-500/20 shadow-lg shadow-red-500/10">
            <i class="fas fa-shield-slash text-red-400 text-4xl"></i>
          </div>
          <h2 class="luxury-heading text-3xl font-bold mb-3 text-white">Verification Failed</h2>
          <p class="text-red-400/60 text-[10px] font-black uppercase tracking-widest mb-4">Security Protocol Deviation Detected</p>
          <div class="bg-red-500/5 p-6 rounded-2xl border border-red-500/10">
            <p class="text-xs text-white/60 font-medium italic">"${res.message || 'Invalid or Expired Admission Pass'}"</p>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
