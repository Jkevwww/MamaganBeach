<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bespoke Settlement | Mamagan Beach Resort Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-lux-cream font-sans text-lux-navy">
  <!-- Navbar -->
  <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-xl shadow-sm z-50 border-b border-lux-gold/10">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex justify-between items-center h-20">
        <a href="/" class="flex items-center gap-3">
          <img src="/images/logos/LOGO.png" alt="Mamagan" class="h-14">
          <span class="luxury-heading font-bold text-2xl text-lux-navy tracking-tight">Mamagan Fun & Adventure<span class="text-lux-gold"> Beach Resort</span></span>
        </a>
        <div class="hidden md:flex items-center gap-8">
          <a href="/resorts.html" class="text-lux-navy/70 hover:text-lux-gold font-medium transition-colors uppercase tracking-widest text-xs">Resorts</a>
          <a href="/my-bookings.html" class="text-lux-navy/70 hover:text-lux-gold font-medium transition-colors uppercase tracking-widest text-xs">Bookings</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="pt-32 pb-32">
    <div class="max-w-4xl mx-auto px-6 page-transition">
      <div class="text-center mb-16">
        <span class="text-lux-gold font-black uppercase tracking-[0.3em] text-[10px] mb-4 block">Secure Checkout</span>
        <h1 class="luxury-heading text-4xl font-bold text-lux-navy">Finalize Your Reservation</h1>
      </div>

      <div class="grid lg:grid-cols-2 gap-12">
        <!-- Payment Methods -->
        <div class="space-y-8">
          <div class="glass-card p-10 rounded-[2.5rem] premium-shadow border border-lux-navy/5">
            <h3 class="luxury-heading font-bold text-xl mb-8">Select Method</h3>
            <div class="grid grid-cols-2 gap-4">
              <button onclick="selectMethod('gcash')" id="btn-gcash" class="method-btn p-6 border-2 border-lux-navy/5 rounded-2xl text-center hover:border-lux-gold transition-all group">
                <img src="https://brandlogos.net/wp-content/uploads/2022/07/gcash-logo_brandlogos.net_kxdbq.png" class="h-8 mx-auto mb-3 object-contain" alt="GCash">
                <span class="text-[10px] font-black uppercase tracking-widest text-lux-navy/40 group-hover:text-lux-navy transition-colors">GCash</span>
              </button>
              <button onclick="selectMethod('maya')" id="btn-maya" class="method-btn p-6 border-2 border-lux-navy/5 rounded-2xl text-center hover:border-lux-gold transition-all group">
                <img src="https://www.svgrepo.com/show/331295/maya.svg" class="h-8 mx-auto mb-3 object-contain" alt="Maya">
                <span class="text-[10px] font-black uppercase tracking-widest text-lux-navy/40 group-hover:text-lux-navy transition-colors">Maya</span>
              </button>
              <button onclick="selectMethod('grabpay')" id="btn-grabpay" class="method-btn p-6 border-2 border-lux-navy/5 rounded-2xl text-center hover:border-lux-gold transition-all group">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Grab_Logo_2023.svg/512px-Grab_Logo_2023.svg.png" class="h-6 mx-auto mb-5 object-contain" alt="GrabPay">
                <span class="text-[10px] font-black uppercase tracking-widest text-lux-navy/40 group-hover:text-lux-navy transition-colors">GrabPay</span>
              </button>
              <button onclick="selectMethod('card')" id="btn-card" class="method-btn p-6 border-2 border-lux-navy/5 rounded-2xl text-center hover:border-lux-gold transition-all group">
                <i class="fas fa-credit-card text-2xl text-lux-navy/20 mb-3 group-hover:text-lux-navy transition-colors"></i>
                <span class="text-[10px] font-black uppercase tracking-widest text-lux-navy/40 group-hover:text-lux-navy transition-colors block">Credit Card</span>
              </button>
            </div>

            <!-- Card Form -->
            <div id="card-form" class="hidden mt-8 space-y-4 fade-in">
              <div class="space-y-1">
                <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Card Holder Number</label>
                <input type="text" id="card-number" maxlength="19" oninput="formatCardNumber(this)" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white" placeholder="0000 0000 0000 0000">
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                  <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">Expiration</label>
                  <input type="text" id="card-expiry" maxlength="5" oninput="formatExpiry(this)" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white" placeholder="MM/YY">
                </div>
                <div class="space-y-1">
                  <label class="text-[10px] font-black uppercase tracking-widest text-lux-navy/30 ml-2">CVC</label>
                  <input type="text" id="card-cvv" maxlength="4" class="premium-input bg-lux-navy/5 border-transparent focus:bg-white" placeholder="000">
                </div>
              </div>
            </div>

            <button onclick="payNow()" id="pay-btn" class="w-full mt-10 py-6 bg-lux-navy text-white font-black uppercase tracking-widest rounded-full hover:bg-lux-gold hover:shadow-2xl transition-all flex items-center justify-center gap-4 disabled:opacity-30 disabled:cursor-not-allowed" disabled>
              <span>Authorize Settlement</span>
              <i id="pay-spinner" class="fas fa-circle-notch fa-spin hidden"></i>
            </button>
          </div>
        </div>

        <!-- Itinerary Summary -->
        <div class="space-y-8">
          <div class="bg-lux-navy rounded-[2.5rem] p-10 text-white premium-shadow relative overflow-hidden">
            <div class="absolute top-0 right-0 w-64 h-64 bg-lux-gold/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
            <h3 class="luxury-heading font-bold text-2xl mb-8 relative z-10">Itinerary Summary</h3>
            
            <div class="space-y-6 relative z-10">
              <div class="flex justify-between items-center border-b border-white/10 pb-4">
                <span class="text-[10px] font-black uppercase tracking-widest text-white/40">Reservation ID</span>
                <span class="text-sm font-mono text-lux-gold" id="pay-booking-id">-</span>
              </div>
              <div class="flex justify-between items-center border-b border-white/10 pb-4">
                <span class="text-[10px] font-black uppercase tracking-widest text-white/40">Facility</span>
                <span class="text-sm font-bold" id="pay-facility">-</span>
              </div>
              <div class="flex justify-between items-center border-b border-white/10 pb-4">
                <span class="text-[10px] font-black uppercase tracking-widest text-white/40">Temporal Window</span>
                <span class="text-sm font-bold" id="pay-datetime">-</span>
              </div>
              
              <div class="pt-6">
                <div class="flex justify-between items-end">
                  <span class="text-[10px] font-black uppercase tracking-widest text-lux-gold">Total Investment</span>
                  <div class="text-right">
                    <span class="text-xs text-white/40 block mb-1">VAT Included</span>
                    <span class="text-4xl font-black" id="pay-total">PHP 0</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          <div class="p-8 rounded-[2rem] border border-lux-navy/5 text-center">
            <p class="text-[10px] font-bold text-lux-navy/30 uppercase tracking-widest mb-4">Secured by PayMongo Enterprise</p>
            <div class="flex justify-center gap-6 opacity-20 grayscale">
              <i class="fab fa-cc-visa text-2xl"></i>
              <i class="fab fa-cc-mastercard text-2xl"></i>
              <i class="fab fa-cc-amex text-2xl"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script>
    if (!requireAuth()) throw new Error('Auth required');

    const params = new URLSearchParams(window.location.search);
    const bookingId = params.get('booking');
    let selectedMethod = null;

    async function loadBooking() {
      if (!bookingId) { window.location.href = '/my-bookings.html'; return; }
      const res = await api.get(`/bookings/${bookingId}`);
      if (!res.success) { window.location.href = '/my-bookings.html'; return; }
      const b = res.data;
      if (b.payment_status === 'paid') { window.location.href = `/ticket.html?booking=${bookingId}`; return; }
      
      document.getElementById('pay-booking-id').textContent = b.id.substring(0, 8).toUpperCase();
      document.getElementById('pay-facility').textContent = b.facility_name;
      document.getElementById('pay-datetime').textContent = `${b.booking_date} | ${b.time_slot}`;
      document.getElementById('pay-total').textContent = `PHP ${Number(b.total_amount).toLocaleString('en-PH', {minimumFractionDigits: 2})}`;
    }

    function selectMethod(method) {
      selectedMethod = method;
      document.querySelectorAll('.method-btn').forEach(btn => btn.classList.remove('border-lux-gold', 'bg-lux-gold/5'));
      document.getElementById(`btn-${method}`).classList.add('border-lux-gold', 'bg-lux-gold/5');

      const cardForm = document.getElementById('card-form');
      if (method === 'card') {
        cardForm.classList.remove('hidden');
        validateCard();
      } else {
        cardForm.classList.add('hidden');
        document.getElementById('pay-btn').disabled = false;
      }
    }

    function formatCardNumber(input) {
      let v = input.value.replace(/\D/g, '').substring(0, 16);
      input.value = v.replace(/(\d{4})(?=\d)/g, '$1 ');
      validateCard();
    }

    function formatExpiry(input) {
      let v = input.value.replace(/\D/g, '').substring(0, 4);
      if (v.length >= 2) v = v.substring(0, 2) + '/' + v.substring(2);
      input.value = v;
      validateCard();
    }

    function validateCard() {
      if (selectedMethod !== 'card') return;
      const num = document.getElementById('card-number').value.replace(/\s/g, '');
      const exp = document.getElementById('card-expiry').value;
      const cvv = document.getElementById('card-cvv').value;
      document.getElementById('pay-btn').disabled = !(num.length >= 15 && exp.length === 5 && cvv.length >= 3);
    }

    document.getElementById('card-cvv').addEventListener('input', validateCard);

    async function payNow() {
      const btn = document.getElementById('pay-btn');
      const spinner = document.getElementById('pay-spinner');
      btn.disabled = true;
      spinner.classList.remove('hidden');

      // Simulate premium processing delay
      setTimeout(async () => {
        const res = await api.post('/payments/simulate-success', { booking_id: bookingId });
        if (res.success) {
          showToast('Payment authorized successfully.', 'success');
          setTimeout(() => { window.location.href = `/ticket.html?booking=${bookingId}`; }, 1000);
        } else {
          btn.disabled = false;
          spinner.classList.add('hidden');
          showToast(res.message || 'Payment declined.', 'error');
        }
      }, 2500);
    }

    loadBooking();
  </script>
</body>
</html>
