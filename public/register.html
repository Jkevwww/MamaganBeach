<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Viewport removed - desktop only -->

  <title>Create Account - Mamagan Beach Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-ocean-50 font-sans">
  <div class="min-h-screen flex flex-col items-center justify-center py-12 px-4">
    <div class="max-w-md w-full">
      <div class="text-center mb-8">
        <a href="/" class="inline-flex items-center gap-3 mb-6">
          <img src="/images/logos/LOGO.png" alt="Mamagan Resort Logo" class="h-12">
          <span class="font-bold text-3xl text-ocean-900">Mamagan Beach Resort</span>
        </a>
        <h1 class="text-3xl font-bold text-gray-900">Create Your Account</h1>
        <p class="text-gray-600 mt-2">Start your adventure with us today!</p>
      </div>

      <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8">
        <form id="register-form" class="space-y-5">
          <div>
            <label for="full_name" class="block text-sm font-medium text-gray-800 mb-1">Full Name</label>
            <input type="text" id="full_name" required autocomplete="name" class="w-full px-4 py-3 rounded-xl bg-gray-50 border-gray-200 focus:border-ocean-500 focus:ring-2 focus:ring-ocean-200 outline-none transition duration-300" placeholder="Juan Dela Cruz">
          </div>
          <div>
            <label for="email" class="block text-sm font-medium text-gray-800 mb-1">Email Address</label>
            <input type="email" id="email" required autocomplete="email" class="w-full px-4 py-3 rounded-xl bg-gray-50 border-gray-200 focus:border-ocean-500 focus:ring-2 focus:ring-ocean-200 outline-none transition duration-300" placeholder="you@example.com">
          </div>
          <div>
            <label for="phone" class="block text-sm font-medium text-gray-800 mb-1">Phone <span class="text-gray-400">(optional)</span></label>
            <input type="tel" id="phone" autocomplete="tel" class="w-full px-4 py-3 rounded-xl bg-gray-50 border-gray-200 focus:border-ocean-500 focus:ring-2 focus:ring-ocean-200 outline-none transition duration-300" placeholder="+63 912 345 6789">
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-gray-800 mb-1">Password</label>
            <div class="relative">
              <input type="password" id="password" required minlength="6" autocomplete="new-password" class="w-full px-4 py-3 rounded-xl bg-gray-50 border-gray-200 focus:border-ocean-500 focus:ring-2 focus:ring-ocean-200 outline-none transition duration-300" placeholder="At least 6 characters">
              <button type="button" onclick="togglePassword('password')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" id="register-btn" class="w-full py-3 bg-ocean-600 text-white font-semibold rounded-xl hover:bg-ocean-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-ocean-500 transition-transform transform hover:scale-105 flex items-center justify-center gap-2 shadow-md">
            <span>Create Account</span>
            <i id="register-spinner" class="fas fa-circle-notch fa-spin hidden"></i>
          </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">Already have an account? <a href="/login.html" class="text-ocean-600 font-medium hover:text-ocean-700">Sign in</a></p>

        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
          <div class="relative flex justify-center text-sm"><span class="px-4 bg-white text-gray-500">or continue with</span></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <a href="/api/auth/google" class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-gray-200 rounded-xl text-gray-700 font-medium hover:bg-gray-50 transition-transform transform hover:scale-105">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-6 h-6" alt="Google">
            Google
          </a>
          <a href="/api/auth/facebook" class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-gray-200 rounded-xl text-gray-700 font-medium hover:bg-gray-50 transition-transform transform hover:scale-105">
            <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" class="w-6 h-6" alt="Facebook">
            Facebook
          </a>
        </div>
      </div>
      <p class="text-center text-xs text-gray-400 mt-8">© 2024 Mamagan Beach Resort. All rights reserved.</p>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script>
    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function validateField(id, condition, msg) {
      const el = document.getElementById(id);
      let hint = document.getElementById(id + '-hint');
      if (!hint) {
        hint = document.createElement('p');
        hint.id = id + '-hint';
        hint.className = 'text-xs mt-1 hidden text-red-500';
        el.parentNode.appendChild(hint);
      }
      if (condition) {
        el.classList.remove('border-red-300');
        el.classList.add('border-gray-200');
        hint.classList.add('hidden');
      } else {
        el.classList.remove('border-gray-200');
        el.classList.add('border-red-300');
        hint.textContent = msg;
        hint.classList.remove('hidden');
      }
    }

    document.getElementById('full_name').addEventListener('blur', (e) => {
      validateField('full_name', e.target.value.trim().length >= 2, 'Please enter your full name.');
    });
    document.getElementById('email').addEventListener('blur', (e) => {
      validateField('email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.target.value), 'Please enter a valid email address.');
    });
    document.getElementById('password').addEventListener('input', (e) => {
      validateField('password', e.target.value.length >= 6, 'Password must be at least 6 characters.');
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!full_name || full_name.length < 2) { showToast('Please enter your full name.', 'warning'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('Please enter a valid email address.', 'warning'); return; }
      if (password.length < 6) { showToast('Password must be at least 6 characters.', 'warning'); return; }

      const btn = document.getElementById('register-btn');
      const spinner = document.getElementById('register-spinner');
      btn.disabled = true;
      spinner.classList.remove('hidden');

      const res = await api.post('/auth/register', {
        full_name,
        email,
        phone: document.getElementById('phone').value,
        password,
      });

      btn.disabled = false;
      spinner.classList.add('hidden');

      if (res.success) {
        localStorage.setItem('token', res.token);
        showToast('Account created successfully!', 'success');
        setTimeout(() => { window.location.href = '/'; }, 800);
      } else {
        showToast(res.message || 'Registration failed', 'error');
      }
    });
  </script>
</body>
</html>
