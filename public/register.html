<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership Application | Mamagan Beach Resort Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-lux-dark font-sans text-lux-navy min-h-screen flex items-center justify-center relative overflow-hidden py-20">
  <!-- Premium Background -->
  <div class="absolute inset-0 z-0">
    <div class="absolute inset-0 bg-lux-navy/60 z-10"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-lux-navy/20 to-lux-navy/80 z-20"></div>
    <div class="absolute inset-0 bg-[url('/images/backgrounds/background.jpg')] bg-cover bg-center scale-105 animate-pulse-slow"></div>
  </div>

  <main class="relative z-30 w-full max-w-xl px-6 page-transition">
    <div class="text-center mb-10">
      <a href="/" class="inline-flex items-center gap-3 mb-8 group">
        <img src="/images/logos/LOGO.png" alt="Mamagan" class="h-16 group-hover:scale-110 transition-transform duration-500">
        <span class="luxury-heading font-bold text-3xl text-white tracking-tight">Mamagan <span class="text-lux-gold">Beach</span></span>
      </a>
      <h1 class="luxury-heading text-4xl font-bold text-white mb-2 drop-shadow-lg">Join the Collection</h1>
      <p class="text-white font-medium tracking-widest text-[10px] uppercase bg-lux-navy/30 inline-block px-4 py-1 rounded-full backdrop-blur-sm">Begin your journey into bespoke coastal luxury</p>
    </div>

    <div class="bg-white/95 p-10 md:p-12 rounded-[2.5rem] premium-shadow border border-white/20 backdrop-blur-2xl">
      <form id="register-form" class="space-y-6">
        <div class="grid md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label for="full_name" class="block text-[10px] font-black uppercase tracking-[0.2em] text-lux-navy/60 ml-2">Full Legal Name</label>
            <input type="text" id="full_name" required class="premium-input bg-lux-cream/50 border-lux-navy/10 text-lux-navy focus:bg-white" placeholder="Juan Dela Cruz">
          </div>
          <div class="space-y-2">
            <label for="email" class="block text-[10px] font-black uppercase tracking-[0.2em] text-lux-navy/60 ml-2">Digital Identity</label>
            <input type="email" id="email" required class="premium-input bg-lux-cream/50 border-lux-navy/10 text-lux-navy focus:bg-white" placeholder="email@example.com">
          </div>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label for="phone" class="block text-[10px] font-black uppercase tracking-[0.2em] text-lux-navy/60 ml-2">Contact Number</label>
            <input type="tel" id="phone" class="premium-input bg-lux-cream/50 border-lux-navy/10 text-lux-navy focus:bg-white" placeholder="+63 900 000 0000">
          </div>
          <div class="space-y-2 relative">
            <label for="password" class="block text-[10px] font-black uppercase tracking-[0.2em] text-lux-navy/60 ml-2">Access Key</label>
            <div class="relative">
              <input type="password" id="password" required minlength="6" class="premium-input bg-lux-cream/50 border-lux-navy/10 text-lux-navy focus:bg-white" placeholder="••••••••">
              <button type="button" onclick="togglePassword('password')" title="Toggle password visibility" aria-label="Toggle password visibility" class="absolute right-6 top-1/2 -translate-y-1/2 text-lux-navy/20 hover:text-lux-gold transition-colors">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="pt-4">
          <button type="submit" id="register-btn" class="premium-button-gold w-full flex items-center justify-center gap-4 group py-6 shadow-xl">
            <span class="text-xs">Apply for Membership</span>
            <i id="register-spinner" class="fas fa-circle-notch fa-spin hidden"></i>
            <i class="fas fa-crown group-hover:rotate-12 transition-transform text-xs"></i>
          </button>
        </div>
      </form>

      <div class="relative my-10">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-lux-navy/5"></div></div>
        <div class="relative flex justify-center text-[10px] font-black uppercase tracking-[0.3em]"><span class="px-4 bg-white text-lux-navy/20">Social Integration</span></div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <a href="/api/auth/google" class="flex items-center justify-center gap-3 px-6 py-4 rounded-2xl bg-white/5 border border-white/10 text-white text-[10px] font-bold uppercase tracking-widest hover:bg-white hover:text-lux-navy transition-all">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4" alt="Google">
          Google
        </a>
        <a href="/api/auth/github" class="flex items-center justify-center gap-3 px-6 py-4 rounded-2xl bg-white/5 border border-white/10 text-white text-[10px] font-bold uppercase tracking-widest hover:bg-white hover:text-lux-navy transition-all">
          <i class="fab fa-github text-base"></i>
          GitHub
        </a>
      </div>
    </div>

    <p class="text-center mt-10 text-[10px] font-bold uppercase tracking-widest text-white/30">
      Already a member? <a href="/login.html" class="text-lux-gold hover:text-white transition-colors border-b border-lux-gold/30 pb-0.5">Access Your Account</a>
    </p>
  </main>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script>
    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      const spinner = document.getElementById('register-spinner');
      btn.disabled = true;
      spinner.classList.remove('hidden');

      try {
        const res = await api.post('/auth/register', {
          full_name: document.getElementById('full_name').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value,
          password: document.getElementById('password').value,
        });

        if (res.success) {
          localStorage.setItem('token', res.token);
          showToast('Membership granted successfully.', 'success');
          setTimeout(() => { window.location.href = '/'; }, 1000);
        } else {
          btn.disabled = false;
          spinner.classList.add('hidden');
          showToast(res.message || 'Application failed.', 'error');
        }
      } catch (error) {
        btn.disabled = false;
        spinner.classList.add('hidden');
        showToast('System error. Please try again.', 'error');
      }
    });
  </script>
</body>
</html>
