<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Viewport removed - desktop only -->

  <title>My Bookings - Mamagan Beach Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-md shadow-sm z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="/" class="flex items-center gap-2">
          <img src="/images/logos/LOGO.png" alt="Mamagan" class="h-12"><span class="font-bold text-2xl text-ocean-800">Mamagan Fun & Adventure Beach Resort</span>
        </a>
        <div class="hidden md:flex items-center gap-6">
          <a href="/resorts.html" class="text-gray-600 hover:text-ocean-600 font-medium transition">Resorts</a>
          <div id="auth-nav" class="flex items-center gap-3">
            <!-- Auth links will be injected here by js/main.js -->
          </div>
        </div>
        <!-- Mobile menu button removed - desktop only -->

      </div>
    </div>
    <!-- Mobile menu removed - desktop only -->

  </nav>

  <main class="pt-24 pb-20">
    <div class="max-w-5xl mx-auto px-4">
      <div class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">My Bookings</h1>
          <p class="text-gray-500 mt-1">Manage your reservations and tickets</p>
        </div>
        <a href="/resorts.html" class="px-5 py-2.5 bg-ocean-500 text-white font-medium rounded-xl hover:bg-ocean-600 transition"><i class="fas fa-plus mr-2"></i>New Booking</a>
      </div>

      <div id="bookings-list" class="space-y-4">
        <div class="bg-white rounded-2xl p-6 border border-gray-100 animate-pulse">
          <div class="h-5 w-1/3 bg-gray-200 rounded mb-4"></div>
          <div class="h-4 w-2/3 bg-gray-200 rounded mb-2"></div>
          <div class="h-4 w-1/2 bg-gray-200 rounded"></div>
        </div>
        <div class="bg-white rounded-2xl p-6 border border-gray-100 animate-pulse">
          <div class="h-5 w-1/3 bg-gray-200 rounded mb-4"></div>
          <div class="h-4 w-2/3 bg-gray-200 rounded mb-2"></div>
          <div class="h-4 w-1/2 bg-gray-200 rounded"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/main.js?v=2"></script>
  <script>
    // Mobile menu functionality removed - desktop only


    if (!requireAuth()) throw new Error('Auth required');

    async function loadBookings() {
      const res = await api.get('/bookings/my');
      const container = document.getElementById('bookings-list');
      if (!res.success || !res.data.length) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-12 border border-gray-100 text-center">
            <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i class="fas fa-calendar-xmark text-gray-400 text-3xl"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-900 mb-2">No bookings yet</h3>
            <p class="text-gray-500 mb-6">You haven't made any reservations. Start exploring our facilities!</p>
            <a href="/resorts.html" class="inline-block px-6 py-3 bg-ocean-500 text-white font-medium rounded-xl hover:bg-ocean-600 transition">Browse Facilities</a>
          </div>
        `;
        return;
      }

      container.innerHTML = res.data.map(b => {
        const statusColors = {
          pending: 'bg-yellow-50 text-yellow-700 border-yellow-200',
          confirmed: 'bg-green-50 text-green-700 border-green-200',
          cancelled: 'bg-red-50 text-red-700 border-red-200',
          completed: 'bg-gray-50 text-gray-700 border-gray-200',
        };
        const payColors = {
          pending: 'text-yellow-600',
          paid: 'text-green-600',
          refunded: 'text-gray-500',
        };
        return `
          <div class="bg-white rounded-2xl p-6 border border-gray-100 card-hover">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div class="flex-1">
                <div class="flex items-center gap-3 mb-2">
                  <h3 class="font-semibold text-lg text-gray-900">${b.facility_name}</h3>
                  <span class="px-2.5 py-0.5 text-xs font-medium rounded-full border ${statusColors[b.status] || 'bg-gray-50 text-gray-700'}">${b.status.toUpperCase()}</span>
                </div>
                <div class="flex flex-wrap gap-4 text-sm text-gray-500">
                  <span><i class="fas fa-hotel mr-1 text-ocean-400"></i>${b.resort_name}</span>
                  <span><i class="fas fa-calendar mr-1 text-ocean-400"></i>${b.booking_date}</span>
                  <span><i class="fas fa-clock mr-1 text-ocean-400"></i>${b.time_slot}</span>
                  <span><i class="fas fa-users mr-1 text-ocean-400"></i>Qty: ${b.quantity}</span>
                </div>
                <div class="mt-3 flex items-center gap-4">
                  <span class="font-bold text-ocean-600">PHP ${Number(b.total_amount).toLocaleString('en-PH', {minimumFractionDigits: 2})}</span>
                  <span class="text-sm ${payColors[b.payment_status] || ''}"><i class="fas fa-circle text-[8px] mr-1"></i>${b.payment_status.toUpperCase()}</span>
                </div>
              </div>
              <div class="flex items-center gap-2">
                ${b.payment_status === 'paid' ? `
                  <a href="/ticket.html?booking=${b.id}" class="px-4 py-2 bg-ocean-50 text-ocean-700 font-medium rounded-lg hover:bg-ocean-100 transition text-sm"><i class="fas fa-ticket mr-1"></i>View Ticket</a>
                ` : b.status !== 'cancelled' ? `
                  <a href="/payment.html?booking=${b.id}" class="px-4 py-2 bg-ocean-500 text-white font-medium rounded-lg hover:bg-ocean-600 transition text-sm">Pay Now</a>
                ` : ''}
                ${b.status !== 'cancelled' && b.status !== 'completed' ? `
                  <button onclick="cancelBooking('${b.id}')" class="px-4 py-2 border border-red-200 text-red-600 font-medium rounded-lg hover:bg-red-50 transition text-sm">Cancel</button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function cancelBooking(id) {
      if (!confirm('Are you sure you want to cancel this booking?')) return;
      const res = await api.patch(`/bookings/${id}/cancel`);
      if (res.success) {
        showToast('Booking cancelled successfully.', 'success');
        loadBookings();
      } else {
        showToast(res.message || 'Cancellation failed', 'error');
      }
    }

    loadBookings();
  </script>
</body>
</html>
