<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Reservations - Mamagan Beach Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-lux-cream font-sans text-lux-navy">
  <!-- Navbar -->
  <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-xl shadow-sm z-50 border-b border-lux-gold/10">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex justify-between items-center h-20">
        <a href="/" class="flex items-center gap-3">
          <img src="/images/logos/LOGO.png" alt="Mamagan" class="h-14">
          <span class="luxury-heading font-bold text-2xl text-lux-navy tracking-tight">Mamagan <span class="text-lux-gold">Beach</span></span>
        </a>
        <div class="hidden md:flex items-center gap-8">
          <a href="/resorts.html" class="text-lux-navy/70 hover:text-lux-gold font-medium transition-colors uppercase tracking-widest text-xs">Resorts</a>
          <a href="/my-bookings.html" class="text-lux-gold font-bold transition-colors uppercase tracking-widest text-xs">Bookings</a>
          <div id="auth-nav" class="flex items-center gap-4"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="pt-32 pb-32">
    <div class="max-w-5xl mx-auto px-6">
      <div class="flex flex-col md:flex-row justify-between items-center mb-16 gap-6">
        <div>
          <span class="text-lux-gold font-bold uppercase tracking-[0.3em] text-[10px] mb-2 block">Guest Portal</span>
          <h1 class="luxury-heading text-4xl font-bold text-lux-navy">My Reservations</h1>
          <p class="text-lux-navy/40 text-sm mt-1 font-light">Manage your upcoming escapes and digital passes.</p>
        </div>
        <a href="/resorts.html" class="px-8 py-4 bg-lux-navy text-white text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-lux-gold hover:shadow-2xl transition-all">
          <i class="fas fa-plus mr-2"></i>New Reservation
        </a>
      </div>

      <div id="bookings-list" class="space-y-8">
        <!-- Shimmer Loaders -->
        <div class="glass-card p-10 rounded-[2rem] premium-shadow border border-lux-navy/5">
          <div class="h-6 w-1/3 shimmer opacity-20 rounded mb-6"></div>
          <div class="h-4 w-2/3 shimmer opacity-10 rounded mb-3"></div>
          <div class="h-4 w-1/2 shimmer opacity-10 rounded"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-lux-dark text-white/50 py-16 border-t border-white/5">
    <div class="max-w-7xl mx-auto px-6 text-center text-[10px] uppercase tracking-[0.3em] font-bold">
      &copy; 2024 Mamagan Beach Resort Collection. All rights reserved.
    </div>
  </footer>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/main.js?v=2"></script>
  <script>
    if (!requireAuth()) throw new Error('Auth required');

    async function loadBookings() {
      const res = await api.get('/bookings/my');
      const container = document.getElementById('bookings-list');
      if (!res.success || !res.data.length) {
        container.innerHTML = `
          <div class="glass-card rounded-[3rem] p-20 text-center border border-lux-navy/5">
            <div class="w-24 h-24 bg-lux-navy/5 rounded-full flex items-center justify-center mx-auto mb-8 border border-lux-navy/5">
              <i class="fas fa-calendar-xmark text-lux-navy/20 text-3xl"></i>
            </div>
            <h3 class="luxury-heading text-2xl font-bold text-lux-navy mb-4">No reservations found</h3>
            <p class="text-lux-navy/40 mb-10 italic max-w-sm mx-auto font-light">Your itinerary is empty. Begin your journey by exploring our exclusive facilities.</p>
            <a href="/resorts.html" class="inline-block px-10 py-5 bg-lux-navy text-white text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-lux-gold hover:shadow-2xl transition-all">Browse Collection</a>
          </div>
        `;
        return;
      }

      container.innerHTML = res.data.map(b => {
        const statusColors = {
          pending: 'bg-lux-gold/10 text-lux-gold border-lux-gold/20',
          confirmed: 'bg-green-500/10 text-green-600 border-green-500/20',
          cancelled: 'bg-red-500/10 text-red-600 border-red-500/20',
          completed: 'bg-lux-navy/10 text-lux-navy/50 border-lux-navy/20',
        };
        const payColors = {
          pending: 'text-lux-gold',
          paid: 'text-green-600',
          refunded: 'text-lux-navy/30',
        };
        return `
          <div class="glass-card rounded-[2rem] p-8 md:p-10 border border-lux-navy/5 card-hover fade-in">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-8">
              <div class="flex-1">
                <div class="flex items-center gap-4 mb-6">
                  <h3 class="luxury-heading font-bold text-2xl text-lux-navy">${b.facility_name}</h3>
                  <span class="px-4 py-1 text-[8px] font-black uppercase tracking-[0.2em] rounded-full border ${statusColors[b.status] || 'bg-lux-navy/5 text-lux-navy/40'}">${b.status}</span>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-8">
                  <div class="space-y-1">
                    <span class="block text-[8px] font-black uppercase tracking-widest text-lux-navy/20">Destination</span>
                    <span class="text-xs font-bold text-lux-navy/60"><i class="fas fa-hotel mr-2 text-lux-gold"></i>${b.resort_name}</span>
                  </div>
                  <div class="space-y-1">
                    <span class="block text-[8px] font-black uppercase tracking-widest text-lux-navy/20">Date</span>
                    <span class="text-xs font-bold text-lux-navy/60"><i class="fas fa-calendar mr-2 text-lux-gold"></i>${b.booking_date}</span>
                  </div>
                  <div class="space-y-1">
                    <span class="block text-[8px] font-black uppercase tracking-widest text-lux-navy/20">Time Window</span>
                    <span class="text-xs font-bold text-lux-navy/60"><i class="fas fa-clock mr-2 text-lux-gold"></i>${b.time_slot}</span>
                  </div>
                  <div class="space-y-1">
                    <span class="block text-[8px] font-black uppercase tracking-widest text-lux-navy/20">Allocation</span>
                    <span class="text-xs font-bold text-lux-navy/60"><i class="fas fa-users mr-2 text-lux-gold"></i>${b.quantity} units</span>
                  </div>
                </div>
                <div class="flex items-center gap-6 pt-6 border-t border-lux-navy/5">
                  <div class="flex flex-col">
                    <span class="text-[8px] font-black uppercase tracking-widest text-lux-navy/20 mb-1">Total Investment</span>
                    <span class="text-xl font-black text-lux-navy">PHP ${Number(b.total_amount).toLocaleString('en-PH', {minimumFractionDigits: 2})}</span>
                  </div>
                  <div class="flex flex-col">
                    <span class="text-[8px] font-black uppercase tracking-widest text-lux-navy/20 mb-1">Settlement</span>
                    <span class="text-[10px] font-black uppercase tracking-widest ${payColors[b.payment_status] || ''}"><i class="fas fa-circle text-[6px] mr-2"></i>${b.payment_status}</span>
                  </div>
                </div>
              </div>
              <div class="flex flex-row md:flex-col gap-3">
                ${b.payment_status === 'paid' ? `
                  <a href="/ticket.html?booking=${b.id}" class="px-6 py-3 bg-lux-navy text-white text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-lux-gold transition-all text-center"><i class="fas fa-ticket mr-2"></i>Access Pass</a>
                ` : b.status !== 'cancelled' ? `
                  <a href="/payment.html?booking=${b.id}" class="px-6 py-3 bg-lux-gold text-lux-navy text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-white hover:shadow-xl transition-all text-center">Finalize Payment</a>
                ` : ''}
                ${b.payment_status === 'paid' && b.status === 'cancelled' ? `
                  <button onclick="requestRefund('${b.id}')" class="px-6 py-3 bg-white border border-lux-gold text-lux-gold text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-lux-gold hover:text-white transition-all text-center">Request Refund</button>
                ` : ''}
                ${b.status !== 'cancelled' && b.status !== 'completed' ? `
                  <button onclick="cancelBooking('${b.id}')" class="px-6 py-3 border border-lux-navy/5 text-lux-navy/40 text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-red-50 hover:text-red-600 hover:border-red-100 transition-all">Relinquish</button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function cancelBooking(id) {
      if (!confirm('Are you certain you wish to relinquish this reservation?')) return;
      const res = await api.patch(`/bookings/${id}/cancel`);
      if (res.success) {
        showToast('Reservation relinquished successfully.', 'success');
        loadBookings();
      } else {
        showToast(res.message || 'Operation failed', 'error');
      }
    }

    async function requestRefund(id) {
      if (!confirm('Would you like to initiate a refund request for this reservation? Our concierge will review it shortly.')) return;
      // In a real system, this would call a refund API
      // For now, we'll simulate the request
      showToast('Refund request submitted to the treasury.', 'success');
      // We could update the status to 'refund_pending' if the API supported it
    }

    loadBookings();
  </script>
</body>
</html>
