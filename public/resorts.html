<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Viewport removed - desktop only -->

  <title>Browse Facilities - Mamagan Beach Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">
  <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-md shadow-sm z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="/" class="flex items-center gap-2">
          <img src="/images/logos/LOGO.png" alt="Mamagan" class="h-12"><span class="font-bold text-2xl text-ocean-800">Mamagan Fun & Adventure Beach Resort</span>
        </a>
        <div class="hidden md:flex items-center gap-6">
          <a href="/resorts.html" class="text-ocean-600 font-medium">Resorts</a>
          <div id="auth-nav" class="flex items-center gap-3">
            <!-- Auth links will be injected here by js/main.js -->
          </div>
        </div>
        <!-- Mobile menu button removed - desktop only -->

      </div>
    </div>
    <!-- Mobile menu removed - desktop only -->

  </nav>

  <main class="pt-24 pb-20">
    <div class="max-w-7xl mx-auto px-4">
      <div class="text-center mb-12">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-3">Our Beach Facilities</h1>
        <p class="text-gray-500 max-w-xl mx-auto">Choose from premium cabanas, thrilling water sports, and unforgettable island tours.</p>
      </div>

      <!-- Search & Filters -->
      <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-10">
        <div class="relative w-full md:max-w-md">
          <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="facility-search" oninput="searchFacilities(this.value)" class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:border-ocean-400 focus:ring-2 focus:ring-ocean-100 outline-none" placeholder="Search facilities by name...">
        </div>

        <!-- Filter Tabs -->
        <div class="flex flex-wrap justify-center gap-2">
          <button onclick="filterFacilities('all')" class="filter-btn active px-5 py-2 rounded-full text-sm font-medium bg-ocean-500 text-white transition">All</button>
          <button onclick="filterFacilities('cabana')" class="filter-btn px-5 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:border-ocean-300 transition">Cabanas</button>
          <button onclick="filterFacilities('day_bed')" class="filter-btn px-5 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:border-ocean-300 transition">Day Beds</button>
          <button onclick="filterFacilities('jet_ski')" class="filter-btn px-5 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:border-ocean-300 transition">Jet Skis</button>
          <button onclick="filterFacilities('island_tour')" class="filter-btn px-5 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:border-ocean-300 transition">Island Tours</button>
        </div>
      </div>

      <div id="facilities-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Skeleton -->
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100">
          <div class="h-56 shimmer"></div>
          <div class="p-6">
            <div class="h-5 w-3/4 shimmer rounded mb-3"></div>
            <div class="h-4 w-full shimmer rounded mb-2"></div>
            <div class="h-4 w-2/3 shimmer rounded"></div>
          </div>
        </div>
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100">
          <div class="h-56 shimmer"></div>
          <div class="p-6">
            <div class="h-5 w-3/4 shimmer rounded mb-3"></div>
            <div class="h-4 w-full shimmer rounded mb-2"></div>
            <div class="h-4 w-2/3 shimmer rounded"></div>
          </div>
        </div>
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100">
          <div class="h-56 shimmer"></div>
          <div class="p-6">
            <div class="h-5 w-3/4 shimmer rounded mb-3"></div>
            <div class="h-4 w-full shimmer rounded mb-2"></div>
            <div class="h-4 w-2/3 shimmer rounded"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-gray-900 text-gray-400 py-10">
    <div class="max-w-7xl mx-auto px-4 text-center text-sm"> Mamagan Beach Resort. All rights reserved.</div>
  </footer>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script src="/js/main.js?v=2"></script>
  <script>
    // Mobile menu functionality removed - desktop only


    let allFacilities = [];
    let currentResort = null;
    let currentFilter = 'all';

    async function loadFacilities() {
      try {
        const resorts = await api.get('/resorts');
        if (!resorts.success || !resorts.data.length) {
          showToast('Could not load facilities.', 'error');
          return;
        }
        currentResort = resorts.data[0];
        const detail = await api.get(`/resorts/${currentResort.id}`);
        allFacilities = detail.data?.facilities || [];
        applyFilters();
      } catch (e) {
        console.error(e);
        showToast('Failed to load facilities.', 'error');
      }
    }

    function renderFacilities(list) {
      const container = document.getElementById('facilities-grid');
      if (!list.length) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i class="fas fa-search text-gray-400 text-2xl"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-900 mb-1">No facilities found</h3>
            <p class="text-gray-500">Try adjusting your search or filters.</p>
          </div>
        `;
        return;
      }
      container.innerHTML = list.map(f => `
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm card-hover border border-gray-100 fade-in">
          <div class="h-56 bg-cover bg-center relative" style="background-image: url('${f.images?.[0] || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600'}')">
            <div class="absolute top-4 left-4">
              <span class="px-3 py-1 bg-white/90 backdrop-blur text-ocean-700 text-xs font-semibold rounded-full capitalize">${f.type.replace('_',' ')}</span>
            </div>
          </div>
          <div class="p-6">
            <h3 class="font-semibold text-lg text-gray-900 mb-2">${f.name}</h3>
            <p class="text-gray-500 text-sm mb-4 line-clamp-2">${f.description || ''}</p>
            <div class="flex items-center gap-4 text-sm text-gray-500 mb-4">
              <span><i class="fas fa-user-group mr-1 text-ocean-400"></i>Up to ${f.capacity}</span>
              <span><i class="fas fa-layer-group mr-1 text-ocean-400"></i>${f.total_units} units</span>
            </div>
            <div class="flex justify-between items-center pt-4 border-t border-gray-100">
              <div>
                <span class="text-2xl font-bold text-ocean-600">PHP ${Number(f.base_price).toLocaleString()}</span>
                <span class="text-gray-400 text-sm">/slot</span>
              </div>
              <a href="/booking.html?facility=${f.id}" class="px-5 py-2.5 bg-ocean-500 text-white font-medium rounded-xl hover:bg-ocean-600 transition">Book Now</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterFacilities(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-ocean-500', 'text-white');
        btn.classList.add('bg-white', 'text-gray-600', 'border', 'border-gray-200');
      });
      event.target.classList.remove('bg-white', 'text-gray-600', 'border', 'border-gray-200');
      event.target.classList.add('bg-ocean-500', 'text-white');
      applyFilters();
    }

    function searchFacilities(query) {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('facility-search').value.trim().toLowerCase();
      let filtered = allFacilities;
      if (currentFilter !== 'all') {
        filtered = filtered.filter(f => f.type === currentFilter);
      }
      if (query) {
        filtered = filtered.filter(f => 
          f.name.toLowerCase().includes(query) ||
          (f.description && f.description.toLowerCase().includes(query)) ||
          f.type.toLowerCase().includes(query)
        );
      }
      renderFacilities(filtered);
    }

    loadFacilities();
  </script>
</body>
</html>
