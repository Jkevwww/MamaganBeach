<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve Your Escape - Mamagan Beach Resort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body class="bg-lux-cream font-sans text-lux-navy">
  <!-- Navbar -->
  <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-xl shadow-sm z-50 border-b border-lux-gold/10">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex justify-between items-center h-20">
        <a href="/" class="flex items-center gap-3">
          <img src="/images/logos/LOGO.png" alt="Mamagan" class="h-14">
          <span class="luxury-heading font-bold text-2xl text-lux-navy tracking-tight">Mamagan Fun & Adventure<span class="text-lux-gold"> Beach Resort</span></span>
        </a>
        <div class="hidden md:flex items-center gap-8">
          <a href="/resorts.html" class="text-lux-navy/70 hover:text-lux-gold font-medium transition-colors uppercase tracking-widest text-xs">Resorts</a>
          <a href="/my-bookings.html" class="text-lux-navy/70 hover:text-lux-gold font-medium transition-colors uppercase tracking-widest text-xs">Bookings</a>
          <div id="auth-nav" class="flex items-center gap-4"></div>
        </div>
        <button class="md:hidden text-gray-600 text-xl" aria-label="Toggle menu" title="Toggle menu" aria-expanded="false" aria-controls="mobile-menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="pt-32 pb-32">
    <div class="max-w-6xl mx-auto px-6">
      <a href="/resorts.html" class="inline-flex items-center gap-2 text-lux-navy/40 hover:text-lux-gold mb-10 transition-colors uppercase tracking-widest text-[10px] font-bold">
        <i class="fas fa-arrow-left"></i> Back to Collection
      </a>
      
      <div class="grid lg:grid-cols-3 gap-10">
        <!-- Booking Form -->
        <div class="lg:col-span-2 space-y-10">
          <div class="glass-card p-10 md:p-12 rounded-[2rem] premium-shadow">
            <h1 class="luxury-heading text-4xl font-bold text-lux-navy mb-10">Reserve Your Escape</h1>
            
            <div id="facility-info" class="flex gap-6 mb-10 p-6 bg-white/50 rounded-2xl border border-lux-navy/5">
              <div class="w-24 h-24 rounded-2xl bg-cover bg-center flex-shrink-0" id="facility-img"></div>
              <div class="flex flex-col justify-center">
                <h2 class="luxury-heading font-bold text-xl text-lux-navy" id="facility-name">Loading...</h2>
                <p class="text-[10px] font-black uppercase tracking-widest text-lux-gold" id="facility-type"></p>
                <p class="text-xl font-bold text-lux-navy mt-1" id="facility-price"></p>
                <p class="text-[10px] font-bold text-lux-navy/30 uppercase tracking-widest mt-2 hidden" id="facility-size-badge"></p>
              </div>
            </div>

            <form id="booking-form" class="space-y-8">
              <div>
                <label class="block text-[10px] font-black uppercase tracking-widest text-lux-navy/40 mb-3">Select Date</label>
                <input type="text" id="date-picker" class="w-full px-6 py-4 rounded-2xl bg-white border-2 border-lux-navy/20 focus:border-lux-gold outline-none transition-all text-lux-navy font-semibold" placeholder="Pick a date" required>
                <p class="text-[10px] text-lux-navy/40 mt-2 font-medium">Format: YYYY-MM-DD</p>
              </div>

              <div>
                <label class="block text-[10px] font-black uppercase tracking-widest text-lux-navy/40 mb-3">Select Time Slot</label>
                <div id="time-slots" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                  <div class="text-lux-navy/20 text-xs py-8 text-center border-2 border-dashed border-lux-navy/20 rounded-2xl font-semibold">Select a date first</div>
                </div>
              </div>

              <div>
                <label for="quantity" class="block text-[10px] font-black uppercase tracking-widest text-lux-navy/40 mb-3">Quantity</label>
                <div class="flex items-center gap-4">
                  <button type="button" onclick="changeQty(-1)" id="qty-minus" title="Decrease quantity" aria-label="Decrease quantity" class="w-14 h-14 rounded-full border-2 border-lux-navy/30 hover:border-lux-gold hover:text-lux-gold hover:bg-lux-gold/5 transition-all duration-200 font-bold flex items-center justify-center">
                    <i class="fas fa-minus text-lg"></i>
                  </button>
                  <input type="number" id="quantity" value="1" min="1" aria-label="Quantity" placeholder="1" class="w-24 text-center py-4 rounded-2xl border-2 border-lux-navy/20 font-black text-lux-navy text-lg" readonly>
                  <button type="button" onclick="changeQty(1)" id="qty-plus" title="Increase quantity" aria-label="Increase quantity" class="w-14 h-14 rounded-full border-2 border-lux-navy/30 hover:border-lux-gold hover:text-lux-gold hover:bg-lux-gold/5 transition-all duration-200 font-bold flex items-center justify-center">
                    <i class="fas fa-plus text-lg"></i>
                  </button>
                </div>
                <p id="qty-hint" class="text-[10px] font-bold uppercase tracking-widest text-lux-navy/30 mt-3"></p>
              </div>

              <button type="submit" id="book-btn" class="w-full py-6 bg-gradient-to-r from-lux-navy to-lux-navy/80 text-white font-black uppercase tracking-widest rounded-full hover:shadow-2xl hover:from-lux-gold hover:to-lux-gold/80 transition-all duration-300 flex items-center justify-center gap-4 border-2 border-transparent hover:border-lux-navy">
                <span>Confirm Reservation</span>
                <i id="book-spinner" class="fas fa-circle-notch fa-spin hidden"></i>
              </button>
            </form>
          </div>
        </div>

        <!-- Summary Sidebar -->
        <div class="lg:col-span-1">
          <div class="glass-card p-8 rounded-[2rem] sticky top-32 premium-shadow">
            <h3 class="luxury-heading font-bold text-2xl text-lux-navy mb-8">Summary</h3>
            <div class="space-y-6 text-sm font-light text-lux-navy/70">
              <div class="flex justify-between border-b border-lux-navy/5 pb-4"><span class="font-bold uppercase tracking-widest text-[10px] text-lux-navy/30">Facility</span><span class="font-medium" id="summary-facility">-</span></div>
              <div class="flex justify-between border-b border-lux-navy/5 pb-4"><span class="font-bold uppercase tracking-widest text-[10px] text-lux-navy/30">Date</span><span class="font-medium" id="summary-date">-</span></div>
              <div class="flex justify-between border-b border-lux-navy/5 pb-4"><span class="font-bold uppercase tracking-widest text-[10px] text-lux-navy/30">Time</span><span class="font-medium" id="summary-time">-</span></div>
              <div class="flex justify-between border-b border-lux-navy/5 pb-4"><span class="font-bold uppercase tracking-widest text-[10px] text-lux-navy/30">Quantity</span><span class="font-medium" id="summary-qty">1</span></div>
            </div>
            <div class="mt-8 pt-8 border-t border-lux-navy/10">
              <div class="flex justify-between items-center">
                <span class="font-black uppercase tracking-widest text-[10px] text-lux-navy/30">Total</span>
                <span class="text-3xl font-black text-lux-navy" id="summary-total">PHP 0</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/toast.js?v=2"></script>
  <script>
    if (!requireAuth()) throw new Error('Auth required');

    const params = new URLSearchParams(window.location.search);
    const facilityId = params.get('facility');
    let facility = null;
    let selectedDate = null;
    let selectedSlot = null;
    let currentPrice = 0;
    let maxQty = 10; // Default max guests
    let minQty = 1;
    let isNight = false;


    async function loadFacility() {
      if (!facilityId) { window.location.href = '/resorts.html'; return; }
      const res = await api.get(`/facilities/${facilityId}`);
      if (!res.success) { window.location.href = '/resorts.html'; return; }
      facility = res.data;
      maxQty = Math.min(facility.capacity || 10, 10);
      document.getElementById('facility-name').textContent = facility.name;
      document.getElementById('facility-type').textContent = facility.type.replace('_', ' ').toUpperCase();
      const priceMin = Number(facility.price_day_min ?? facility.base_price ?? 0);
      const priceMax = Number(facility.price_day_max ?? facility.base_price ?? 0);
      const showRange = priceMin > 0 && priceMax > 0 && priceMin !== priceMax;

      document.getElementById('facility-price').textContent = showRange
        ? `PHP ${priceMin.toLocaleString()} - ${priceMax.toLocaleString()}`
        : `PHP ${Math.max(priceMin, priceMax).toLocaleString()}`;

      const sizeBadge = document.getElementById('facility-size-badge');
      if (sizeBadge) {
        const size = facility.size ? facility.size.replace('_', ' ') : '';
        sizeBadge.textContent = size ? `Size: ${size.toUpperCase()}` : '';
        sizeBadge.classList.toggle('hidden', !size);
      }

      document.getElementById('facility-img').style.backgroundImage = `url('${facility.images?.[0] || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=200'}')`;
      document.getElementById('summary-facility').textContent = facility.name;

      // Use max day price as unit base for total computation (night add-ons handled server-side)
      currentPrice = Number(facility.price_day_max ?? facility.price_day_min ?? facility.base_price ?? 0);
      updateTotal();
      updateQtyButtons();
      
      // Load blocked dates for this facility (availability/capacity is enforced server-side)
      const unavailableRes = await api.get(`/bookings/unavailable-dates?facility_id=${facilityId}`);
      const blockedDates = unavailableRes.success ? unavailableRes.data : [];
      
      initCalendar(blockedDates);

    }

    function isBeachEquipmentCategory(category) {
      return category === 'beach_equipment';
    }

    function isPickHourTimeSlot(time_slot) {
      // Must match backend heuristic in routes/bookings.js
      return /(06:00|07:00|08:00|09:00|10:00|11:00|pick|morning)/i.test(time_slot);
    }

    function initCalendar(blockedDates) {
      try {
        // Ensure flatpickr is loaded
        if (typeof flatpickr === 'undefined') {
          console.error('Flatpickr not loaded. Please ensure the library is included.');
          return;
        }
        
        flatpickr('#date-picker', {
          minDate: 'today',
          maxDate: new Date(Date.now() + 60 * 86400000), // 60 days range
          dateFormat: 'Y-m-d',
          disable: blockedDates,
          onChange: async (dates) => {
            if (dates.length) {
              selectedDate = dates[0].toISOString().split('T')[0];
              document.getElementById('summary-date').textContent = selectedDate;
              await loadAvailability(selectedDate);
            }
          },
          onError: (dateStr, key, config) => {
            console.error('Calendar error:', dateStr, key, config);
            showToast('Calendar initialization error. Please refresh the page.', 'error');
          }
        });
      } catch (e) {
        console.error('Calendar init error:', e);
        showToast('Failed to initialize calendar.', 'error');
      }
    }

    async function loadAvailability(date) {
      const res = await api.get(`/facilities/${facilityId}/availability?date=${date}`);
      const container = document.getElementById('time-slots');
      if (!res.success || !res.data.length) {
        container.innerHTML = '<div class="col-span-full text-lux-navy/30 text-xs py-6 text-center border border-dashed border-lux-navy/10 rounded-2xl">No slots available.</div>';
        return;
      }

      const category = facility?.category;
      const isBeachEquip = isBeachEquipmentCategory(category);

      container.innerHTML = res.data.map(slot => {
        const pickHour = isBeachEquip ? isPickHourTimeSlot(slot.time_slot) : false;
        const blocked = !!slot.is_blocked;
        const noQty = Number(slot.available) < 1;
        const disabled = blocked || noQty || pickHour;

        const statusText = pickHour
          ? 'Pick hours not allowed'
          : (blocked ? 'Blocked' : (slot.available + ' available'));

        const statusClass = pickHour
          ? 'text-coral-500'
          : (blocked ? 'text-coral-500' : (slot.available < 3 ? 'text-sand-600' : 'text-lux-gold'));

        return `
          <button type="button" 
            onclick="selectSlot('${slot.time_slot}', ${slot.available}, ${slot.is_blocked}${pickHour ? ', true' : ''})"
            class="slot-btn px-6 py-4 rounded-2xl border-2 text-sm font-bold transition-all duration-200 ${disabled ? 'opacity-40 cursor-not-allowed border-lux-navy/10 bg-gray-50' : 'border-lux-navy/20 hover:border-lux-gold hover:bg-lux-gold/5 hover:shadow-md'}"
            ${disabled ? 'disabled' : ''}
            data-slot="${slot.time_slot}"
          >
            <div class="mb-2 text-base font-black">${slot.time_slot}</div>
            <div class="text-[11px] font-black uppercase ${statusClass}">
              ${statusText}
            </div>
          </button>
        `;
      }).join('');
    }

    function selectSlot(slot, available, blocked) {
      if (blocked || available < 1) return;
      selectedSlot = slot;
      isNight = /^\d{2}:\d{2}-\d{2}:\d{2}$/.test(slot) ? (slot.startsWith('16') || slot.startsWith('18') || slot.startsWith('20')) : false;

      // Update max based on actual slot availability if lower than capacity
      const slotMax = Math.min(available, facility.capacity || 10);
      maxQty = slotMax;
      
      document.querySelectorAll('.slot-btn').forEach(btn => btn.classList.remove('bg-lux-navy', 'text-white'));
      document.querySelector(`[data-slot="${slot}"]`).classList.add('bg-lux-navy', 'text-white');
      document.getElementById('summary-time').textContent = slot;
      document.getElementById('qty-hint').textContent = `Up to ${maxQty} guests allowed`;
      
      // Reset qty if current exceeds new max
      const input = document.getElementById('quantity');
      if (parseInt(input.value) > maxQty) {
        input.value = maxQty;
        document.getElementById('summary-qty').textContent = maxQty;
      }
      
      updateTotal();
      updateQtyButtons();
    }

    function changeQty(delta) {
      const input = document.getElementById('quantity');
      let val = parseInt(input.value) + delta;
      
      if (val < minQty) val = minQty;
      if (val > maxQty) val = maxQty;
      
      input.value = val;
      document.getElementById('summary-qty').textContent = val;
      updateTotal();
      updateQtyButtons();
    }
    
    function updateQtyButtons() {
      const input = document.getElementById('quantity');
      const val = parseInt(input.value);
      document.getElementById('qty-minus').disabled = val <= minQty;
      document.getElementById('qty-plus').disabled = val >= maxQty;
    }
    window.changeQty = changeQty;

    function updateTotal() {
      const qty = parseInt(document.getElementById('quantity').value);
      // Display-only estimate (final pricing computed server-side in /bookings)
      const total = currentPrice * qty;
      document.getElementById('summary-total').textContent = `PHP ${total.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }

    document.getElementById('booking-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!selectedDate || !selectedSlot) {
        showToast('Please select a date and time slot.', 'warning');
        return;
      }
      const btn = document.getElementById('book-btn');
      const spinner = document.getElementById('book-spinner');
      btn.disabled = true;
      spinner.classList.remove('hidden');

      const res = await api.post('/bookings', {
        facility_id: facilityId,
        booking_date: selectedDate,
        time_slot: selectedSlot,
        quantity: parseInt(document.getElementById('quantity').value),
      });

      btn.disabled = false;
      spinner.classList.add('hidden');

      if (res.success) {
        window.location.href = `/payment.html?booking=${res.data.id}`;
      } else {
        showToast(res.message || 'Booking failed', 'error');
      }
    });

    // Ensure DOM is ready before initializing calendar
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadFacility);
    } else {
      loadFacility();
    }
  </script>
</body>
</html>
